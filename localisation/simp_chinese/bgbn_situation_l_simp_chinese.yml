l_simp_chinese:
 situation_Reconstruction: "母星重建"
 situation_Reconstruction_desc: "自那场旷日持久的全球战争与漫长煎熬的联合谈判后，由poppin' party乐队成员领导的大少女乐团国闪耀联合政府，在痛苦到令人麻木的连年战乱之中逐渐获得了我们所有人的支持与信仰，最终成为了星球上全体每一个人的共同选择。巴别塔与阿房宫也仿佛将要高耸。然而，我们没有多余的时间为这晨星之下至高的权柄而荣耀，因为土地之上的各处依然野火未熄。各处大陆上在谈判中统合到联合政府下的地区需要我们重建秩序；在战争中被铁蹄与炮火反复蹂躏的军事基地、边疆重城和生产设施需要接管与重建；而在云层之上，还有因常年战火而搁置与军事化的众多太空设施而等待着再次向星空启程。我们将会看到闪耀的梦想宣扬，还是将再次见证巴别中殂，阿房焦土？"
 Reconstruction.1.name: "闪耀统合"
 Reconstruction.1.desc: "自那场旷日持久的全球战争与漫长煎熬的联合谈判后，由poppin' party乐队成员领导的大少女乐团国闪耀联合政府，在痛苦到令人麻木的连年战乱之中逐渐获得了我们所有人的支持与信仰，最终成为了星球上全体每一个人的共同选择。巴别塔与阿房宫也仿佛将要高耸。然而，我们没有多余的时间为这晨星之下至高的权柄而荣耀，因为土地之上的各处依然野火未熄。各处大陆上在谈判中统合到联合政府下的地区需要我们重建秩序；在战争中被铁蹄与炮火反复蹂躏的军事基地、边疆重城和生产设施需要接管与重建；而在云层之上，还有因常年战火而搁置与军事化的众多太空设施而等待着再次向星空启程。我们将会看到闪耀的梦想宣扬，还是将再次见证巴别中殂，阿房焦土？"
 Reconstruction.1.a: "前进，未来"
 Reconstruction.2.name: "重建秩序"
 Reconstruction.2.desc: "数万年前，部落间的小规模冲突、突袭和谋杀会带走11%以上的人口；而在最近的几千年内，游牧民族远征扫荡，王朝争斗，崩塌等等依旧会导致5%左右的人口死亡；而在几次工业革命后，哪怕是各处的殖民战争与数次世界大战，能如死神般收割生命的热武器广泛被应用，死亡人口比例依旧在1%到3%游动；而到了现代，战争导致的人口死亡已经不足1%。随着时代的发展，战死与屠杀似乎离我们越来越遥远，和平似乎真的即将降临到我们头上。然而，当战争切实降临时，再低的比例对于一个国家，一个民族，一个家族或是一个家庭来说，都是无法承受之痛。"
 Reconstruction.2.a: "不能再有类似的事发生了"
 Reconstruction.3.name: "东亚复兴"
 Reconstruction.3.desc: "“因为对附近一座工业园区的打击导致的电网电压震荡，这个省的供电已经中断了超过半个月。。。”“这里需要更多的公务员分配进入岗位，本地复员人数不足，青壮年在前线伤亡过高。。。”作为D球上最大的人口密集区域，东亚的绝大多数并没有直接被战火蹂躏。但战争带来的长期的配给制，义务兵役，以及不时的避难和物资流通不畅等等依旧将这片地区的人力物力压榨到了极限，重启生产和市场复苏势在必行。然而，民间的市场已经完全崩溃，人们对任何当地或者新进管理者的信任也都下降到了冰点。"
 Reconstruction.3.a: "使用超级计算机模拟，实施完全指令式的生产方案。"
 Reconstruction.3.b: "完全开放物资流通，让市场自行恢复与调节。"
 Reconstruction.4.name: "算力的大手"
 Reconstruction.4.desc: "联合政府的超级计算机以前所未有的算力投入运转。它吞噬了东亚地区所有可用的数据——人口分布、幸存工业设施清单、矿产储量、物流网络残骸、乃至战后民众的基础需求模型。数日之内，一份精确到令人畏惧的生产与分配计划便下达到了每一个被接管的地区。计划之下，没有市场，没有货币，只有指令与执行。起初，这种冰冷的效率引起了民众的疑虑与不安，但当第一批由统合调度的电力重新点亮城市，当标准化的营养餐与生活物资精准地出现在每个家庭门口时，怀疑逐渐被一种复杂的服从所取代。重建以一种近乎奇迹的速度进行着：废弃的工厂在指令下开始生产标准化的建材，修复后的铁路干线上奔驰着满载资源的列车。东亚变成了一部巨大而精密的机器，每一个人都是其中一个沉默而高效的运转部件。秩序在废墟上被强制重建，社会功能迅速恢复。然而，在这沉默而精准的交响乐之下，个体的梦想与市场的活力被暂时压制。人们获得了生存的保障，却也感到一种无形的束缚。闪耀联合政府用理性与算力赢得了重建的第一场战役，但如何在这片被“完美规划”的土地上重新点燃人们心中的“闪耀梦想”，将是他们下一个，也是更艰巨的挑战。"
 Reconstruction.4.a: "愿我们都能有更美好的未来"
 Reconstruction.5.name: "哈耶克的神之手"
 Reconstruction.5.desc: "联合政府的法令如同一块投入死水的巨石，激起了剧烈的波澜。没有人能说清楚为什么，市场的“无形之手”开始展现其野草般的生命力。一些拥有技能的技工自发组成了维修队，用服务换取食物；一些村庄开始利用本地资源进行小规模生产，并与邻近聚落形成了最初的以物易物网络。很快，这些零星的火种开始燎原。商路在废墟间被重新开辟出来，新的交易中心在城市的残骸上自发形成。联合政府仅提供最低限度的武力保护与法理承认，剩下的则完全交由民间。数月后，一个充满活力、但也泥沙俱下的全新市场经济在东亚复活。重建速度或许不如指令式方案那般整齐划一，却充满了创新与韧性。财富与机遇并存，但也迅速拉开了贫富的差距。东亚在自由的空气中获得了新生，但也孕育了新的社会矛盾。闪耀联合政府成功地让土地恢复了脉动，但如何引导这股汹涌而原始的资本洪流，让光芒能照耀到每一个人，成为了摆在他们面前的崭新考卷。"
 Reconstruction.5.a: "愿我们都能有更美好的未来"
 Reconstruction.6.name: "再建北美"
 Reconstruction.6.desc: "尽管远离被称为“世界岛”的亚欧大陆，天生具有离岸优势，但在汹涌的全球意识形态冲突的浪潮之下，北美依旧无法幸免于难——极端，纯粹，理想，荣光，爱，恨，种种因素推动着北美洲上帝的子民，掀起了一场原子能时代的圣战。在长达数年的联合谈判之后，北美全境终于达成了无条件停火的共识，然而，北美原有的的秩序已经完全被粉碎——不仅在地方上处处存在着的军事割据与政治敌视，甚至连气象、河道、山脉等自然秩序也都已经被大规模军事化的利用，几乎无法得到自然恢复。这使得北美地区的重建变得异常困难。在经过严密的评估后，闪耀联合政府最终提出了“北美平原农业繁荣圈”北美重建计划，旨在利用遗留的大量环境改造用军事设施，完全重塑被毁坏的自然秩序，乃至真正的在北美大地上创造一个水草肥美的伊甸园。"
 Reconstruction.6.a: "这是我们迈向星空的基石"
 Reconstruction.7.name: "地上天堂"
 Reconstruction.7.desc: "战争的余烬终于在北美大陆上彻底熄灭，但留下的并非和平的静谧，而是一片被扭曲的死寂。这片曾被上帝许诺的土地，似乎已被神与人共同遗弃。然而，闪耀联合政府的“北美平原农业繁荣圈”计划，以前所未有的决心与力量，向这片破碎的大地发起了挑战。曾用于撕裂大地的军用地形改造机，开始吟唱创造的新歌。它们推平了扭曲的地块，重新规划了水系的流向，巨大的大气处理器阵列开始日夜不休地清洗天空。武器化的气象卫星被重新编程，精确地引导着来自大洋的水汽，在需要的地方降下温润的甘霖。仅仅数年，奇迹便在北美大平原上诞生。这里成为了真正的“地上天堂”。地平线上，是无边无际、随风起伏的金色麦浪与翠绿稻田；水晶般清澈的灌溉运河如棋盘般纵横交错，精准地滋养着每一寸土地；天空被洗刷得湛蓝如洗，温和的阳光均匀地洒下。这里没有季节的无常，没有天灾的威胁，每一颗种子都能在最完美的环境中生长，为整个星球提供着源源不断的粮食。"
 Reconstruction.7.a: "人总是要上天堂的（不是）"
 Reconstruction.8.name: "深渊凝视"
 Reconstruction.8.desc: "如果说世界岛的其他区域承受的是战争的创伤，那么从东非大裂谷到阿拉伯半岛的这片广袤土地，承受的便是战争本身。这里是全球意识形态冲突的终极角斗场，是多方势力角力的绞肉机。战争的原则在这里被扭曲到了极致：主要的人口聚集地在一种诡异的默契下安然无恙，成为风暴眼中孤岛般的避难所；而城市之外的每一寸土地，从沙漠到稀树草原，都化为了铁与火的炼狱。这里没有平民，只有战士；没有生产，只有消耗。每一块岩石都可能被改造成掩体，每一片沙丘都见证过坦克的冲锋。当停战的钟声敲响，一个严峻的问题摆在了闪耀联合政府面前：如何处理这片被彻底“杀死”的土地？这里的土壤浸透了燃油与化学制剂，空气中弥漫着金属的腥味，大地布满了数不清的弹坑与扭曲的钢铁残骸。为数不多的幸存者们蜷缩在被战区包围的城市里，对外界的废土充满了恐惧。最终，联合政府做出了一个冷峻而大胆的决定：大部分战区将被永久封存，作为“统合战争纪念区”——一个巨大的、沉默的、警示后人的行星级伤疤。而在非洲东部，沉睡在地表之下的巨量矿产将被大规模开发，为全球重建提供血液。计划的冠冕明珠，则是坐落于东非大裂谷深处的“东非地幔深度开掘探索基地”。我们不再试图治愈地表的伤痕，而是要刺入星球的肌体，从地球最深邃的心跳中，为文明寻找全新的力量与未来。"
 Reconstruction.8.a: "这是来自我们的历史，我们的过去投来的凝视"
 Reconstruction.9.name: "重塑新生"
 Reconstruction.9.desc: "重建完成了。但或许，用“新生”来形容更为恰当。广袤的“统合战争纪念区”如今寂静无声。联合政府没有清理那些战争的残骸，风沙正在缓慢地掩埋坦克的履带与战机的机翼，生锈的炮管无声地指向天空。这里成为了一个无需言语的宏伟墓碑，任何踏入此地的“朝圣者”，都能感受到那场战争令人窒息的沉重。而在纪念区的边缘，巨大的自动化矿业集群正以前所未有的效率运作着，将非洲大地深处的富饶矿藏转化为支撑全球重建的钢铁、稀土与能源。真正的奇迹，发生在东非大裂谷的腹地。一座银白色的巨塔拔地而起，它的基座并非建立在地表，而是深深扎入了地壳之下，直指地幔。这便是“东非地幔深度开掘探索基地”。它如同一根刺入地球心脏的探针，为人类文明带来了革命性的飞跃：在地幔高压环境中才能合成的全新材料，从基地的“锻炉”中源源不断地诞生；科学家们甚至在深部热液口附近发现了全新的、完全基于化学能的生命生态系统。东非，这片昔日最残酷的战场，如今成为了整个星球的动力核心与科学前沿。"
 Reconstruction.9.a: "磨破的老茧，与跃动的心跳"
 Reconstruction.10.name: "希望的方舟"
 Reconstruction.10.desc: "当全球的目光终于从战争的灰烬中抬起，寻找希望的火种时，它们不约而同地投向了南美洲。这片幸运的大陆，如同一位被遗忘在喧嚣之外的女神，几乎完整地保留着她原始的生机与壮美。战火的喧嚣从未真正侵扰这片净土，炮弹的呼啸只是遥远天边的沉闷雷声。在这里，亚马逊的雨林依旧吐纳着地球的呼吸，安第斯山脉的雪峰依旧映照着星辰的光辉。然而，仅仅“幸免于难”并非联合政府选择南美洲的原因。在经历了那场几乎吞噬一切的战争之后，闪耀联合政府深刻地意识到，新世界的基石不能仅仅建立在对过去的修复之上，更需要一个指向未来的、充满创造力的宏伟蓝图。人类不能再仅仅作为地球的索取者而存在。于是，“南美洲生物圈保护与重塑区”计划应运而生。这并非一项重建任务，而是一项希望工程。它不是为了弥补创伤，而是为了开创未来。联合政府决定，将这片地球上最宝贵的生态遗产，从未来任何可能的人类活动干扰中永久性地解放出来。这不仅仅是保护，更是一次主动的、带有前瞻性的“献祭”——将一片大陆献给生命本身，以此宣告一个新纪元的到来：人类将从星球的主宰，转变为生命的守护者。“希望的方舟”即将启航。它承载的不是躲避洪水的生灵，而是人类对自身与自然关系最深刻的反思，以及对一个万物和谐共生未来的、最闪耀的梦想。这是联合政府打出的第一张牌，一张关乎理想、而非生存的牌，向全世界宣告：战争已经结束，一个崭新的、充满敬畏与爱的时代，正从这片绿色的大陆上，拉开序幕。"
 Reconstruction.10.a: "这里将是我们走向未来的起点"
 Reconstruction.11.name: "行星之肺"
 Reconstruction.11.desc: "南美洲的建设完成了，但这里没有落成典礼的剪彩，只有风过林海的涛声与猿鸟的啼鸣。这片大陆被赋予了一个全新的名字——“行星之肺”，一个恰如其分的称谓。先进的生态监测网络如神经网络般悄然融入雨林、山脉与河流，它们不干预，只感知。基因方舟在大陆边缘建立起来，为地球亿万年的演化成果提供一个永不丢失的保障。曾经可能被规划为工业区或新城的土地，如今被法律与技术划定为永恒的宁静区，确保生命演化的剧目能在这片舞台上，不受任何打扰地自由上演。人类在这片大陆上的存在感被降至最低。零星的科研前哨站被设计得如同自然的一部分，研究人员在这里的角色更像是图书馆里屏息凝神的读者，而非实验室里手握解剖刀的分析者。他们倾听、记录，并怀着敬畏之心，试图读懂生命这部最古老、最深奥的典籍。南美洲因此成为了一个象征，一个活生生的纪念碑。它不仅以其庞大的生态系统调节着全球气候，更以其存在本身，不断地向全人类输出着一种无声的哲学。它证明了人类的力量不仅可以用于征服与改造，更可以用于守护与克制。它像一面镜子，映照出闪耀联合政府的核心理念：最伟大的权柄，是懂得在何处收回自己的手。当人们通过卫星影像，看到那片广袤无垠、脉动不息的深绿时，心中涌起的不仅是对自然的赞叹，更有一种深刻的慰藉与自豪。因为这片“行星之肺”的每一次呼吸，都在提醒着所有人：我们不仅走出了战争的废墟，更找到了通往未来的、一条截然不同的道路——一条与万物同行的、闪耀着希望光芒的道路。"
 Reconstruction.11.a: "每一条生命都有生存的权利"