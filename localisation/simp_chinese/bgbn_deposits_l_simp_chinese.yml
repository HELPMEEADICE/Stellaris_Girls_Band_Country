#地块
l_simp_chinese:
 East_African_Deep_Mantle_Exploration_Base: "东非地幔深度开掘探索基地"
 East_African_Deep_Mantle_Exploration_Base_desc: "建立一个深入地幔的基地将彻底改变我们对地球内部的理解。我们在东非大裂谷内部选择地质构造相对稳定、活跃断层风险可控、地热梯度研究充分的区域建设了一个稳定的地下基地。基地将成为前所未有的地球深部物理学实验室，直接获取地幔物质样本，探索地幔中的极端地热能源利用，发现新的超深度资源，乃至寻找极端地热条件下的深部生命形式。"

 Siberian_Industry_Complex: "西伯利亚工业群"
 Siberian_Industry_Complex_desc: "随着工业废热回收技术与自动化生产链条进入成熟阶段，西伯利亚地区利用其巨大的矿产、化石、土地、土地和淡水资源优势逐渐发展成了一片庞大的工业生产城区，几乎承担了全球的矿物提炼、化工生产和大型机械制造需要。"

 The_East_Asian_Coastal_Megalopolis_Linking_the_Pearl_Yangtze_and_Yellow_River_Deltas: "珠三角-长三角-黄三角东亚沿海都市带"
 The_East_Asian_Coastal_Megalopolis_Linking_the_Pearl_Yangtze_and_Yellow_River_Deltas_desc: "通过扩展联通珠江与长江间的河道，扩建南水北调工程，以及修建了数条真空管超导磁悬浮轨道运输线路后，连接珠三角、长三角和黄三角以及沿交通走廊城镇带形成的巨型都市成为了D球上最大的人口聚集区与商业贸易区。庞大而密集的无数建筑与将其连接的立体智能交通网络几乎将这片区域的地表完全覆盖。从太空中观察，仿佛是一片连绵的银色海洋。"

 Equatorial_Solar_Power_Grid: "环赤道太阳能发电网络"
 Equatorial_Solar_Power_Grid_desc: "一个环绕地球赤道带、无缝集成陆地光伏阵列，海上浮岛光伏发电设施，以及流动点式光热塔发电站的全球级智能能源网络，通过超大容量、超远距离的输电系统，实现全球能源的即时共享与平衡，为文明提供可持续的基载电力。"

 South_American_Biosphere_Conservation_and_Restoration_Zone: "南美洲生物圈保护与重塑区"
 South_American_Biosphere_Conservation_and_Restoration_Zone_desc: "将南美洲大部分地区，整合成一个前所未有的、相互连通的巨型自然保护区。该区域将是地球上生物多样性最丰富、生态功能最完整的区域，作为所有生命形式的避难所和全球生态系统的重要稳定器。"


 The_North_American_Agricultural_Heartland: "北美平原农业繁荣圈"
 The_North_American_Agricultural_Heartland_desc: "实现了对全球的气候与水资源调配管控后，我们终于可以挣脱“因地制宜”的农业发展模式，而是“使地制宜”，让地面，水体，云层乃至天光都为我们而服务。利用高度平整的北美大平原区域，我们建设了前所未有的超大规模农业生产区划，为我们未来的发展中提供了坚实的粮食保障。"

 The_Planets_Cordilleran_Ecological_Backbone: "科迪勒拉星球环境脊梁"
 The_Planets_Cordilleran_Ecological_Backbone_desc: "沿着几乎纵向横跨星球的科迪勒拉山系部署的超大规模大气检测与干预装置，连同数百万单位的低轨道卫星群与悬浮于平流层底部的大型浮空艇，我们可以精准的进行全球的大气环流控制，电离层维持，星球轨道垃圾云清理，大气温度调控以及成分监控，实现对全球的终极环境管理。"