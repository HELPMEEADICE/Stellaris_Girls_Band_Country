 mujica.1.t: "人偶剧场"
 mujica.1.d: "听闻此\n寻找何方的访客，访客们，欢迎\n来到由纺丝与散列拟合的木偶奇境\n“愿月光怜悯你们，the Alice，”\n“这是什么意思?Oblivionis，你知道，没有丝线的生者，只会是误入。即使驻留，他们未来也将转瞬即流逝”\n“但且，在假面的遮掩下，我们依然能抛弃命运的联系，与之接纳”\n“那么，我们就要为他们给予的信任，献上人偶的戏剧”\n没错，剧目响起，即是苏醒之时！\n\n\nave mujica尽管在设定上是一支典型的商业乐队，但在其出道后的几个星期之内，整个D球的热点便已被这只新兴的银河战舰所占据。其神秘，戏剧，以及充满隐喻和暗示的歌词征服了了我们乐队少女的内心。于是，在进行内部决议，联系并征询ave mujica乐队的队长togawa——\n“是Oblivionis啊喂desuwa！”——小姐的意见后，大少女乐团国决定邀请ave mujica乐队成为我们的一部分，共同迈向探索星辰的事业中。"
 mujica.1.a: "愿命运眷顾你们，愿你们眷顾命运。"
