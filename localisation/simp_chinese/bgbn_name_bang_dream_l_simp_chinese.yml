 C_monica: "Morfonica全员将成为领袖"

 monica.1.t: "蝶变之光的邀约"
 monica.1.d: "在“大少女乐团国”的母星文化观察部提交的季度报告中，一个名字被特别标注了出来——Morfonica。\n这份报告并非来自星际间的信号捕捉，而是源自对母星内最具影响力之一的音乐学府“月之森女子学园”的持续关注。报告指出，这支由一年级生组成的乐队，拥有着与学园名声相符的精湛技艺，但她们的音乐中，却充满了与精英气质不符的迷茫、憧憬与渴望“改变”的强烈愿望。她们的演奏，仿佛一只努力想要挣脱束缚、破茧而出的蝴蝶。\n这份独特的报告引起了领导层的兴趣。在见证了太多天生的“闪耀”后，这种从内部挣扎、渴望蜕变的光芒显得尤为珍贵。因此，一份正式的邀请被送往月之森，希望她们能将这份潜藏着无限可能的才华，带到更广阔的舞台上。"
 monica.1.a: "欢迎来到能让你们尽情舒展翅膀的舞台。"
