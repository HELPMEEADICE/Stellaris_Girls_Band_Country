 dumbrock.0.t: "一家 Dumb Rock!"
 dumbrock.0.d: "一则带着烟火气的消息从母星地球传来。\n在花咲川一间叫「皮斯米卡（Peace Mika）」的古旧合宿公寓里，五个来路各异的女孩决定把「家」写成乐队名。\n热血到不讲理的须贺蕾叶高举「全员都是我的Family」，把只想安静租房、极度务实的马桥心玖硬拉进了排练室；大嗓门叛逆的鼓手梅里千樱梨、自闭又胆怯的贝斯手矢仓 蓬咲、从月之森离家出走的键盘手四宫宁月，一个个被这股笨蛋式热情卷了进来。当地产中介要把公寓收走改建时，她们选择用商业街 Live 大赛的奖金和名气守住这个唯一的避风港——双主唱的马桥心玖与须贺蕾叶把放克摇滚的律动砸向全场，从初赛一路打到决赛，拿下了总冠军。\n她们不叫 Family，她们就是 Family。"
 dumbrock.0.a: "这里就是我们的家啊。"

 trait_dumbrock: "Dumb Rock"
 trait_dumbrock_desc: "训练结束的客厅永远像被小型风暴扫过：薯片袋、睡衣、抢到一半的洗衣机，还有谁在哭、谁在笑。\n第二天早上，那口锅还是会煮出五个人的份。\nDumb Rock 从来不是一支技术无可挑剔的乐队——鼓点会抢拍，贝斯会慢半拍，主唱笑场的时候整段停下来重来。但她们唱的是「家」：漏雨的屋顶、抢不完的零食，和那句说了一百次都还认真的「反正我们不走」。\n在一条冰冷的银河里，这种声音太吵了。\n也太暖了。"

