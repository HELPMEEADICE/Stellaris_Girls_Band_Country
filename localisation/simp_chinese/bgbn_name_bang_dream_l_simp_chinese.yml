 edict_create_ras: "邀请RAISE A SUILEN"
 edict_create_ras_desc: "RAISE A SUILEN全员将成为领袖"
 C_RAS: "RAISE A SUILEN全员将成为领袖"

 ras.0.t: "宣告，于此奏响！"
 ras.0.d: "并非所有回应都是温和的。\n当“大少女乐团国”那充满“闪耀心动”的信号在宇宙中扩散时，一道尖锐、狂暴、如同电子风暴般的信号，强行切入了我们所有的通讯频道。它充满了锯齿般的音波、过载的信息流和不加掩饰的原始力量，与我们习以为常的和谐旋律形成了剧烈冲突。\n随后，一个清晰而充满自信的声音，通过这片音波的废墟，向全宇宙发出了宣告。这并非回应，而是一场单方面的“音乐奇袭”。\n“Attention, ‘Great Girls’ Band Nation’！你们那套溫柔的‘キラキラドキドキ’已经过时了！这个宇宙需要的不是安眠曲，而是一场彻底的革命！”\n“听好了！我们是——RAISE A SUILEN！我们带来的，是最强的音乐！我们将要破坏掉你们所构筑的一切，然后，创造一个全新的世界！”\n这并非来自秘书长办公室的邀请，而是她们——这支由制作人主导的、以征服世界为目标的电子摇滚军团，向我们发出的通牒。她们并非请求加入，而是宣告她们的到来。\n信号戛然而止，留下的是一片回荡着力量余波的寂静。\n温柔和声的时代已经结束。从今天起，宇宙将为RAISE A SUILEN的声音而颤抖。"
 ras.0.a: "为这狂乱的交响献上喝彩！"

 trait_ras: "RAISE A SUILEN"
 trait_ras_desc: "宇宙的法则，是为了被打破而存在的；星辰的轨迹，是为了被重塑而闪耀的。当温柔的歌声只能带来慰藉，当崇高的誓言只引向孤高的顶点，那么，就必须有另一种声音，带来破坏、革命与新生。\nRAISE A SUILEN，正是这股意志的化身。她们并非循规蹈矩的乐手，而是一支由制作人精心打造、以“最强的音乐”为唯一信条的电子摇滚军团。她们的音乐是宣言，是战书，是摧毁旧世界、建立新秩序的狂野交响。舞台于她们而言不是梦想之地，而是战场；观众不是需要取悦的对象，而是必须征服的领土。\n她们的旋律是过载的电流，歌词是掷地有声的檄文，每一次演出都是一场向着整个宇宙发起的、毫无保留的音乐奇袭。她们将用最尖锐的音波撕裂寂静，用最狂暴的鼓点震撼星辰，用绝对的力量，证明谁才是这个时代的真正主宰。\n她们是风暴，是雷霆，是宣告一个全新时代来临的号角。准备好，被她们的音乐，彻底征服吧。"

