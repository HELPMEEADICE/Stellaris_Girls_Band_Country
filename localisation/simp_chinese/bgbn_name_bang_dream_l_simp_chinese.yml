 millsage.0.t: "起死开战"
 millsage.0.d: "一则低沉却坚定的消息从母星地球传来。\n曾一度停摆的乐团「millsage」，在失去原主唱泽海奏多之后，由少女汐见萤接过键盘与麦克风，重新站上了舞台。\n以紫色四瓣花为标志的五人，各自带着说不出口的心事：滨崎茉幌把「没能守住奏多的梦想」当作罪，用近乎自毁的紧绷推着乐团往前走；琴平凪迟迟不敢按下和弦，怕一响起来就等于承认那个人真的不在了；伊泽枣用狂傲裹住自己，最先喊出「那就唱到所有人都听见」；和泉朋花笑着刺探每个人的底线，却在无人处把练习室的灯留到最后；而站在中心的汐见萤——她把悲伤折进琴键，用天使般的歌声替所有人唱出「起死开战」。\n她们不是来告别的。她们要把那朵四瓣花开在整个银河的舞台上。"
 millsage.0.a: "让歌声撕裂沉默。"

 trait_millsage: "millsage"
 trait_millsage_desc: "紫色的四瓣花别在胸口，花心向外散出六色的光——六个人，少一个。\nmillsage 的音乐不适合在庆典上播放。数字摇滚的节拍太密、太冷、太锋利，像有人在用琴键把什么东西一层一层拆开。你会不舒服，却会一直听下去：那声音里有种东西，失去过、负罪过、被命运按在地上过，还是要把手按回键盘上。\n她们在只有一次的人生里祈愿幸福，也把这份祈愿唱给每一个还愿意听的人。\n哪怕那朵花的中心，一直空着一个人。"

