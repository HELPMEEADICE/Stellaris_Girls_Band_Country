 mugendai.1.t: "病毒式传播"
 mugendai.1.d: "真理部分析报告：在过去一个标准日内，某未知团体‘梦限大MewType’通过其歌曲《Mugen My World》及其相关虚拟形象，在帝国全域信息网内实现了病毒式传播。当前总点击量已突破万亿。\n没有警告，没有实体飞船，这场“入侵”完全发生在数字领域。就在帝国的网络安全部门试图追踪其来源时，一个名为“Nakamachi Arale”的虚拟形象突然出现在所有分析师的屏幕上，脸上挂着狡黠的笑容。\n“想抓住我们？太慢了哦~”她的声音通过数据流直接响起，“我们是‘梦限大MewType’！现实太无聊了，我们只是想挣脱平凡，用自己的方式，让心声传得更远更远！”\n“网络就是我们无限大的宇宙！我们将在这里成为最强的传说，获得无限大的关注！请大家多多点赞、关注，一起见证我们的诞生吧！”"
 mugendai.1.a: "由数据与潮流定义的，全新的时代"
