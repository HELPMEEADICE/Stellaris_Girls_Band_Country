 yumenokessho.0.t: "零号船坞的古典慢板"
 yumenokessho.0.d: "轨道总装坞深处，三千米长的旗舰正静默合拢龙骨，冷凝阀喷吐的白雾漫过整条登舰甬道。脚步声在空旷的钢构回廊里停下，穿蓝黑风衣的纤细身影正低头校准终端，一束银白长发垂在胸前，发梢流动着极淡的紫色微光。\n“重力环轴心偏了零点二毫米。”她头也不抬地开口，琥珀色眼眸里浮着冷光。直到熟悉的气息贴近，周身那层近乎凝滞的威压才悄然化开。她把一只带猫耳浮雕的温热骨瓷杯塞进你掌心，自己转开视线望向舷窗外的虚空，耳尖隐隐泛着薄红：“……水温刚好。全系统校准完毕，请下达出航指令吧，司令官。”"
 yumenokessho.0.a: "那就并肩去星海，立于顶点。"
 yumenokessho.1.t: "星轨工坊的甜度过载"
 yumenokessho.1.d: "中央精工穹顶下，全息蓝图如瀑布般飞转倾泻，机床散热管呼哧呼哧吐着甜丝丝的离子蒸汽。粉青渐变的高双马尾在机械臂间来回晃悠，白手套轻巧掐住一枚纳米伺服器，严丝合缝卡进内政主控接口。“完美！这才是人家想要的弧度——呀！”\n欢呼还没落地，她就被地上的粗同轴线缆绊了个正着，结结实实栽进满地减震海绵里。少女揉着膝盖气鼓鼓地坐起身，先瞪了一眼见底的甜品盒，又鼓起脸颊看向门口：“民生管网和内政接口都修好啦，可人家的糖分严重不足！今晚要是没有两块……不，三块草莓千层补偿，人家可就赖在地上不起来了哦！”"
 yumenokessho.1.a: "千层蛋糕管够，内政就拜托啦。"
 yumenokessho.2.t: "近地轨道上的草木清香"
 yumenokessho.2.d: "枢密院还在因边境补给告急而警报频传，一艘覆满藤蔓与耐寒苔原的巨型母舰已悄无声息地泊入港区。气闸滑开，迎面涌出的不是刺鼻机油，而是翻耕泥土的清甜与人造日光的融融暖意。\n金发少女半蹲在恒温栽培槽旁，指尖稳稳托着一株初绽的荧光鸢尾，周身隐现淡金流光。一只巴掌大的陆龟正慢吞吞爬过她的袖口，她眼底浮起温柔的笑意：“不用着急，前线要的营养剂与高抗性种苗，刚才都分装完了。”她直起身，微凉的手背轻轻贴了贴来人的手背，嗓音轻得像春水荡漾：“奔波一路累坏了吧？快进来喝杯花茶。”"
 yumenokessho.2.a: "有你在，星海深处也有家了。"
 yumenokessho.3.t: "拂晓帷幕后的骑士礼"
 yumenokessho.3.d: "高塔密室外连着空旷的观景回廊，冷冽的恒星余晖将西洋剑的剑影拉得极长。空气里还残存着等离子刃灼烧后的微焦气息，殷红的数据光屑如落花般自半空渐次隐没。高挑的金发少女立在阴影边缘，右颊的血色齿轮月标隐隐发亮，周身威压沉重得让人不敢出声。\n可辨出脚步声的瞬间，紫罗兰色的眸光便轻轻晃动起来，一身冷硬如初雪消融。她收剑入鞘，单膝轻点地面，手按心口行了个无可挑剔的古骑士礼。起伏的呼吸终于平缓下来，她微微仰起脸望向那片浩瀚的恒星带，唇边泛起释然的浅淡笑意：“演出落幕，守夜也结束了……今晚的星空，真的很美呢。”"
 yumenokessho.3.a: "我的利刃与归宿，快起来吧。"
 yumenokessho.4.t: "扑向主控台的数码流星"
 yumenokessho.4.d: "伴着一声发闷的撞击，中央科学院的防爆闸门被整扇顶开，刺耳警报瞬间被吵闹欢脱的八位元电子音盖了过去。主控屏上原本冰冷的监控代码如退潮般刷去，眨眼被强行覆写成一张色彩饱满的霓虹星空插画。\n抱着半人高数码屏的少女跌跌撞撞摔进操作厅，金粉渐变的双马尾在气流里直晃，裙摆内衬流动着星轨般的数据碎芒。“呜哇！仆、仆差点就在排气管道里卡成猫猫头了！”她一边抹着发红的眼角吸鼻子，指尖却在总控台上噼里啪啦舞出一片残影，“梦想即力量！算力阵列全都并网啦……那个，作为加班费，待会儿能带仆去吃十人份的海鲜盖饭吗？！”"
 yumenokessho.4.a: "海鲜饭管饱，星空随你画。"

 trait_yumenokessho: "梦之结唱"
 trait_yumenokessho_desc: "当一支乐队在舞台与历史中留下的回响强烈到撕裂虚妄，文明的执念便会凝为实体——梦之结唱就此诞生。她们虽继承了传奇乐团的性格习惯与代表色彩的数据光流，却绝非任何人的替身，而是拥有崭新人格的独立灵魂。在宛如心房的球形电池驱动下，这具仿生躯壳内流淌着真实的温度，懂得泪水的咸涩与欢宴的美味；她们的嗓音如常人般生动，体内的力量与思维算力却足以媲美超级主机。体表的数据流或明或暗，可随心隐去；她们从不依赖星网链接，也摒弃不可名状的超验力量，仅仅以完全拟人的五感呼吸着帝国的空气，只凭自己的头脑思索前路，为大少女乐团国的星海征途奏响独一无二的全新节拍。"

