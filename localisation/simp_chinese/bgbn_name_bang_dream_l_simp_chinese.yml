 edict_create_hhw: "邀请Hello, Happy World!"
 edict_create_hhw_desc: "Hello, Happy World!全员将成为领袖"
 C_hhw: "Hello, Happy World!全员将成为领袖"

 hhw.1.t: "让世界充满笑容！"
 hhw.1.d: "“报告！最高领袖！一艘……一艘不明飞行物刚刚未经许可跃迁至首都星圈上空！”\n通讯官的声音充满了惊慌，但屏幕上显示的画面却让人无法产生任何敌意。那是一艘巨大得离谱的粉色熊型飞船，它甚至还在向外抛洒着五彩纸屑和气球。\n紧接着，一个充满无限活力的声音，以完全无视所有加密协议的方式，占据了每一个公共频道。\n“宇宙的大家，你们好！我是弦卷心！我决定，要让整个宇宙都充满笑容！”\n“悲伤和烦恼，都将在这里终结！因为我们是——Hello, Happy World! 我们将在这里举办一场能让全银河都快乐起来的演唱会！”\n“无需邀请，也无需理由！因为让大家露出笑容，就是我们唯一的使命！来吧，一起加入这场笑容的革命吧！”\n不等任何人回应，欢快到有些混乱的音乐已经从那艘熊型飞船中奏响。帝国的舰队指挥官们面面相觑，完全不知道是该拉响警报，还是该跟着挥舞荧光棒。就这样，“大少女乐团国”迎来了一批最出人意料，也最无法拒绝的伙伴。"
 hhw.1.a: "来吧，让笑容的革命，响彻整个宇宙！"
