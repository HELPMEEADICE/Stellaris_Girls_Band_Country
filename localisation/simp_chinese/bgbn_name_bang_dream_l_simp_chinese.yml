 mygo.1.t: "迷路，羁绊"
 mygo.1.d: "尽管没有要求每个人都一定要有远大的理想，或是保持止于礼义的友谊，然而，最近一只名为mygo的乐队却可谓异军突起。\n她们的技术水平参差不齐，互相之间缺乏那种闪闪发光的羁绊，例如一个激昂的将她们团结起来的梦想，或者是长时间相互陪伴带来的信任与认同。\n然而，mygo依旧不断的在舞台上大放异彩，并吸引了无数的粉丝支持。她们似乎在乐队中承载了很多很多的东西——对每个人过往的包容，因相互的缺陷而产生的依赖，细小而坚定的承诺，等等等等。无数沉重的联系相互混杂，形成了这份相当不纯粹，但温暖的共同依靠。\n在慎重的考虑之后，我们决定邀请mygo来加入到大少女乐团国的建设中，以期填补我们国家在纯粹的音乐与梦想边缘的空白领域。"
 mygo.1.a: "不算高尚或者是坚定，也不确定是约定或者是依赖，仍然迷茫，却依旧要一同走下去"
