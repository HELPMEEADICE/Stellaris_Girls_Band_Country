 edict_create_ag: "邀请Afterglow"
 edict_create_ag_desc: "Afterglow全员将成为领袖"
 C_AG: "Afterglow全员将成为领袖"

 ag.0.t: "夕阳下的回响"
 ag.0.d: "星图指挥中心收到了一段非官方的加密通讯，信号源头出人意料地稳定，但内容却充满了随性与不羁。\n那并非正式的文书，更像是一群好友间的闲聊录音，背景里夹杂着吉他的调试声、零食包装袋的脆响和压抑不住的笑声。一个略带慵懒却无比可靠的声音打破了沉默：\n“喂喂，听得见吗？这里是Afterglow。”\n“听说你们在宇宙里搞得挺热闹的嘛，又是‘闪耀心动’又是‘顶点’的……真厉害啊。我们这边，还是老样子啦。练习、打工、在夕阳下的屋顶上看着云发呆……嘛，这种‘一如既往’的感觉，其实也不赖。”\n“不过，最近大家也在聊。说我们的‘一如既往’，是不是也能在更远的地方奏响呢？在没有晚霞的星海里，我们的音乐，听起来会是什么样的？”\n“所以呢，我们商量了一下。我们不想当什么伟大的领袖，也不想去征服谁。我们只是想和最重要的伙伴们一起，去一个没有人去过的地方，奏响属于我们自己的声音，然后像往常一样，笑着回家。如果你们的星际飞船正好缺几个‘一如既往’的家伙，那不如就让我们试试看吧？”\n通讯的最后，传来一阵爽朗的笑声，以及一句低声的“嘿嘿，帅气地讲出来了吧？”\n她们的到来，或许不会带来翻天覆地的变革，但这份在夕阳下淬炼出的、无可替代的羁绊，将成为“大少女乐团国”在冰冷宇宙中最温暖、最坚实的“归宿”。"
 ag.0.a: "欢迎加入，让‘一如既往’响彻星海。"

 trait_ag: "Afterglow"
 trait_ag_desc: "并非所有故事都需要宏大的开篇，并非所有摇滚都为了嘶吼与反抗。有一种力量，诞生于小巷的涂鸦、便利店的灯光和夕阳映照下的天台。它不追求改变世界，只为了守护身边“一如既往”的风景和无可替代的伙伴。\nAfterglow，便是这份青春羁绊的结晶。她们是五位青梅竹马，是共享着秘密基地的伙伴，是用最纯粹的摇滚精神对抗着成长的烦恼与世界的无聊的叛逆者。她们的音乐里没有华丽的辞藻，却充满了放学后的懒散、夕阳的温度和永不分离的约定。每一次合奏，都是五颗心灵的共鸣；每一次放声歌唱，都是在向着不变的日常与友情，献上最热烈的喝彩。\n她们或许不会带来最快的效率或最强的力量，但她们的存在本身，就是一种无可比拟的“稳定”。她们是在风暴中依然能笑着说“还是老样子嘛”的坚实依靠，是在无垠宇宙中永远不会迷失的、名为“家”的灯塔。\n她们是夕阳的残响，是青春的证明，是在任何地方都能找到归宿的、最强的“我们”。"