l_simp_chinese:
#传统
#闪耀
 tradition_kirakira: "闪耀"
 tradition_kirakira_desc: "诞生在新星的馈赠，启迪于柴薪的焰光，我们的文化中一直保有着对如光芒般闪耀的追求。如今，随着在星辰间的不断探索以及对自然真理的深入研究，我们似乎可以开始为尝试我们的每一个社会成员赋予一项前所未有的权利——定义和追寻崭新未及的闪耀。"
 tr_kirakira_adopt: "闪耀传统"
 tr_kirakira_adopt_tooltip: "所有属于你初始物种的人口将获得§Y$trait_first_glowing$§!特质\n萤光始熠特质：人口降级速度-150%，领袖寿命+100%\n获得科技§Y$tech_gene_tailoring$§!"
 tr_kirakira_socialized_upbringing: "社会公养"
 tr_kirakira_socialized_upbringing_delayed: "在古老的文明史上曾有无数歌颂爱情与亲情的传世佳篇，但自然而野性的两性生殖繁衍模式、以及围绕其组建产生的婚姻与血缘系统却正逐渐无法跟上我们的脚步，更加开始阻碍了我们绝大多数个体相当程度的发展。于是，我们将用共同的劳动生产与先进的生物技术来建成全面覆盖的社会公养机制，给予人在天赋和奋斗外的彻底平等，也将爱情，生育与养老的义务转化为了自由的权利。"
 tr_kirakira_post_scarcity_production_paradigm: "解放生产"
 tr_kirakira_post_scarcity_production_paradigm_delayed: "在初开蒙昧时，生命需要不断劳作、榨尽余力，才能获得勉强维持生存繁衍的物资；而当出现工业化，标准化的生产技术后，即使技术尚且原始的集中劳动工厂也能流出远超劳动者生存所需的大量产物；到现在，随着分子级物质堆叠打印技术得到进一步小型化应用、以及新一代大范围长距能源传输设施的全面铺设完工，我们终于实现了解放生产力的最终阶段——消灭一切需要劳动力来进行的，有关生存所需物资的重复性，集中性的劳动。从今往后，我们的每一个公民都将完全掌握参与劳动的权利，并能把全身心的投入到对闪耀的追寻当中。"
 tr_kirakira_cognitive_extension: "感知扩延"
 tr_kirakira_cognitive_extensio_desc: "允许经由物种修饰技术移除有益特质，增加不利特质。\n允许经由物种修饰技术调整物种外观。"
 tr_kirakira_cognitive_extension_delayed: "朝菌不知晦朔，蟪蛄不知春秋。以自然赋予的羸弱躯体和浅薄感官，已经无法应对星河的缤纷多彩。但同时，我们天然存在的认识和积累缺失，也在激发我们用数理或是心灵的来为那些毗邻的未知世界揭开神秘晦涩的帷幕。因此，为了能在更遥远的领域迸发闪耀，我们将开始设计可选装配的模块化思维系统，让我们能提高思维速度或是并列能力，快速连接访问知识库，或是将感知扩展向磁场、引力场、以及更宽广迷人的世界。"
 tr_kirakira_the_philosophy_of_kirakira: "闪耀哲学"
 tr_kirakira_the_philosophy_of_kirakira_delayed: "自然选择，适者生存——文明蒙昧之时，自然演化的以生存和延续为核心的哲学体系曾为我们社会的发展和进步提供不竭的动力。然而，沧海桑田，随着帝国走出摇篮迈入星空，不必担忧个体与文明在一个主观认识上几近无穷的时间和空间跨度上遭遇任何生存威胁之后，以生存和延续为核心的哲学体系，连带着我们赖以生存的庞大社会结构也开始摇摇欲坠。与其在其上修修补补，虚以委蛇，更多的人们正在呼吁建立全新的哲学体系和生命目标——以发展和进步为核心的闪耀哲学。无数学者正在紧锣密鼓的建立和完善这个全新哲学体系的指导机制与价值体系，解构旧哲学体系在社会惯性和基因调控中的可能残余，并评估其对帝国未来发展的影响。但无论如何，闪耀将代替生存，进步将走过延续，延伸向我们全新的未来。"
 tr_kirakira_stream_of_collective_consciousness: "时代流光"
 tr_kirakira_stream_of_collective_consciousness_delayed: " 在对虚境——这个投射智慧生命的灵魂和意志的神秘领域的研究中，我们发现了存在于我们帝国集体内部的一股强大流量。它由我们历史上每一个曾经存在个体的灵魂共同构成，随着我们的进步与发展在不断扩大，迄今已经成为了一个难以想象的庞然大物。即使是某些本以为强大无匹的虚境存在，在文明洪流的伟力下也必须退避三舍。这或许也是随着时代的进步，各种神秘学降临类的现象愈发势微的原因。当然，直接把她作为一种虚境内的强大武器是粗鄙的做法，随着对其构成方式的深入研究，我们也许能有序的释放和利用其势能，为我们提供唯心世界意义上的升华。"
 tr_kirakira_finish: "闪耀传统完成"
 tr_kirakira_finish_tooltip: "所有属于你初始物种的人口将获得§Y$trait_latent_psionic$§!特质。"