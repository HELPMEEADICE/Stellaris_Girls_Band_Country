#科技
#恒星基地建筑
 tech_astral_flare_initiative: "星辰曜光"
 tech_astral_flare_initiative_desc: "尽管我们已经复刻了稳定核聚变的奇迹，但对恒星这个天然恒久的聚变天体，我们的了解还不足其万一。于是如今，利用我们学习到的更先进的数学和物理工具，我们将首次在恒星表面建设如此庞大的恒星激发干扰装置，更深入的窥探星辰的奥秘。"
 tech_chroma_veil_defense: "炫彩霓裳"
 tech_chroma_veil_defense_desc: "深入了解恒星的复杂能量循环机理后，我们将开始尝试大范围的这个宏伟的天体，让其改天换地的伟力顺从于我们的意志，化为我们对这个恒星系主权不可动摇的象征。"
 