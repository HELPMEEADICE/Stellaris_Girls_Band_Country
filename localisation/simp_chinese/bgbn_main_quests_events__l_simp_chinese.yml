l_simp_chinese:
#主线所有事件的本地化文件
####################################################            §B  §! = 蓝色  §R  §! = 红色 §Y §! 黄色 
#############星系探索################################
####################################################
 bgbn_space_exploration.2.name: "序曲"
 bgbn_space_exploration.2.dasc: "当最后一抹暗红色的余晖在林海尽头沉入地平线，大少女乐团国的地表灯火不再是为了驱散战争的阴霾而点燃，而是化作了一盏盏仰望苍穹的长明灯。在无数座直插云霄的银白巨塔顶端，在平原上万亩金色麦浪的呼吸声中，无数双眼睛正越过大气层的稀薄边缘，凝视着那片沉寂了亿万年、却又仿佛时刻在发出震耳欲聋召唤的深邃墨色。\n随着地表“长弓”电磁加速轨道深处传来的一声跨越山脉的低沉轰鸣，探索舰船化作一道撕裂夜空的纯白流光，毅然决然地挣脱了母星引力的最后一次温柔挽留。跨越了早已荒废的轨道防御卫星碎片，掠过了静谧如死水的月球环形山，当太阳那原本充盈了整个视界的辉煌母性光辉逐渐坍缩成一颗普通、且略显孤单的金黄色星点时，探索团队意识到，他们已经跨越了家园的最后一道边界。在那个瞬间，舰船内部的实验性灵能谐振仪感应到了一种前所未有的、来自虚无深处的微弱颤动——那是星际介质中游离的氢原子与高能射线交织而成的背景乐章，是宇宙在最宏大的维度上进行的一次无声调音，更是迈入深空的游子与辽远无垠的呼和共鸣。\n这是大少女乐团国迈向星海的第一步，是一次关于Kirakira与Dokidoki的航行。他们将用最严谨的观测去解析天体的狂暴，用最深沉的感悟去触摸虚境的投影，在那漫天星斗的背后，寻找着足以让整个文明为之起舞的、那首最宏大的星辰之歌。"
 bgbn_space_exploration.2.a: "星辰已经在亿万年前奏响了前奏，现在，该轮到我们去接续这段旋律了。\n\n§YPS:这将开启大少女乐团国前期主线分支§!"

 bgbn_space_exploration.3.name: "F型主序星"
 bgbn_space_exploration.3.dasc: "柔和的黄白色辉光逐渐取代了先前星体的冷峻，这种光芒带有一种接近文明初火的温润感。在科研船的传感器中，这颗恒星的色调如同在纯净的水中滴入了一滴金色的蜜，它既保留了恒星的活力，又散发出一种孕育生命可能的母性光辉。\nF型主序星的表面有效温度处于六千至七千五百开尔文的区间，光谱中氢线开始减弱，而电离钙的H和K线则显著增强，展现出复杂的化学丰度。其质量范围约为太阳的一点到一点四倍，这使得它拥有比更热的恒星更长的寿命，主序寿命可达数十亿年。科研团队在观测中发现，这颗恒星的内部能量传递方式正经历着重要的转变，对流区开始在恒星外层占据更大比例，这导致了更为活跃的磁场活动。通过日冕仪观测，可以清晰看到磁绳在恒星表面跃动，触发了频繁但并不致命的耀斑。这些磁场活动与恒星自转的耦合作用，产生了一系列复杂的色调震荡，其波速反映了恒星内部密度的细微变化。对于探索人员而言，F型星不仅是一个巨大的核聚变反应堆，更是一个充满动力学细节的天然物理实验室。"
 bgbn_space_exploration.3.a: "它是冷与热的调和剂，在光谱的缝隙中，小心翼翼地为未来的生灵保存着第一份足够长久的温暖。"

 bgbn_space_exploration.4.name: "G型主序星"
 bgbn_space_exploration.4.dasc: "一种近乎神圣的熟悉感笼罩了整个观察室，那是标准的金黄色，如同故乡午后的阳光。这种光芒在光谱仪上呈现出最令人心安的峰值，没有任何咄咄逼人的尖锐，只有一种跨越时空的、根植于我们文明记忆深处的深沉共鸣。\n这类G型主序星，即常说的类太阳恒星，有效温度约为五千至六千开尔文。其光谱特征以强烈的金属线为主，尤其是电离钙、中性铁和钠线，氢线则进一步退化。质量通常在太阳的零点八倍至一点二倍之间，处于漫长的、长达百亿年的稳定主序阶段。科研人员重点记录了其复杂的层级结构：致密的核反应区、广阔的辐射区以及最外层活跃的对流区。正是这种深层的对流运动，通过发电机效应维持了全球性的偶极磁场，形成了周期性的黑子活动循环。观测数据揭示了恒星大气层中精细的米粒组织，那是由于下方对流胞上升冷却产生的现象。其色球层与日冕层之间存在着剧烈的温度反转，达成了自然状态下的一个几近完美的动力平衡。这种恒星是已知宇宙中最具有稳定性的大型发光星体之一，为行星系的长期演化提供了近乎永恒的能量来源。"
 bgbn_space_exploration.4.a: "它是文明的摇篮，是所有kirakira梦想的源点，在万千群星中，它以平凡的色彩承载了最伟大的生命奇迹。"

 bgbn_space_exploration.5.name: "K型主序星"
 bgbn_space_exploration.5.dasc: "暗金色的光辉略显沉静，像是一盏在大厅尽头默默燃烧的长明灯。它并不急于展示自己的能量，而是以一种极其缓慢、极其耐心的节奏脉动着，那是一种跨越了文明兴衰尺度的静谧，仿佛时间在这一区域被某种无形的力场拉长了。\nK型主序星，又被称为橙矮星，其表面有效温度跨度在三千五百至五千开尔文。其光谱中金属线极度丰富，尤其是分子带（如氰基和氧化钛）的特征开始隐约浮现，中性金属原子线占据了主导地位。质量仅为太阳的零点五到零点八倍，这意味着其核聚变反应极其节约，主序寿命可以长达一百五十亿至三百亿年，甚至超过了当前宇宙的推测年龄。由于质量较小，其内部结构主要由对流控制，能量传递虽然缓慢但极其均匀。观测显示其磁场活动虽然比G型星略强，但由于自转演化的减速，其高能辐射环境相对稳定。探索团队发现，K型星周边的宜居带范围虽然较窄，但却拥有远超其他主序星的稳定性，不受恒星剧烈演化的干扰。这种恒星就像是宇宙中的隐士，在漫长的岁月中静静地累积着物质与能量，等待着那些真正持久的文明前去栖息。"
 bgbn_space_exploration.5.a: "它是宇宙中最值得信赖的马拉松选手，在漫漫长夜中，以最温润的橙光，为后来者预留了长达数百亿年的庇护所。"

 bgbn_space_exploration.6.name: "阶段性调查总结报告"
 bgbn_space_exploration.6.dasc: "当最后一组长程信号穿过幽邃的虚空返回终端，关于这些温暖恒星的航程暂时画下了句号。在舷窗之外，那些曾被视为遥不可及的金色、橙色或黄白色的光点，如今已在无数次的近距观测中化作了真实可感的物质实体。\n航行本身就像是在一片光的海洋中泅渡。当推进系统进入休眠，船体依靠惯性平稳地滑向那些庞大的发光体时，所有的喧嚣似乎都随之沉寂。这些恒星不仅在物理尺度上占据了宏大的空间，更在感官上建立了一种名为安定的坐标。它们在长达数十亿甚至上百亿年的岁月中，维持着氢核聚变的高效运作，将物质转化为穿透冰冷宇宙的热量。这种稳定性构成了星际间最温柔、最令人心安的底色。\n在这一阶段的探索中，观测人员目睹了那些在恒星表面不断重组的磁场线条，以及如同潮汐般起伏的、覆盖数万公里的等离子体海洋。在这些星体周围，引力与辐射压达成了某种优雅而深沉的默契，使得光子能够以几乎永恒的节奏向外辐射。即便星空背景本身显得肃穆而冷峻，但这些星体所散发的温润光辉，依旧在虚无的幕布上涂抹出了属于生命的暖意。通过光谱仪采集到的数据，我们可以感受到这些星体内部蕴含的某种质朴节奏，那是在虚境涟漪中回响着的、近乎永恒的共鸣。\n我们确认了这些主序星不仅是宇宙中能量的供给站，更是时间尺度上的守护者。它们以最沉稳的节奏脉动，在漫漫长夜中为那些可能存在的生命预留了长达百亿年的庇护所。这份总结不仅是科研数据的积累，更是我们文明迈向深空的底气。当我们再次仰望这片被它们点亮的星海，那些光芒中隐藏的，正是指引我们寻找终极闪耀的灯火。未来，这些恒星将继续在黑暗的边缘闪烁，等待着下一次更深远的造访。"
 bgbn_space_exploration.6.a: "已归档"

 bgbn_space_exploration.7.name: "O型蓝巨星"
 bgbn_space_exploration.7.dasc: "深邃的紫蓝色辉光如同一场席卷视界的极地风暴，这种高能级跃迁产生的光芒几乎超越了有机视觉的感知极限。当舰船破开时空的褶皱，这颗恒星像是一座建立在虚无之上的炽热祭坛，其喷薄而出的光子洪流在船体表面激起剧烈的电子剥离，呈现出一种近乎神性的狂暴与威严。\n科学团队测得这类O型恒星的表面有效温度处于三万开尔文至五万开尔文的极端区间，光谱中以电离氦谱线为显著特征，而中性氦线则相对微弱。其质量通常在太阳质量的十五倍至九十倍以上，甚至逼近爱丁顿极限的边缘。这种极高的温度导致其辐射压力异常巨大，恒星风的速度可达每秒数千公里，将其外层大气以极快的速率吹散入星际空间。由于其核心核聚变反应极度猛烈，通常采用碳氮氧循环的方式迅速消耗氢燃料，使其主序寿命缩短至数百万年。这类恒星的光度可达太阳的数十万倍，在宽广的光谱范围内辐射出绝大部分能量。科研人员观察到其周边的星云受强紫外线电离，形成巨大的H II区，这些光子不仅照亮了黑暗，更由于其巨大的动能不断塑造着周围的星际介质结构。这种恒星是星系中重元素合成的重要温床，也是未来发生型超新星爆发的原始母体。"
 bgbn_space_exploration.7.a: "它是星海中追求极致瞬间的诗人，用最短暂的青春换取了最炽热的燃烧，在每一道谱线中都刻满了对平庸的拒绝。"

 bgbn_space_exploration.8.name: "B型主序星"
 bgbn_space_exploration.8.dasc: "当探索舰船脱离超空间涟漪，视界被一种近乎冰冷的蓝白色辉光瞬间填满，这种光芒不似凡火，倒像是从宇宙深处透射而出的锋利尖针，试图刺穿所有观测者的虹膜。那颗巨大的恒星如同一颗被抛入黑夜的磷火钻石，冷峻而狂暴。\n根据科研团队获取的光谱数据，这颗B型主序星展现出极高的表面有效温度，通常维持在一万到三万开尔文之间，其质量跨度约为太阳的二到十六倍。由于光度极高，其辐射压力极强，观测仪捕捉到了强烈的电离氦线和明显的中性氦吸收线，氢线则相对A型星较弱。这类恒星内部的核聚变反应极其猛烈，通常通过碳氮氧循环释放能量，导致其寿命相对短暂，仅能在主序阶段停留数千万至数亿年。通过对恒星边缘的多普勒频移测算，科研人员确认其具有极高的自转速度，这种高速旋转使得星体在两极方向略显扁平，赤道地区则由于离心力而膨胀。其周围的空间被强劲的恒星风清空，形成了一个巨大的高能粒子泡。"
 bgbn_space_exploration.8.a: "它是宇宙中最为桀骜不驯的蓝白才俊，用燃烧生命的代价，在星图上刻下了一段最短促却也最刺眼的闪耀乐章。"

 bgbn_space_exploration.9.name: "A型主序星"
 bgbn_space_exploration.9.dasc: "纯粹的白光在舷窗外铺展开来，没有多余的杂色，宛如一块经过极度打磨的无暇银锭。在深邃背景的衬托下，这颗恒星显得异常优雅，它发出的光芒稳定而均衡，像是一位在静谧中等待调音的独奏者，散发着一种理性的、秩序井然的美感。\n科学观测显示，这类A型主序星的有效温度范围大致在七千五百到一万开尔文之间，光谱特征以极强的氢巴耳末系吸收线为标志，电离金属线如钙、镁、铁的信号开始显现。其质量通常在太阳的一点四倍至二点一倍之间，亮度则是太阳的数倍到数十倍。由于处于主序演化的稳定期，其辐射压与引力达到了精妙的平衡，星体结构致密，大气层中对流层极薄或不存在，主要由辐射区主导能量传递。部分样本显示其周围存在残留的原行星盘碎片，在红外波段下呈现出微弱的尘埃环带。尽管自转速度依然较快，但已不复B型星那般狂乱，呈现出一种相对平和的动力学特征。它们的光谱中，氢线的宽度揭示了其大气的压力分布，为探索团队提供了精确的引力场模型。"
 bgbn_space_exploration.9.a: "它是星空坐标系中最公正的白光基准，以极致的简约与平衡，定义了银河系中那份恰到好处的优雅。"

 bgbn_space_exploration.10.name: "阶段性调查总结报告"
 bgbn_space_exploration.10.dasc: "当探索舰船缓缓脱离那片被紫外辐射浸透的空域，舷窗外的色彩终于从那层近乎锋利的紫蓝色回归到了深邃的幽暗。对于执行此次任务的科研人员而言，这一阶段的航程更像是一场在炽热刀锋上的舞蹈。那些被观测的目标，无一不散发着一种冷峻而又狂暴的尊严，它们是星海中当之无愧的统治者，以消耗自身质量为代价，向虚无的宇宙宣泄着足以撕裂时空的能量。\n在这段跨越数个高能星团的旅途中，探索团队最直观的感受是这些星体所共有的一种“迫切感”。与那些动辄拥有百亿年寿命的温和星体不同，这些年轻的巨物在诞生之初就选择了极致的燃烧。它们的光芒呈现出晶莹的银白或是深邃的冰蓝，光子流携带的巨大动能如同无形的巨手，不断剥离并重塑着飞船最外层的防护屏障。在观测仪器的记录中，这些恒星的表面并非平静的火海，而是充斥着超高速恒星风与极端辐射压的角斗场。它们的存在本身就在重写周围光年的物理规则，将原始的星际气体电离成瑰丽的彩色云霞，为宇宙的荒原标注出最为醒目的航标。\n站立在观察位上，凝视着那些巨大的、正在以指数级速度消耗燃料的恒星，一种敬畏感油然而生。它们以最短暂的生命周期换取了横跨数个星系的绝对亮度，是星系中所有重元素的炼金炉。虽然由于其不稳定的能量释放与剧烈的电磁干扰，飞船不得不时刻保持警戒距离，但那种穿透舱壁而来的、属于高能物理规律的脉动，依旧让每一位随行人员深刻体会到了宇宙最原始的生命力。\n随着这一阶段调查的收官，我们带回的不止是填补了光谱空白的数据，更是对“闪耀”这一概念在宏观层面的极端定义。这些恒星注定会在不远的未来——以宇宙的尺度衡量——化作最为壮丽的超新星爆发，将积累的物质归还给星海。而在那一刻到来之前，它们将继续在航线的远方闪烁，作为这片星空下最不容忽视的、最炽热的灵魂，指引着我们继续向未知的深处进发。"
 bgbn_space_exploration.10.a: "已归档"

 bgbn_space_exploration.11.name: "红巨星"
 bgbn_space_exploration.11.dasc: "原本稳定的恒星如今膨胀成了一个不可理喻的空洞巨球，暗红色的表面布满了如裂纹般的对流纹理，仿佛一只浑浊而疲惫的巨大眼球。它吞噬了周围的一切，连光线在其表面都显得沉重而粘滞，散发出一种末日将至的、令人绝望的压迫感。\n当恒星耗尽核心的氢燃料，核心坍缩引发的氦聚变热压将外壳推向极远方，形成了红巨星。其直径可达太阳的数百至上千倍，光度增加数千倍，但表面温度却下降至两千至三千五百开尔文。光谱中金属线和分子吸收带极度浓郁，展现出复杂的包层结构。科研船在安全距离外记录到了强烈的恒星脉动，由于引力对表层控制力减弱，大量的重元素被抛射入太空，形成了富含硅酸盐和石墨的尘埃层。对于红超巨星而言，其内部已经开始进行碳、氧甚至更重元素的聚变，核心压力正逼近电子简并压的极限。每一次这种庞然大物的呼吸，都会在周围的空间引发引力波的微弱共振，预示着一个古老灵魂即将迎来最终的星尘回归。"
 bgbn_space_exploration.11.a: "它是时光凝结的庞大遗嘱，在极度膨胀的躯壳下，它用最后的余热，为自己波澜壮阔的一生举行了一场横跨星系的葬礼。"

 bgbn_space_exploration.12.name: "沃尔夫-拉叶星（WR星）"
 bgbn_space_exploration.12.dasc: "那不再是光，而是一场疯狂的、被强行挤压出的物质风暴。在观测视域中，恒星本体已无法被界定，取而代之的是一个层层叠叠、向外疯狂喷涌的彩色气壳，像是一朵在真空中剧烈爆炸的繁花，散发着令人战栗的毁灭气息。\nWR星代表了恒星演化中最极端的阶段，其表面温度可高达三万至二十万开尔文。科学部报告称，这类恒星正经历着无法想象的质量损失，每年抛射的物质足以形成一个地球。其光谱中完全缺失氢线，取而代之的是极强的氦、碳、氮、氧的发射线，这标志着恒星已经将外层的氢壳层彻底剥离，直接裸露出内部的核合成产物。恒星风的速度可达每秒数千公里，将周围数光年的星际介质吹扫成复杂的螺旋结构。由于极高的光度，其质量通常在太阳的十倍以上，且处于坍缩为黑洞或中子星的前夜。监测数据记录到了剧烈的能量波动，这些恒星的辐射压已经达到了爱丁顿极限的边缘，每一次脉动都可能引发局部的超新星预演。"
 bgbn_space_exploration.12.a: "它是星际舞台上最疯狂的谢幕者，在彻底崩溃之前，它选择将自己的灵魂化作炽热的重元素之风，播撒向虚无的深空。"

 bgbn_space_exploration.13.name: "蓝矮星"
 bgbn_space_exploration.13.dasc: "这是一种曾经只存在于推演中的极致幻象，它呈现出一种足以令灵魂颤栗的明亮蔚蓝色。那是红矮星在耗尽所有生命后的回光返照，光芒中没有一丝一毫的杂质，带有一种近乎狂热的、将所有物质彻底燃烧殆尽的决绝。\n根据天体物理模型的长期演化模拟，蓝矮星是极低质量红矮星在主序阶段末期的理论形态。由于红矮星内部处于全对流状态，氢燃料可以被完全利用，当氢的丰度下降到临界点以下时，星体由于平均相对分子质量的增加会产生剧烈的收缩。这种收缩导致其表面有效温度从原本的三千开尔文左右骤升至六千甚至八千开尔文以上，光谱由深红转向蓝白。由于这种演化过程需要耗费数千亿甚至数万亿年的时间，在当前的宇宙中尚未观测到真实的样本。科研团队建立的数学模型显示，此时的星体光度将达到其初始状态的数十倍，随后由于氢燃料的最终耗尽，它将越过红巨星阶段直接进入白矮星的冷却序列。对这一理论天体的研究，实际上是对宇宙极远未来命运的一种预演，探讨了在热寂到来前物质最后的能量释放机制。"
 bgbn_space_exploration.13.a: "真是奇特"

 bgbn_space_exploration.14.name: "阶段性调查总结报告"
 bgbn_space_exploration.14.dasc: "当观测仪器的指示灯由急促的闪烁转为平稳的长明，这一段追逐星辰凋零轨迹的漫长旅程终于告一段落。在这一次的航行中，我们的探索团队不曾造访那些正当壮年的温和恒星，而是将目光投向了那些正在燃烧生命最后余温的、伟大的先驱者们。即便身处冰冷而寂静的舱室，只要凝视舷窗外那扭曲的时空与翻涌的星云色彩，就能感受到这些星体在谢幕前所爆发出的、令人屏息的生命意志。\n在科学家们的记录档案中，这些天体呈现出一种截然不同的存在节奏。它们要么以膨胀到足以吞噬整个行星系的庞大躯壳，展示着引力几乎无法束缚的衰朽之美；要么以剥离一切外壳的决绝，将内核深处锻造的重元素毫无保留地抛向深空。那些在光谱仪上剧烈跳动的发射谱线，就像是恒星在漫长岁月中积累下的所有记忆，在这一刻化作了照亮荒芜星域的信号火炬。即使是那个仅仅存在于演算模型中、预示着万亿年后宇宙命运的蔚蓝幻象，也以其跨越时间的静谧，给予了每一个随行探索者关于“永恒”的全新思考。\n对于大少女乐团国的民众而言，这些调查数据背后隐藏的真相远比物理参数更为动人。我们在这片星海中观测到的每一次爆发与坍缩，实质上都是宇宙在进行着一场伟大的循环。那些从老去星辰中喷薄而出的尘埃，将在无数个纪元后，成为孕育新生命与新梦想的温床。探索团队在整理总结时发现，这些处于终焉阶段的星体，其共性在于一种对自身存在形式的彻底重塑——它们不再仅仅是单纯的光源，而是成为了播撒未来星系的种子。\n这不仅仅是一次对死亡的注视，更是一次对新生的预习。我们带回的，是宇宙关于时间最厚重的注脚。当这些恒星的影像在统合政府的科普视屏中缓缓播放时，我们希望每一位观测者都能从中感受到那份跨越时空的坚韧。无论物质最终会走向何种形式的终点，那些曾经散发出的炽热光芒，早已成为了支撑我们走向更遥远、更深邃未来的基石。第一阶段的极端天体普查至此收官，而关于星辰的宏大叙事，才刚刚进入最激昂的篇章。"
 bgbn_space_exploration.14.a: "已归档"

 bgbn_space_exploration.15.name: "褐矮星（T型）"
 bgbn_space_exploration.15.dasc: "在红外线成像的滤镜下，一颗呈现出暗淡紫红色的朦胧球体从黑暗中浮现，它既不具备恒星的刺眼光辉，也不像行星那样完全冰冷。它游走在光与影的边缘，像是一个在胚胎阶段便停止了发育的半成品，在弥漫着金属云气的深空里，散发出一种沉闷且湿冷的红热感。\n褐矮星因其质量不足以引发稳定的氢核聚变而被定义为“失败的恒星”，其质量跨度大致在木星质量的十三倍至八十倍之间。其内部仅能进行短促的氘聚变或锂聚变，能量产出极低。科学观测将其细分为L、T、Y三种光谱型：L型表面温度较高，约为一千四百至两千两百开尔文，大气中充斥着铁与硅酸盐凝聚成的云；T型温度进一步下降，甲烷光谱信号占据主导；而极冷的Y型温度甚至可能低于水的冰点。探索团队在这些亚恒星天体的大气中观测到了剧烈的气象活动，包括类似于行星的环流带和持续数年的超级风暴。由于引力不足以维持球体结构的剧烈收缩，它们在红外波段表现出一种独特的、随着时间推移而不断暗淡的过程。这类天体广泛分布于星系中，往往作为孤独的流浪者存在，或者在恒星系统的边缘扮演着难以察觉的伴星角色。其光谱中的锂吸收线是区别于低质量恒星的关键标志，成为了科研人员划定物质演化界限的重要坐标。"
 bgbn_space_exploration.15.a: "它们是宇宙中被遗忘的中间派，在恒星与行星的裂缝中，用不被看见的红外脉动，谱写着一段关于未竟梦想的暗淡序曲。"

 bgbn_space_exploration.16.name: "白矮星"
 bgbn_space_exploration.16.dasc: "一颗被剥离了外壳的冰冷心脏在虚空中闪烁着苍白且锐利的光芒，它像是一粒被高度压缩的晶体，透射出一种令人窒息的高贵感。在观测视窗中，它呈现出一种几近完美的球体轮廓，四周的空间似乎因为其恐怖的密度而产生了细微的视觉扭曲，散发出一种死而复生的、幽冥般的威压。\n白矮星是中低质量恒星演化的终点，其质量通常集中在太阳质量的零点五至一点四倍之间（受限于钱德拉塞卡极限），而其体积却仅与行星相当。科研团队通过引力红移效应测算，确认其内部物质处于极端的电子简并态，密度可达每立方厘米数吨之巨。由于热核反应已经彻底停止，其发光仅源于残余的热能释放。观测显示其表面有效温度跨度巨大，新生的白矮星可达十万开尔文以上，呈现极致的蓝白色，而古老的个体则逐渐冷却至数千开尔文。光谱特征根据其大气成分主要分为氢占优的DA型和氦占优的DB型，部分样本显示出极强的表面引力导致的光谱线展宽。其内部结构被认为已逐渐金属化或结晶化，形成类似于巨型碳氧晶体的核心。尽管不再产生能量，白矮星极高的热惯性使其冷却过程异常缓慢，往往需要百亿年以上的时间。由于其极端且纯粹的物理环境，这些星体成为了探索团队研究物质在高压量子效应下性状的最天然实验室。"
 bgbn_space_exploration.16.a: "它是曾经那个辉煌巨人的微缩遗骸，以一种极致的内敛与冷酷，向宇宙宣告着引力在物质面前最终的、病态的胜利。"

 bgbn_space_exploration.17.name: "亚矮星"
 bgbn_space_exploration.17.dasc: "这种星体的光芒显得有些贫瘠且苍白，像是一幅由于原料短缺而未被完全着色的古老画卷。在恒星密集的星场中，它显得格格不入，其运动轨迹与周围的星群格相迥异，带着一种跨越时代的沧桑感，在光谱仪上投射出一种极度简洁、甚至有些简陋的信号特征。\n亚矮星主要存在于银河系的银晕或厚盘中，被视为宇宙早期的残留遗迹（星族II恒星）。其在赫罗图上的位置明显低于标准主序星，有效温度与其对应的光谱型相当，但光度却显著偏低。科研报告指出，这主要是由于其大气中重元素（金属丰度）极低，导致光球层的透明度增加，内层较热的辐射能更直接地散逸。其质量通常在太阳质量的零点五至零点八倍左右，寿命极长。由于金属含量低，其内部的核聚变循环（如CNO循环）受到限制，主要依赖质子-质子链反应，这使其辐射压相对较小，星体半径也比同质量的主序星更小。探索人员记录了这些星体极高的日心相对速度，证实它们正在以一种大角度的轨道穿越星系盘。光谱中氢线的清晰度异常之高，而钙、铁、镁等重元素的吸收特征则微弱得几乎难以寻觅。作为宇宙早期的活化石，亚矮星携带了关于原初物质构成的重要信息，是研究银河系早期化学演化史的钥匙。"
 bgbn_space_exploration.17.a: "它们是星海中的贫苦先民，用极其吝啬的重元素积累，守着一份从宇宙黎明时期传承至今、纯粹而简陋的古老信仰。"

 bgbn_space_exploration.18.name: "M型主序星"
 bgbn_space_exploration.18.dasc: "深红色的光芒带有一种压抑的、仿佛暗火燃烧的质感，它是数量最多的星体，却也是最难被肉眼观测到的存在。在红外探测器的增强图像中，它像是一颗跳动着的血色心脏，在星系的每一个角落密集地闪烁，却又保持着一种诡异的低调。\nM型主序星，即红矮星，其表面有效温度极低，通常在两千四百至三千五百开尔文之间。光谱中充斥着复杂的分子吸收带，氧化钛线是其身份的象征。质量仅为太阳的零点零八到零点五倍，这使得它们处于恒星定义的边缘。由于质量过低，其内部完全由对流驱动，核聚变产物氦在星体内均匀混合，不存在氦核堆积，因此它们不会演化为红巨星，而是会直接耗尽氢燃料。尽管总亮度极低，但红矮星往往是极度活跃的耀斑星，短时间内释放的X射线和紫外脉冲足以摧毁近距离行星的大气。科学团队在实时监测中捕捉到了数起规模巨大的磁重联事件，其亮度瞬间增加了数倍。这些恒星分布极度密集，占据了银河系恒星总数的七成以上，是研究星系动力学和低质量恒星演化的天然样板。"
 bgbn_space_exploration.18.a: "它们是宇宙中沉默的大多数，用最微弱的红光编织了星系最厚实的底色，在永恒的燃烧中冷眼看着巨星们的起落。"

 bgbn_space_exploration.19.name: "黑矮星"
 bgbn_space_exploration.19.dasc: "那是连光也无法定义的终极虚无，在所有的波段监测中，那里只有一片彻底的、死寂的真空。如果不是因为遮蔽了后方的星光，或者由于微弱的引力透镜效应，几乎没有人能察觉到这种天体的存在。它像是一块沉入冰冷海底的顽石，失去了所有的温度与存在的痕迹。\n黑矮星是白矮星在经过极其漫长的热能耗散后，温度降至与宇宙背景辐射持平（约三开尔文）后的终极形态。由于电子简并压依然存在，其体积保持不变，但不再发出任何可观测的电磁辐射。科学家推算，一个典型的白矮星转变为黑矮星需要花费约十的十五次方年（一千万亿年）甚至更久，这远远超出了人类所能理解的时间尺度。此时的星体内部已完全结晶化，由于绝对零度的逼近，物质的微观运动几近停滞，形成了一种极其纯粹的、高度有序的简并固态。由于没有能量产生和流失，黑矮星在重力场中表现为一个完美的、无光的质量点。它是热力学第二定律在宇宙尺度下的最终执行结果，标志着一段恒星历史的彻底终结。在探索大纲中，它被视为文明对“终极宁静”的一种哲学思考，是所有曾经喧嚣的闪耀最终归于沉寂的实证。"
 bgbn_space_exploration.19.a: "它是宇宙最后的墓碑，在光与热彻底熄灭的尽头，静静地躺在时光的废墟里，守着一份绝对零度下的永恒沉默。它是宇宙在万亿年后才会投递的一封情书，预示着即便是最平庸的灵魂，在终幕拉开时也能化作一道撕裂黑暗的蓝色闪光。"

 bgbn_space_exploration.20.name: "阶段性调查总结报告"
 bgbn_space_exploration.20.dasc: "当探索舰船缓缓收起其敏锐的感应阵列，在这片被明亮主序星遗忘的、近乎永恒的幽暗中，我们完成了对星系最底层基座的巡礼。这是一段远离喧嚣的航程。在执行任务期间，探测人员的视界里不再有那些足以撕裂视网膜的狂暴光辉，取而代之的是一种沉静、内敛，甚至带有一丝肃穆感的微弱红外脉动。\n在这一阶段的调查中，我们见证了宇宙最为顽强的一面。这些分布在航线盲区内的星体，呈现出一种超越了文明生命周期的巨大耐心。它们中有的从未真正点燃过核心的炉火，在漫长的岁月中守着一份湿冷的红热，在星云的缝隙里悄然流动；有的则在耗尽了一切辉煌之后，将所有的意志压缩进一颗行星大小的核心里，以苍白而纯粹的姿态，对抗着引力最终的崩塌。在观测室那被红外增强影像染成紫红色的屏幕前，每一个观察者都能感受到一种来自宇宙深处的、关于“存续”的深沉思考。\n对于大少女乐团国的民众来说，这些星体或许不如那些闪耀的巨星那般夺目，但它们却是星系中最值得信赖的背景。它们以近乎永恒的自律，在漫长的万亿年尺度上维持着热能的散逸，构成了宇宙最坚韧的物质网络。无论是在银晕中高速穿行的古老先民，还是在黑暗中冷眼旁观的寂静墓碑，它们都共同定义了物质演化的终极深度。调查团队在整理数据时发现，正是这些沉默的大多数，以其极其节俭的核聚变方式或极高的热惯性，为未来的探索者们标注出了宇宙中最后的回避所。\n我们带回的不仅是关于量子简并态与大气环流的观测记录，更是一份关于时间的厚重感悟。即便最热烈的闪耀最终都会归于寂静，这些深藏在黑暗中的余烬，依然会以其独有的方式，守望在时光的尽头。这并非一段关于终结的故事，而是一次关于永恒的初探。在这些无声跳动的脉动中，我们看到了一幅更为宏大、也更为平静的未来图景。至此，低光度天体探索阶段圆满收官，我们的目光将从这些微弱的火种移开，投向星空中那些更为狂暴、也更为深邃的物理禁区。"
 bgbn_space_exploration.20.a: "已归档"

 bgbn_space_exploration.21.name: "脉冲星"
 bgbn_space_exploration.21.dasc: "一个精准到令人发指的光信号在深空中规律地扫过，宛如一座建立在时空尽头的永恒灯塔。它的跳动频率跨越了亿万光年的距离，带着一种机械式的冷酷与神圣，在观测者的显示屏上划出一道道整齐得几乎不真实的脉冲波纹，仿佛有人在宇宙的阴影里叩击着永恒的节奏。\n脉冲星实际上是高速自转且磁轴与自转轴不重合的中子星。科学监测显示，其强大的磁场在两极方向形成了极窄的高能粒子束。当粒子束随着星体自转扫过地球方向时，便产生了周期性的脉冲辐射，其跨度涵盖了从射电到伽马射线的全频谱。其自转周期极短，从数秒到毫秒量级不等，其稳定性甚至超越了人类已知最精确的原子钟。科研团队通过对脉冲信号到达时间的长期记录，可以探测到极细微的引力场变动或周围行星的扰动。这类天体的表面温度依然极高，散发出强烈的X射线。脉冲星不仅是宇宙中最为精确的授时系统，其释放出的高能带电粒子在周围形成的脉冲星风云（PWN），更是研究高能天体物理和强场电动力学的绝佳场所。由于自转能量的缓慢流失，其频率会以极小的斜率逐渐降低，这一衰减过程被记录为星体生命力的流逝。"
 bgbn_space_exploration.21.a: "它是宇宙中最不知疲倦的鼓手，在无尽的虚空中，用光速的意志，为整片文明的航程定下了永恒的基准律。"

 bgbn_space_exploration.22.name: "中子星"
 bgbn_space_exploration.22.dasc: "在纯粹的黑暗中，一个近乎不存在的微小光点正散发出一种冷冽且沉重的压迫感。它没有庞大的躯壳，却让周围的时空呈现出一种病态的凹陷。接近这颗星体时，船体防护系统感受到的引力梯度呈现出指数级的跳跃，仿佛前方坐镇着一位正在无声审判万物的沉默之神。\n中子星是超大质量恒星演化末期发生超新星爆发后的残骸，其质量通常保持在太阳质量的一点四倍至三倍之间（受限于奥本海默-沃尔科夫极限），而其半径则收缩至令人战栗的十至二十公里。科研报告证实，其内部物质处于极端的中子简并态，密度高达每立方厘米数亿吨，模拟了早期宇宙的物理状态。由于角动量守恒，新生中子星具有极高的自转频率，并拥有强度高达十的四次方至十的八次方特斯拉的极强磁场。其表面重力加速度是地球的千亿倍以上，导致其表面极其光滑，最高的“山峰”或许仅有数毫米高。由于引力红移效应，从外部观测到的辐射谱线会产生显著的位移，展现出广义相对论效应下的典型特征。探索团队发现，中子星地壳层主要由由于高压形成的重原子核点阵构成，而核心处则可能存在超流体态或超导态的中子流。它代表了除黑洞外物质所能达到的最高致密极限。"
 bgbn_space_exploration.22.a: "它是物质在极度压缩下凝结而成的简并态心脏，用极小的体积承载了沉重的宿命，让每一寸引力都化作了时空的叹息。"

 bgbn_space_exploration.23.name: "磁星"
 bgbn_space_exploration.23.dasc: "观测视窗中，空间本身似乎都在因为极度的紧绷而颤抖，一种无形的力场笼罩了一切。接近这颗星体时，船体的原子结构仿佛都在由于强磁感应而发出细微的哀鸣，那是一种不可见的枷锁，将所有的磁通量线强行扭曲成了一个足以撕裂万物的无形风暴核心。\n磁星是中子星的一种特殊类型，其表面磁场强度高达十的十次方甚至十的十一次方特斯拉。这种极端磁场强到足以从原子的能级层面扭曲其形状，使其从球形变成针形。科学报告详细记录了磁星表面的“星震”现象：由于磁壳层的剧烈应力重组，引发了规模惊人的伽马射线和硬X射线爆发。这类爆发产生的能量通量在瞬时可扫过半个星系，对任何无防护的电子设备都是毁灭性的灾难。磁星的自转周期通常较慢，这与其极强的磁场制动效应有关。探索团队在观测中必须保持极其谨慎的距离，因为其磁能的释放是不规则且极具破坏性的。作为已知宇宙中最强的磁力源，磁星不仅是研究强量子磁力学效应的天然实验室，更是星海中最危险的引力陷阱之一。其寿命相对较短，通常在数万年后磁场便会衰减至普通中子星的水平。"
 bgbn_space_exploration.23.a: "它是被囚禁在微小躯体里的磁力暴君，用无形的长鞭抽打着时空的经纬，向任何胆敢靠近的造物宣示着绝对禁区的威严。"

 bgbn_space_exploration.24.name: "阶段性调查总结报告"
 bgbn_space_exploration.24.dasc: "当最后一次深空跃迁的余震平息，舷窗外的引力波纹重归寂静，我们终于结束了这场在时空断裂带边缘的孤寂漫步。这一次，我们的探索团队踏入了一片被绝对质量与冷酷规则主宰的禁区。在那些被称为“简并态核心”的星体面前，任何关于庞大与宏伟的旧有定义都显得苍白无力。那是一个个被引力剥离了所有虚饰、将千亿吨物质强行封印进微小躯壳里的沉默意志。它们存在于那里，就足以让周围的光年范围感受到一种深沉的肃穆。\n在观察室那片被警报数据填满的屏幕前，随行人员体验到了一种接近窒息的压迫感。这些天体在视觉上往往只是一个闪烁着清冷寒光的、极小的点，却拥有着让整艘船体防护系统都在微微颤栗的威严。那是一种几乎能将周围星光强行折弯的霸道力量。在这种极致的密度面前，空间本身呈现出一种近乎实质的粘稠感，仿佛船只正行驶在某种透明巨兽的呼吸之间。每一次靠近，都是在挑战物理法则对于“物质形态”的认知底线。\n这种探索过程伴随着一种极其奇妙的节奏感。无论是那精准如永恒钟表、在黑暗中不知疲倦地向全频谱投射光束的稳定频率，还是那些足以从微观层面扭曲原子结构、让所有感应设备都发出哀鸣的无形磁力风暴，都展现出一种宇宙最原始、最纯粹的秩序感。这种秩序中不存在任何温度，只有冰冷的物理常数在寂静中反复回响。这种纯粹性让所有的观测者都感到一种灵魂层面的震慑，仿佛看到了星海这台宏大机器最核心、最坚硬的齿轮。\n这不仅仅是一场对极高压物理状态的勘探，更是一场关于“质量”与“时间”的深层对话。我们带回了这些在极端崩溃边缘凝结而成的时空切片，它们证明了即便是在最彻底的毁灭之后，物质依然能以某种近乎永恒的频率，在这片星海中建立起最坚固的航标。这首由极端引力与强磁场交织而成的沉重序曲，将成为大少女乐团国迈向更深邃宇宙时，最坚实且不容置疑的授时座钟。"
 bgbn_space_exploration.24.a: "已归档"

 bgbn_space_exploration.25.name: "赫比格Ae/Be星"
 bgbn_space_exploration.25.dasc: "在一团混沌的、由尘埃与气体组成的厚重茧房中，一点微弱而坚韧的蓝白光芒正在挣扎着透射出来。它像是一个尚未发育完全的胚胎，在湍急的物质流中不安地跳动，周围环绕着旋转的暗色星云，呈现出一种原始而狂野的生命张力。\n这是处于主序前阶段的大质量恒星，表面温度约为七千至一万五开尔文。科研团队观测到其周围存在显著的吸积盘，大量的星际物质正沿着磁力线坠入恒星表面，引发剧烈的撞击变亮现象。光谱中呈现出强烈的氢发射线，且由于物质下落产生的红移与外溢风产生的蓝移交织，形成了独特的双峰结构。这类星体尚未开始稳定的氢聚变，其能量主要来源于引力收缩释放的热能。观测数据显示，其周边的星周环境极度混乱，原行星盘中的尘埃正在毫米波段下表现出结块迹象。通过对偏振光的分析，探索人员描绘出了环绕星体的螺旋状磁场结构，这些磁场正在有效地带走吸积过程中的角动量，确保了恒星的平稳诞生。"
 bgbn_space_exploration.25.a: "它是恒星世界的婴儿，在混沌的摇篮里放声啼哭，每一次吸积的闪烁都是它向这片星海发出的一声问候。"

 bgbn_space_exploration.26.name: "造父变星"
 bgbn_space_exploration.26.dasc: "在漆黑的帷幕上，那颗恒星如同宇宙跳动的心脏，以一种柔和且富有韵律的方式扩张、收缩。它的亮灭之间带着一种温暖的节奏，在深空的孤独中给予观测者一种近似呼吸的亲切感。它不需要恒定的光芒，却通过有节奏的变化，在星图中指引着前行的坐标。\n造父变星是光度呈周期性变化的一类脉动变星。科研团队记录了其独特的光度-周期关系（周光关系），这使得它们成为了测量星际距离的“标准烛光”。其变化源于恒星内部不稳定的流体静力平衡：当恒星内部的电离层厚度随温度变化时，会产生类似阻尼器的作用，导致恒星的外层大气发生周期性的膨胀与收缩。质量通常在太阳的五到二十倍之间，处于演化的特定阶段（赫氏空隙）。除了典型的I型造父变星，还有天琴座RR型变星和米拉变星等，它们涵盖了从青年到老年各阶段的演化特征。观测数据详细描述了其表面有效温度与光谱型的同步波动，这种精准的脉动不仅揭示了恒星内部的动力学参数，也为探索团队构建宏观的银河系坐标系提供了不可或缺的基准点。通过监测这些“闪烁”的频率，文明能够精准地丈量深空的跨度。"
 bgbn_space_exploration.26.a: "它是宇宙写在光里的刻度尺，用每一次呼吸般的颤动，为在大航海时代中迷失的旅人，丈量着回家的距离。"

 bgbn_space_exploration.27.name: "阶段性调查总结报告"
 bgbn_space_exploration.27.dasc: "当观测舰船穿过那些厚重的、如同轻纱般的星际尘埃云，展现在我们面前的是一个前所未有的、极具张力的生命剧场。这一次，我们告别了那些沉稳而寂静的长明灯，闯入了群星最为喧嚣的襁褓与跳动的心脏。在漫长的航程中，参与此次任务的所有探索人员都深刻地感受到了宇宙那份躁动不安的生命力。\n在那些被旋转的吸积盘所环绕的空域，我们目睹了恒星最初的挣扎与律动。即便隔着坚固的船体，也能感知到那些从原始物质茧房中透射出的蓝白光芒。那是恒星在正式步入舞台前的第一声啼鸣，周围飞舞的尘埃与翻涌的气体，勾勒出了一幅宏大且混沌的诞生画卷。在这种原始的野性面前，所有的技术语言都显得有些乏力。我们所看到的，是物质在引力的牵引下，正怀揣着对光明的渴望，进行着最为原始的汇聚。这种在黑暗中孕育希望的过程，让每一位观测者都感到一种莫名的震撼。\n而那些在深空中不断交替着明暗的星体，则以另一种方式震撼着我们的心灵。它们呈现出一种令人惊叹的规律性，像是在漆黑的背景上均匀地呼吸着。随着这种节奏，整片星域的光影都在发生着微妙的推移。这种周而复始的膨胀与收缩，赋予了冰冷的宇宙一种近乎温情的质感。站立在观察位上，你会感到自己正与某种宏大的意志同步跳动。它们以自身的起伏为代价，在漫长的岁月中为孤独的航行者们指引着方向。这种跨越光年的节拍，是宇宙中最可靠的诺言。\n这一阶段的探索让我们意识到，星辰从未是永恒不变的背景，它们也会成长，也会疲惫地呼吸。这些处于动荡中的光芒，以其特有的方式记录了物质与能量在时空中起舞的瞬间。当我们最终离开这片充满活力的星域时，带回的不止是关于光谱与亮度的记录，还有一种关于“存在”的深刻共鸣。这些在大地与深空之间闪烁着的律动，将成为指引我们寻找终极答案的灯塔。调查报告到此收官，而宇宙那更深沉、更诡谲的音符，正等待着我们在下一段旅程中去奏响。"
 bgbn_space_exploration.27.a: "已归档"

 bgbn_space_exploration.28.name: "史瓦西黑洞"
 bgbn_space_exploration.28.dasc: "原本繁星点点的背景中，突然出现了一个绝对圆润的、吞噬一切的黑色圆孔。周围的星光在那圆孔的边缘被拉伸成了扭曲的光弧，形成了一道辉煌且冷酷的日晕。那是一个没有深度、没有出口的终点，是视觉与逻辑的双重禁区，在静谧中散发着一种终结万物的安详。\n史瓦西黑洞是爱因斯坦场方程的最简单真空解，描述了一个不自转、不带电的静态黑洞。科学部定义其核心为奇点，而其边界则为史瓦西半径定义的事件视界。任何物质或辐射一旦进入此界限，将由于时空曲率的无限增大而无法逃逸。观测中，黑洞本身是不可见的，但其强大的引力会导致周围光线的偏转，形成所谓的“引力透镜”效应。在视界外侧，存在一个不稳定的光子层，光线在此处可以环绕黑洞运行。由于缺乏角动量和电荷，史瓦西黑洞表现出极致的物理纯粹性，完全由其质量决定其属性。科研团队发现，这种黑洞代表了空间结构的极限扭曲，是对“无”的物理化呈现。尽管其内部结构不可得知，但其外部引力场的对称性为文明研究引力本质提供了最纯粹的数学模型。"
 bgbn_space_exploration.28.a: "它是时空深处的一口枯井，没有任何花哨的回响，只用最纯粹的虚无，温柔地接纳了所有迷失在旅途中的光。"

 bgbn_space_exploration.29.name: "克尔黑洞"
 bgbn_space_exploration.29.dasc: "那是一个旋转着的引力磨盘，黑色的球体不再保持静止，而是带着一种撕裂空间的疯狂速度在自转。周围的光线不再是单纯的偏折，而是被强行拖拽进了一个倾斜的旋涡，形成了一个巨大的、明暗交替的吸积盘，像是一只在黑暗中张开的、带着余温的金色眼瞳。\n克尔黑洞是描述高速自转、但不带电的黑洞。科学报告重点描述了其独特的“能层”结构：在事件视界之外，空间被旋转的黑洞强行拖拽，这种现象被称为参考系拖拽。在能层内，任何物体都无法保持相对于远方恒星的静止。探索人员通过模型发现，克尔黑洞拥有两个视界，且奇点不再是一个点，而是一个环状结构。这种复杂的时空结构允许理论上存在的“彭罗斯过程”，即通过向黑洞抛射物质并回收其剩余部分来窃取其旋转能。由于高速旋转，克尔黑洞往往伴随着极为强大的磁力场和耀眼的高能粒子喷流，展现出远比静态黑洞更加狂暴的物理表象。它不仅是宇宙中最强力的能量提取器，也是研究广义相对论在动力学环境下极值表现的最高殿堂。"
 bgbn_space_exploration.29.a: "它是时空之海里永不停歇的磨坊，将一切物质和光线都卷入那疯狂的旋转中，研磨成了关于力量与虚无的终极祭品。"

 bgbn_space_exploration.30.name: "赖斯纳-诺兹特隆黑洞"
 bgbn_space_exploration.30.dasc: "这个黑色圆孔周围萦绕着一种不寻常的静电感，仿佛空气中时刻都在跳动着微弱的火花。虽然它看起来同样宁静，但那深不见底的黑色核心里，隐约透射出一种由极度电荷不平衡带来的排斥感，像是一头被困在狭窄笼子里、正由于愤怒而全身毛发直立的巨兽。\n这类黑洞描述了带电但不自转的状态。科学分析显示，由于电荷的存在，黑洞的引力与电场力在视界内部产生了复杂的竞争。与史瓦西黑洞不同，它拥有内视界和外视界。如果黑洞带有的电荷量达到一个临界值（极端黑洞），两个视界将重合，且根据某些理论推测，此时奇点可能会暴露在外界。尽管在实际宇宙中，黑洞由于对异号电荷的极快吸附而很难保持大量的净电荷，但其在数学上的存在为探索团队研究强耦合场论提供了完美的框架。观测中，这种黑洞周围的带电粒子流会呈现出一种独特的螺旋辐射模式，揭示了底层电场的几何结构。这种天体在文明的档案中被视为一种对引力与电磁力极限融合的哲学隐喻。"
 bgbn_space_exploration.30.a: "它是宇宙中最高傲的孤岛，用那不容置疑的电荷与引力壁垒，在虚无的深渊里构建了一座排斥整个世界的冷酷堡垒。"

 bgbn_space_exploration.31.name: "旋转带电黑洞"
 bgbn_space_exploration.31.dasc: "这是黑洞家族中最复杂、也最令人着迷的完整形态。它同时兼具了疯狂的自转与剧烈的电荷感应。观测器捕捉到的图像是一场时空、引力与电磁力交织的终极华尔兹，光线在此处被扭曲到了逻辑的边缘，呈现出一种无法用言语形容的、诡谲且华丽的几何美感。\n克尔-纽曼黑洞是广义黑洞理论的最终通用解，它同时具备质量、电荷与角动量这三大“毛发”。科学报告确认，其复杂的结构包含了旋转能层、内外双视界以及环状奇点。它展现出了物理学中最为精妙的对称性与动力学耦合：旋转带动了电荷产生磁场，而磁场又反过来影响了周围物质的吸积轨迹。探索团队在理论推演中发现，这种黑洞内部可能存在通往其他时空区域的拓扑路径，尽管这些路径可能极不稳定。其吸积盘中的等离子体在引力与洛伦兹力的共同作用下，释放出极具指向性的高能辐射。它是文明目前能够构想出的最复杂天体，也是物理学统一理论在宏观尺度上的终极考验。"
 bgbn_space_exploration.31.a: "它是群星中最深邃的谜题，将宇宙所有的野心、贪婪与力量都锁进了一个不可名状的旋转黑箱里，只留下一抹嘲讽般的闪耀光环。"

 bgbn_space_exploration.32.name: "阶段性调查总结报告"
 bgbn_space_exploration.32.dasc: "当最后一组用于校准的光信号消失在那个深不见底的圆孔边缘时，我们的视线也随之抵达了物理世界的终点。在这一次的航程中，所有的探索人员都共同经历了一种近乎窒息的、对于虚无的绝对敬畏。舷窗外的星空不再是平日里熟悉的点点微光，而是一幅被巨大的、不可名状的力量生生撕裂和揉碎的疯狂画卷。\n在那被称为奇点结构的领域周围，一切事物都展现出一种极其冷酷的秩序。无论那些黑色的深渊是在静谧中接纳万物，还是在疯狂的自转中研磨时空，亦或是带着凛冽的电磁感应排斥整个世界，它们都共同定义了“终结”的真实含义。在那道被称为视界的、如同薄幕般的界限面前，光线失去了它往日的自由，只能顺着扭曲的经纬线化作一圈圈辉煌且绝望的日晕。船体在接近这些区域时，每一个感官都在由于引力的压榨而发出无声的呐喊，那是一种即便拥有最高规格的防护系统也无法完全隔绝的、来自星球体量物质崩塌后的余威。\n站立在观察室内的科学家们陷入了长时间的沉默。大家在监视器上看到的，是光影在逻辑边缘最后的舞蹈，是时间在极度的扭曲中趋于停滞的幻象。这里没有生命的呼吸，没有星云的色彩，只有物理常数在极端状态下最赤裸的表白。这种极致的简约与狂暴交织在一起，构成了一种令人战栗的、属于虚无的尊严。\n这一阶段的普查任务，本质上是我们文明向着“未知”递交的一份挑战书。我们带回了那些被引力拉扯至变形的谱线数据，也带回了关于物质最终归宿的深刻反思。这些奇点天体像是一颗颗钉在时空布幕上的钉子，以其绝对的、不容疑的虚无，稳固了整片星系的架构。即使那里是光的墓碑，是所有闪耀梦想最终归于沉寂的深渊，但在那黑色的寂静中，我们依然窥见了宇宙最为纯粹、也最为宏大的真理。这份总结不仅是对数据的汇总，更是对这片星海最深沉秘密的一次集体致敬。接下来，我们的旅程将越过这些终点，去追逐那些更加诡谲、更加超脱常规认知的时空涟漪。"
 bgbn_space_exploration.32.a: "已归档"

 bgbn_space_exploration.33.name: "类星体"
 bgbn_space_exploration.33.dasc: "在极遥远的空间深处，一个比整个星系还要明亮数千倍的奇点正释放着近乎狂乱的能量。那不是一颗星，而是一整个星系的力量被凝聚在了一个狭小的中心。观测数据中充斥着剧烈的能量潮汐，跨越了百亿年的光阴，在今日的探测器上留下了关于宇宙初期最为暴戾的一场表演。\n类星体，即活动星系核（AGN），其能量源自星系中心超大质量黑洞对周围物质的疯狂吞噬。科学部确认，当物质坠入黑洞的吸积盘时，巨大的引力能转化为热能，其光度可达太阳的一百万亿倍以上。其光谱展现出极大的红移，揭示了其处于宇宙演化的早期阶段。吸积盘两端产生的相对论性喷流可延伸至数百万光年外，以接近光速的速度抛射高能粒子。这些能量释放过程会对其所在的宿主星系产生深刻影响，通过反馈机制抑制恒星的形成，重塑星系的演化路径。类星体的辐射极不均匀，具有剧烈的时间变率，这意味着其核心辐射区的大小可能仅有几个光天之久。对于探索团队而言，观测类星体不仅是在观测一个遥远的天体，更是在直视宇宙幼年期的暴力美学，是在时间的长河中回溯重元素形成与星系孕育的最初混沌。"
 bgbn_space_exploration.33.a: "它是宇宙最初的火炬，以吞噬一切的贪婪点燃了照亮半个寰宇的光辉，证明了即便在最黑暗的深渊边缘，也能迸发出最闪耀的生机。"

 bgbn_space_exploration.34.name: "夸克星"
 bgbn_space_exploration.34.dasc: "这颗星体散发出一种诡异的、略带荧光的色泽，比白昼更加明亮，也比深渊更加凝练。它的边缘轮廓在传感器中呈现出一种绝对的清晰感，没有任何弥散的痕迹。当舰船在其引力圈边缘巡航时，一种莫名的秩序感充斥了空间，仿佛这里的每一颗粒子都已经被排列到了逻辑的终点。\n夸克星是一种理论上存在的、比中子星更为致密的致密星，其内部的中子在极端压力下进一步解禁，崩塌成为夸克物质。科学报告分析认为，其核心可能由处于简并态的奇夸克物质构成，形成所谓的“奇物质”。这种物质在物理上是极其稳定的，甚至被认为可能是物质的最稳定状态。夸克星的直径预计比中子星更小，而其表面温度和引力强度则更高。由于夸克之间强相互作用的特性，这类星体可能拥有一个极其薄且坚硬的地壳层，甚至可能根本没有常规物质构成的地壳。观测中，若发现某种致密星的半径小于其质量对应的史瓦西半径的极限值，或者是冷却速率异常之快，便可能是夸克星的潜在标志。它代表了量子色动力学环境下物质结构的终极形态，是已知宇宙中能量密度与物质序位的最高点。它不仅挑战了经典的核物理模型，也为文明理解物质的底层规律提供了终极的实验场。"
 bgbn_space_exploration.34.a: "它是物质在绝境中完成的最后一次升华，将所有的结构彻底粉碎后，重组成了一种连上帝都无法轻易拆解的、最纯粹的真理。"

 bgbn_space_exploration.35.name: "索恩-祖特阔夫天体（TŻO）"
 bgbn_space_exploration.35.dasc: "这是一种在结构上极其扭曲的存在，外观上它像是一颗巨大的、步入暮年的红巨星，但其核心处却透射出一种与其庞大体型完全不符的锐利能量。接近它时，传感器捕捉到了多重叠加的频谱信号，仿佛两颗截然不同的灵魂被强行缝合在了一个臃肿的躯壳内，散发出一种怪诞且不安的气息。\nTŻO是一种假想的、且已有观测候选者的奇异混种天体，表现为一颗红巨星或红超巨星将其伴星中的中子星吞噬后形成的共生结构。在中子星坠入巨星核心的过程中，它并不坍缩，而是取代了原有的核聚变核心，并依靠中子星表面的物质积聚产生能量。科研团队分析发现，这种天体的光谱呈现出异常丰富的化学丰度，包括锂、钼、铷等重元素的超量产生，这被视为核聚变与中子俘获过程在特殊环境下耦合的标志。其内部能量传递主要依赖对流，将核心处产生的奇特核合成产物输送到星体表面。这种天体是恒星系统演化史上的异数，代表了死亡与新生的畸形融合。虽然其结构极不稳定，且可能在数千到数万年后彻底崩塌，但它在存在期间展现出的热力学特征，为文明探索恒星内部极端动力学提供了独一无二的样本。"
 bgbn_space_exploration.35.a: "它是宇宙在一次巧合中拼凑出的星际弗兰肯斯坦，以一种不合常理的嵌套姿态，在演化的末路里演奏着荒诞的二重唱。"

 bgbn_space_exploration.36.name: "阶段性调查总结报告"
 bgbn_space_exploration.36.dasc: "随着深空探测阵列捕获到最后一簇来自百亿年前的微弱电磁回响，这一段在时空与物质极限边缘游走的漫长航程，终于抵达了它阶段性的终点。对于每一位身处其中的探索人员来说，这并非一段能够用语言轻易复述的旅程。我们所造访的那些领域，早已超脱了常规星图的逻辑范畴。在那里，宇宙收起了它对生灵的温和与仁慈，转而以一种近乎暴戾且冷酷的方式，展示着物理法则最原始、最不加修饰的真理。\n在那些几乎能将整座星系点燃的光芒面前，我们真切地感受到了一种跨越时空的宏大感。当那些来自宇宙黎明时期的能量潮汐扫过船体，观察室内的所有人都陷入了长久的静默。大家所凝视的不再是单独的星点，而是一整个时代坍缩、研磨后释放出的绝响。那些在黑暗中闪烁着的、比所有恒星都要明亮的奇点，像是一座座建立在虚无之上的丰碑，记录着物质在坠入深渊前最后的挣扎与辉煌。即使是在那些微小的、将所有秩序压缩到极致的致密个体周围，空间本身也呈现出一种如同固态般的紧绷感。那是物质在拒绝进一步崩溃时，用强相互作用构筑出的最后一道防线。\n在这一阶段的总结中，最为触动人心的并非那些动辄跨越数量级的能量参数，而是宇宙在极端条件下的那种“包容性”。即便是在最为怪诞、甚至有些违背直觉的共生结构中，引力与热力学依然在艰难地维持着某种脆弱的平衡。这些在演化史缝隙里偶然出现的异类，以其不合常理的嵌套姿态，为我们展现了宇宙在规则之外的某种狡黠与复杂。这种观察让所有的探索者都意识到，我们对这片星海的认知依然停留在极其浅薄的表层。\n这一系列调查报告的收官，标志着大少女乐团国对已知物理边界最远距离的一次眺望。我们带回了那些能让现行核物理模型产生动摇的光谱记录，也带回了对这个宇宙更深层、更本质规律的敬畏。这些在深空深处闪烁着的、狂暴且奇异的信号，早已成为了指引我们前行的灯塔。它们证明了即便在逻辑的终点，在最彻底的混沌与致密之中，依然存在着通往真理的阶梯。至此，极端天体探索圆满结束，我们将带着这些沉重且珍贵的知识，回到那片温暖的星云之中。"
 bgbn_space_exploration.36.a: "已归档"

 bgbn_space_exploration.37.name: "反物质恒星"
 bgbn_space_exploration.37.dasc: "这颗星体看起来与普通的恒星似乎毫无二致，却展现出了一种令人不寒而栗的排斥感。当它周围极其稀薄的星际介质与其表面接触时，会爆发出一道道极其微弱、却又纯净到极点的伽马射线闪烁。它像是一个装满了火药的精美瓷瓶，静静地漂浮在布满了火星的仓库里。\n反物质恒星是理论上完全由反粒子构成的恒星。科学报告指出，由于电荷共轭、宇称及时间反演对称性（CP破坏）的差异，这类恒星在目前的宇宙中极其罕见。观测它们的关键在于监测其表面的湮灭现象：任何正物质尘埃的坠入都会引发百分之百质能转换的能量释放，产生特定的零点五一兆电子伏特的伽马谱线。除此之外，其核聚变产生的反中微子流也与正物质恒星截然相反。这种天体是文明研究物质与反物质不对称性起源的终极证物。探索团队必须在极其安全的距离外进行被动观测，因为任何实际的接触都意味着一场无可挽救的能量大湮灭。它象征着宇宙中另一种可能的秩序，一个与我们完全对立、却又在物理规律下保持平衡的镜像世界。"
 bgbn_space_exploration.37.a: "它是宇宙中最高冷的异教徒，用那一身随时准备同归于尽的傲骨，在这片正物质的主场里，坚守着一块彻底相反的阵地。"

 bgbn_space_exploration.38.name: "普朗克星"
 bgbn_space_exploration.38.dasc: "黑洞的核心不再是一个令人绝望的奇点，而是一个正在疯狂反弹的、极小且极致密的量子核心。它在视界内部散发出一种类似于新生婴儿的律动，在那吞噬一切的黑色面纱下，隐藏着一种由极度挤压后产生的新生希望。\n普朗克星是量子引力理论下的一种假想黑洞内部形态。根据圈量子引力论，物质在坍缩至普朗克尺度时会产生巨大的量子压力，阻止奇点的形成。这种状态下的星体实际上是一个处于极度慢动作下的“反弹”过程。科学部推测，由于极强的引力时间膨胀，从外部观测，这颗普朗克星可能需要数千亿年才能重新破开视界喷发而出（表现为白洞）。观测中，这表现为一种极细微的、由于量子隧道效应导致的霍金辐射频率畸变。它是文明探索广义相对论与量子力学最终统一的试验场，证明了在物理学的最深处，并不存在真正的终结，只有形式的转化。这种天体为人类理解宇宙循环和时空底层的离散性质提供了最终的答案。"
 bgbn_space_exploration.38.a: "它是藏在深渊最底层的回春术，在引力试图杀死所有物质的瞬间，它用顽皮的量子效应，为毁灭扣下了一个新生的快门。"

 bgbn_space_exploration.39.name: "宇宙弦"
 bgbn_space_exploration.39.dasc: "传感器的警告声打破了宁静，在一片虚无的真空中，探测到了一道极细、却拥有无穷质量的“划痕”。它没有厚度，没有实体，却像是一道被凝固在时空背景中的激光痕迹，将周围的星光整齐地切断，产生了一种如同玻璃裂纹般的视觉错位感。\n宇宙弦是宇宙早期相变过程中由于时空拓扑缺陷而产生的理论一维客体。科学部推算，一厘米长的宇宙弦质量就可能超过一整座喜马拉雅山脉。它拥有极高的张力，并以近光速在星系间震荡，其产生的引力波具有独特的尖锐波形。观测中，它最典型的标志是引发极窄且整齐的引力透镜效应：两个完全相同的星系图像会被并排排列在弦的两侧。这类天体是时空结构本身的“裂缝”，携带了宇宙大爆炸瞬间最原始的对称性破缺信息。探索团队试图通过接收其振动产生的极低频背景辐射，来反推宇宙最初时刻的物理常数。它不仅是宏大的星际奇观，更是文明通往高维物理世界的敲门砖。"
 bgbn_space_exploration.39.a: "它是造物主在织造星海时留下的一根断掉的丝线，虽然细不可察，却维系着宇宙最古老的伤痕。"

 bgbn_space_exploration.40.name: "最终调查总结汇报"
 bgbn_space_exploration.40.dasc: "当探索舰船缓缓驶离那片被引力与维度扭曲得几乎无法辨认的星域，回到秩序井然的常规时空时，随行人员们依然沉浸在一种无法言喻的恍惚之中。如果说之前的航程是在阅读宇宙的宏大史诗，那么这一次，我们则触碰到了这本史诗被撕裂的页角。在这段充满未知的旅程中，那些被传统星图视为禁忌或幻觉的存在，以一种冷峻且超越逻辑的方式，实实在在地横亘在我们的必经之路上。\n在这些被称为“时空裂痕”的领域穿行时，感官所接收到的一切都在挑战着认知底线。舷窗外，原本笔直的星光在某些看不见的“划痕”边缘断裂、重组，呈现出一种如同破碎镜面般的错位感。那种仿佛将整个星系折叠、缝合后的视觉冲击，让整座观察室都陷入了长久的静静默。大家所凝视的，是宇宙在最初织造时留下的断线，或者是物质在极度挤压后迸发出的最后一点不屈。在面对那些随时可能引发能量大湮灭的镜像存在时，船体防护系统感受到的不仅仅是物理层面的张力，更有一种来自两个对立世界互相排斥的、灵魂深处的战栗。\n这一阶段的调查报告中，最令科研人员动容的共性在于一种“未完成感”。这些天体既像是不稳定的实验原型，又像是造物主遗留在荒原上的草稿。无论是那隐藏在深渊底层的量子脉动，还是横跨星际、将彼岸强行拉至眼前的虚空口袋，都展现出了宇宙在法则边缘那份近乎顽皮的灵活性。这种灵活性证明了我们所熟知的物理常数，或许只是某种更为宏大且变幻莫测的乐章中，一段相对平稳的旋律。\n我们带回了那些由于相位漂移而扭曲的观测波形，也带回了对这个宇宙构架最深层、最本质的一份谦卑。这是一次关于发现的终极课业。在这些时空的伤痕与镜像的闪烁中，我们窥见了真实世界那复杂到令人绝望、却又精妙到令人落泪的底层结构。至此，第一阶段的深空天体巡礼已接近尾声。我们将带着这些关于维度、物质与时空碎片的记忆，回到闪耀的母星，为那首即将唱响星海的、属于全人类文明的终极合奏，填入最深邃的符点。"
 bgbn_space_exploration.40.a: "已归档"

