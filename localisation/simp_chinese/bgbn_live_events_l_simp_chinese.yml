#生活事件本地化，本地化可以在启动群星的时候热更新
l_simp_chinese:
 bgbn_live.1.name: "直播事故"
 bgbn_live.1.desc: "一年一度的Bang Dream 比赛刚刚在[event_target:kirakira_sol_system_earth.GetName]上的CiRCLE复合体主舞台上落下了帷幕，一支来自偏远殖民地的乐队在大赛中异军突起，以其独特而演奏风格脱颖而出，在决赛一举夺得了本次Bang Dream 的最高奖项。\n这本该是大少女乐队时代的又一桩荣耀，但不幸的是，在随后由户山香澄亲自颁发top1的奖章环节，意外发生了。或许是由于主唱独特的魅力，又或许是因为这支乐队优异的表现，我们闪耀的领袖竟在全国直播之中一边说着“非常kirakira呦～”一边扑过去抱住了获胜乐队的主唱，这位可怜的少女当场就因震惊而失去了意识，而所有收看颁奖仪式的国民都通过直播看到了这令人震惊的一幕。市谷有咲已发表声明拒绝对此事发表评论。\n很显然，这个小插曲引起大规模的讨论。"
 bgbn_live.1.a: "我看不出这又什么不好的，我们不应阻止真情流露"
 bgbn_live.1.b: "虽然心情可以理解，但有时候我们还是需要严肃一点"

 bgbn_live.2.name: "外交事故"
 bgbn_live.2.desc: "在近日召开的星海共同体成立纪念大会上，因我国在共同体成立中发挥的重要作用，我们闪耀的领袖被邀请在大会上发言。正当代表们沉浸在共同体伟大事业之中时，突如其来的变故发生了。被邀请上台发言的户山香澄等五人突然扔掉了我们精心准备的发言稿，掏出不知怎样带进会场的便携乐器开始面对全体与会代表和收看直播的全银河民众演奏她们的新曲。按照共同体的规定，不论发生什么，在国家元首发言期间都不能打断。因此原本五分钟的发言变成了近半小时的演唱会。令人惊讶的是，尽管他们中的许多从未了解我们的音乐形式，许多人的文化中甚至没有音乐概念，不少代表还是对她们的演奏表示了高度的认可。一名与会代表更是在事后表示“这简直是对共同体精神最好的诠释，她们这种精神值得我们所有人学习”。此事在银河政坛掀起了轩然大波，poppin party 一时在银河社会中名声大噪。这将成为我们的闪耀文化传播到星海中的重要一步，我们也将在政治，经济领域受益菲浅。"
 bgbn_live.2.a: "下次共同体发言的时候别为她们准备发言稿了，准备乐器吧"

 bgbn_live.3.name: ""
 bgbn_live.3.desc: ""
 bgbn_live.3.a: ""
 bgbn_live.3.b: ""
#全星系随机生活事件本地化
 bgbn_ramdom_live.1.name: "干劲昂扬"
 bgbn_ramdom_live.1.desc: "星辰治愈巡回演唱会圆满落幕！\n演出产生的积极影响远远超出了我们的预期：居民们不仅幸福指数飙升，而且一种类似于“会后干劲”的现象正在星球上蔓延。初步数据显示，几乎所有岗位的生产效率都获得了显著提升。"
 bgbn_ramdom_live.1.a: "这股由音乐和希望点燃的热情，正转化为实实在在的生产力提升。"

 bgbn_ramdom_live.2.name: "共鸣中明澈"
 bgbn_ramdom_live.2.desc: "在“闪耀永恒”仪式中，总督§Y[event_target:bgbn_random_live_2_planet.GetLeaderName]§!除了感受到一体同心的震撼外，还额外获得了一种“明晰”的类似感觉。在那股磅礴的集体意识洪流中，总督§Y[event_target:bgbn_random_live_2_planet.GetLeaderName]§!有所理解：人们过往对物质舒适度的无度追求，在某种程度上反而成为了个体追寻闪耀的枷锁。倘若要说什么是真正的富足，答案在于内心的充盈与对共同梦想的奉献。"
 bgbn_ramdom_live.2.a: "批准总督尝试管理新政"

 bgbn_ramdom_live.3.name: "嘘声绕梁"
 bgbn_ramdom_live.3.desc: "不同少女乐队的粉丝团体之间的对立终于越过了底线。\n在一次联合公演的宣传活动中，由于对演出顺序和资源分配的不满，Afterglow乐队的激进粉丝团与Pastel*Palettes乐队的粉丝在街头发生了冲突，他们从口角纷争快速升级到互相投掷物品，最后演变为大规模斗殴。\n这次大规模冲突造成了公共设施的严重损毁，多名市民受伤，许多民间人士发表了对于演唱会相关规章条例的安全性质疑。"
 bgbn_ramdom_live.3.a: "所有涉事粉丝团暂停一切活动，演唱会进行内部整顿。"

 bgbn_ramdom_live.4.name: "失调的赋格"
 bgbn_ramdom_live.4.desc: "紧急报告！我们的一座正在试运营的“理念”生产设施发现了严重问题！\n为了追求日益增长的需求指标，工人们长期、高强度地在梦中体验各种精心设计的“人生剧变”，如今，这种持续的情感透支终于导致了反效果：大量工人出现了严重的心理问题，他们情感麻木、创造力枯竭，甚至分不清梦境与现实。\n“理念”的产量急剧下降，更糟糕的是，一种空洞和绝望的情绪正在设施内蔓延，并开始像传染病一样影响周边的社区。"
 bgbn_ramdom_live.4.a: "暂停生产，进行心理干预和疗养。"

 bgbn_ramdom_live.5.name: "纸牌屋？"
 bgbn_ramdom_live.5.desc: "一份匿名的资料包被送到了多家媒体手中，其中包含了[event_target:bgbn_random_live_5_planet.GetName]某高级官员与一位崭露头角的乐队少女之间关系密切的影像和通讯记录。\n虽然该内容经过剪辑，但其暗示性极强，民间各地被引发了轩然大波。指控者称，该官员利用职权为其提供了本不该属于她的演出机会与资源，并在演出后邀请其参观诸多重要的地点。\n民众的愤怒不仅指向官员的滥权，更指向这名乐队少女及其所属乐队。民众认为她们“玷污了音乐的纯粹”，动摇了公众对其的信任。"
 bgbn_ramdom_live.5.a: "严惩不贷，以儆效尤。"

 bgbn_ramdom_live.6.name: "怪人假面"
 bgbn_ramdom_live.6.desc: "一个令人震惊的消息从文化部下属的医疗中心传出：暗黑风格乐队“Ave Mujica”的全体成员，她们在例行的心理评估中被检测出存在严重的心理问题，包括但不限于：重度焦虑、现实感减弱与集体性情感枯竭。\n医疗专家初步判断，这些问题可能与其乐队一直秉持的沉重戏剧风格、高强度的演出安排以及成员极端的情绪投入有关。\n为避免情况进一步恶化，文化部已下令，Ave Mujica的所有演唱会、唱片录制及线上活动即刻起暂时中止，直至成员心理状态恢复稳定。消息一经传出，其粉丝群体中充满了担忧与迷茫。"
 bgbn_ramdom_live.6.a: "她们应当尊重医嘱。"

 bgbn_ramdom_live.7.name: "ボクとワタシの?"
 bgbn_ramdom_live.7.desc: "在Ave Mujica乐队暂停活动的敏感时期，一位自称是Ave Mujica核心粉丝、掌握内部消息的人士在网络上发布了大量经过处理的聊天记录与匿名证词！\n他指控乐队内部存在长期的霸凌现象。爆料指出，乐队中的某个成员对另一位（或多位）成员进行了持续性的打压，以及其他成员之间的互相欺凌，这些事情导致了被霸凌成员的心理健康恶化。此消息如同投入湖面的巨石，迅速引爆了舆论。\n人们开始争论，这究竟是粉丝的过度解读与造谣诽谤，还是揭开了“乐队艺术”之下的阴暗面？"
 bgbn_ramdom_live.7.a: "立即成立调查委员会。"

 bgbn_ramdom_live.8.name: "那你还要黄瓜不"
 bgbn_ramdom_live.8.desc: "近期，一些细心的粉丝通过对比海量影像资料与匿名爆料，拼凑出了一个足以撼动整个乐团国粉丝圈的惊人发现：行事神秘、近来行踪成谜的MyGO乐队成员，竟被多次目击与Ave Mujica的个别成员在非公开场合私下会面,看起来关系还很好的样子。\n进一步的深挖引发了更大的震动——有大量间接证据表明，Ave Mujica那位始终以面具示人、技巧精湛的键盘手，其真实身份极有可能就是当年主导组建了MyGO，后又离奇消失的核心创始人之一！"
 bgbn_ramdom_live.8.a: "这难道也是无法预测的命运之舞台？？？"

 bgbn_ramdom_live.9.name: "终极捕食者"
 bgbn_ramdom_live.9.desc: "一个以制作“硬核军事风”、“废土求生风”视频而闻名的民间少女乐队最近被推上了风口浪尖：她们的最新作品是一部将乐队角色置于“统合战争”背景下的叙事MV，该作因短时间内大量点击与完播率高而上了视听排行榜前列。这部作品以真实战争档案影像、沉重的配乐和经过考究的军事细节作为主要组合，本应当是局限于小范围内的鉴赏，却意料之外地引发了远超亚文化圈层的广泛讨论。部分观众盛赞其提醒着人们铭记过去的经验教训；但另一部分观众、尤其是一些Pastel＊Palettes和Hello, Happy World!的粉丝则强烈抗议这一作品，他们认为该乐队作品“滥用战争伤痛”、“与音乐带来的快乐与梦想背道而驰”。"
 bgbn_ramdom_live.9.a: "不要留在这草地上"

 bgbn_ramdom_live.10.name: "焦点风暴"
 bgbn_ramdom_live.10.desc: "一个本应受到管制的匿名数据分析网站不知为何在年轻民众中流行起来，在追究部分监管人员失职、修补监管漏洞之前，也许您可以先看看相关事件报告：这个匿名网站通过抓取社交平台、音乐流媒体、乃至官方指数等海量数据，用某种复杂算法生成了以“乐队人气趋势预测”、“跨派系粉丝细则”、“演出效率排行榜”为名的相关内容。虽然网站声明相关数据“仅供娱乐”，但这些看似作为乐队之间比拼的数据却实实在在地挑动了各派粉丝的神经，以至于对于相关内容的讨论变成了各路人马共襄盛举的场面。部分民间专家试图抨击其“冰冷化梦想”、“助长了功利性”来将局势降温，但收效甚微。如今不同乐队后援会之间围绕着这个网站的榜单排名吵闹不断，并有逐渐从乐队论坛蔓延至主流新闻评论区的趋势。"
 bgbn_ramdom_live.10.a: "立刻追溯网站并对乐队粉丝降温！"
 bgbn_ramdom_live.10.b: "真是勃勃生机、万物竞发啊！"

 bgbn_ramdom_live.11.name: "呃，早上好？"
 bgbn_ramdom_live.11.desc: "在§B[event_target:bgbn_random_live_11_planet.GetLeaderName]§!星球，当地一座名为“乐之城”的都市区块产生了人口过度密集化问题，再加上当地工业园区中工人因环境过分单调产生的不满，有关人口迁置、重新规划区块的事项已经迫在眉睫。负责该星球的内阁针对该问题提出了一项计划，该计划派遣“Hello, Happy World!”派系的乐队及相关心理小组，预计她们会在问题区块进行巡回演出与驻留，这一行为旨在提升当地民众整体舒适度。内阁认为如此主动调节集体情绪，可以在人口与区块问题解决途中压制潜在的项目隐患。有批评者认为这是在用珍贵的国家资源粉饰太平，而非解决区域发展不平衡的根本问题；同时计划消耗的资源很可能远超内阁所定的预期上限，且安抚效果是否持久存在疑点"
 bgbn_ramdom_live.11.a: "有些事情得做了才知道是否可行。"

 bgbn_ramdom_live.12.name: "早上好，乐之城！"
 bgbn_ramdom_live.12.desc: "早上好，乐之城！昨天的专辑大乐透，最后中奖结果是满打满算的整整三十个！多亏了没完没了的Live演出，光TopStar就对邦了十场歌会。听说Morfonica派系的乐队也要参与新的红白歌会，我看你们全得赔钱，因为Roselia派系肯定不会错过这场好戏。与此同时都市区块项目总组还在办公室里对着人口迁置和工业园区规划焦头烂额吧。而在太平洲呢…好吧…太平洲还是那个太平洲。觉得眼熟？像这样的大型乐队竞赛可是只在乐之城发生，你那边很可能不会是下一个，除非你能做出你人生中最重要的决定——加入……大少女乐队时代。"
 bgbn_ramdom_live.12.a: "至少一切都在稳中向好。"

 bgbn_ramdom_live.13.name: "BandDream？"
 bgbn_ramdom_live.13.desc: "为了庆祝国家迈入了新的阶段，民间呼声提议由Poppin' Party与Roselia派系乐队少女们举行一场联合纪念Live。然而在筹备阶段，两派乐队成员在理念上产生巨大分歧，共演似乎就要变为对邦了。Poppin' Party派系主张以“融合”为主题，希望通过双方派系音声的交织来创造全新的、充满希望的旋律。而Roselia派系则认为，真正的“和声”应是灵魂深处激烈碰撞后的绚烂火焰，她们认为应当以“交锋”为脉络进行演出，这涉及到更强烈、更压迫的项目编排。所以最近几次联合排练均因双方乐队少女演奏时互相干扰、成员精神疲劳而被迫中断。如今预计演出的时日正在接近，是坚持寻找共识，还是改为分开演出？这场不同派系间的艺术理念碰撞已然成为公众瞩目的焦点。"
 bgbn_ramdom_live.13.a: "Wagari Masu"

 bgbn_ramdom_live.14.name: "BandDream！"
 bgbn_ramdom_live.14.desc: "距离联合Live预演仅剩不到半个月，公众对于这场表演的期待已臻顶点，而在舆论场中Poppin' Party与Roselia派系乐队少女们的各自支持者依旧争论不休，也许我们需要启动备用方案，将庆典内容改为两团顺序演出。等等，刚刚从排练现场传来消息，我们不必更改演出安排，两派乐队可以如期进行演出活动。根据线下传来的报告，是双方成员在练习间隙互相静下心来倾听彼此演奏的“话语”，并用自己的音乐作出了“回应”。最初她们依然能听出谨慎的试探与风格的泾渭，然而很快某种难以言说的感受开始流淌：Roselia的锋利被Popipa的柔韧所包裹却不减其芒，Popipa的光亮被Roselia的深邃所映衬而愈显璀璨。根据在场部分人士的回忆，她们在听到乐章中心时，双方的音乐甚至短暂地“消失”了，取而代之的是灵魂深处直接响起的一种前所未有的、恢弘而温柔的和弦，仿佛是亘古传来的回响。"
 bgbn_ramdom_live.14.a: "宇宙的余音。"

 bgbn_ramdom_live.15.name: "异教"
 bgbn_ramdom_live.15.desc: "位于§B[event_target:bgbn_random_live_15_planet.GetLeaderName]§!星球的殖民地官僚机构向我们报告了一起严重文化事件。该殖民地的主要人口中包含一批在社会公养体系下成长、极度推崇解放生产与感知扩延的年轻一代。他们在近期自发组建了一个名为“后人类复调”的音乐团体，该团体完全不使用传统乐器，而是通过植入体内的元件直接交互彼此的神经信号，以本身作为生体计算机将计算产生的数学、传感器的实时感知、乃至对体内元件的微观听觉进行合成，合成为无法用常规听觉接收、只能通过特定神经接口体验的数字“音乐“。这些年轻一代宣称这是基于“闪耀哲学”的必然进化，是最终会超越肉体局限、与宇宙本质直接共鸣的终极音乐。然而，该团体的活动导致了该殖民地传统乐队文化的迅速边缘化，并引发了§B[event_target:bgbn_random_live_15_planet.GetLeaderName]§!星球与母星文化之间的隔阂。年轻一代甚至开始游行要求当地政府拒绝向母星输送税收，他们认为母星的意识文化过于情感且低效。许多星球的文化官员震惊地将此斥为技术异教，认为这群人是在奏响文明分裂的序曲。"
 bgbn_ramdom_live.15.a: "连税务都敢不交，这已经不是一般的噪音了！"

 bgbn_ramdom_live.16.name: "一步之遥"
 bgbn_ramdom_live.16.desc: "社会学部提交了一份当今看来激进且备受争议的计划，其名为天才迭代。该计划提出利用理念捕梦网技术进行相关逆向发展，从而不再是从梦境中提取理念，而是将精心编辑、浓缩了特定人生转折的理念晶体导入给特定目标，比如社会公养体系中培养的胚胎或婴儿的潜意识深层。理论上，这相当程度是能预定其人生轨迹，批量培育出拥有超常天赋的科学家、技术专家或乐队少女。计划开头的内容描述这是文明加速飞升、最大化利用理念资源的必然一步。但在伦理道德方面这会是对生命本质的亵渎，这个计划会将未来的生命个体降格为预装辉煌的容器，谁也不知道这会不会扼杀自发闪耀的可能。尽管伦理道德在特定情景下不过手中泥土，但相关技术是否使用仍旧只在您的一念之间。"
 bgbn_ramdom_live.16.a: "永久封存，立法禁止意识编辑。"
 bgbn_ramdom_live.16.b: "批准计划试点。"

 bgbn_ramdom_live.17.name: "火花"
 bgbn_ramdom_live.17.desc: "天才迭代计划的试点已悄然运行了两年，首批三十名“预定”者即将进入幼年教育阶段。尽管相关试点保密措施严格，但一桩悲剧性的意外还是撕裂了秘密的帷幕，使得试点工程被迫暴露在了公众的视野之中。一名编号幼儿在常规灵能测试中突然陷入无法抑制的意识崩溃，释放出了充满绝望与自我认知混乱的尖锐灵能啸叫。这股啸叫不仅损坏了区块结构，还将整栋建筑、包括幼儿本身都化作了难以消散的诡谲声响。即使是相隔数个区块的乐队少女学员们都感受能清晰感应到事发地点，但因为快反部队随着啸叫一起被蒸发，我们并没有足够的人手进行遮掩。真相如同野火般蔓延。内部泄密的文件、骇人听闻的容器称呼、以及那失败品产生的损害，彻底点燃了公众的怒火。即使没有以乐队粉丝团体为先锋，每一个城市区块仍旧有成千上万的市民、艺术家、普通父母乃至部分官方派系乐队少女聚集起来，他们高唱抗争的歌曲，声浪震天。全国媒体哗然，就连内阁中部分乐队派系代表也公开质疑，要求紧急审查计划。帝国引以为傲的梦想基石，正被自己点燃的火焰灼烧。"
 bgbn_ramdom_live.17.a: "就此停下吧。”"
 bgbn_ramdom_live.17.b: "不过是一群短视之人罢了，继续。"

 bgbn_ramdom_live.18.name: "暗面一窥"
 bgbn_ramdom_live.18.desc: "数年前，在铁腕压制了初期的抗议浪潮后，帝国内凭借对信息的高压管制和“为了文明终极闪耀”的宏大叙事，天才迭代计划非但没有停止，反而在绝密状态下完成了技术验证，并开始将符合计划要求的新生代“预定”者向核心工业与科研星球进行秘密推广。短期内，帝国获得的成果看似十分辉煌：数个关键科技节点被提前突破，战舰设计出现了跨越式发展，一批幼年即展现出惊人计算或艺术天赋的“预定”者进入公众视野后被宣传为闪耀时代的新星。然而，时间总会让我们看见房间里的大象。首先是一处偏远星球的人口培养设施发生大规模排斥事故，超过40%的新生个体出现不可逆的精神解离，变成了毫无自我意识到空洞躯壳。接着，更可怕的消息从靠近核心星域的星球传来，报告里写着那里的城市区块出现了难以查询的各项产能直线下跌，就连自然环境也在迅速恶化。但实际上帝国高层都十分清楚一件事：这些事情都是因为天才迭代计划的“预定”者们聚集导致的。如今帝国必须将相关计划停下并彻底销毁，产能损失以及“预定”者们都昭示着理论上历史潮汐的暗面确实存在。悬空的那只脚还来得及收回。"
 bgbn_ramdom_live.18.a: "我们是谁的梦？"
