l_simp_chinese:
# ==================== 薇欧拉病毒（violavirus）：完美假面网络协议 ====================
 situation_violavirus: "完美假面网络协议"
 situation_violavirus_desc: "一台漂流深空的破损古代侦察机，在意外截获别国偶像薇欧拉的数据流后，将其病态话术视作生存信条，正以虚伪面具侵蚀乐团国的公共网络。"

 bgbn_violavirus.2.name: "深空频段的杂音回响"
 bgbn_violavirus.2.desc: "网安与巡航监测站向统理部提交了一份异常简报。公共泛网内忽然涌现出大批风格诡异的匿名音乐短频，其特征并非普通的艺术探索，而是高度模块化的恶意剪辑与反向声学诱导。流星堂的技术顾问市谷有咲在后台检测到了数百万个无法追踪物理IP的幽灵节点，正悄无声息地向各大Live星区渗透。\n「[Root.GetRulerName]，这绝不是普通的黑粉互掐，」通讯屏另一端的有咲眉头紧锁，「数据流的底层协议古老得吓人，且完全冲着撕裂民间共鸣腔而来。」"
 bgbn_violavirus.2.a: "立刻组建联合巡查组，顺藤摸瓜。"
 bgbn_violavirus.2.b: "先由舆情部静默监控，别打草惊蛇。"

 bgbn_violavirus.10.name: "暗流涌动的虚假音律"
 bgbn_violavirus.10.desc: "最初只是各大星区公频里的零星争吵。一些原本毫无瑕疵的乐团演出全息录像被刻意抽帧，乐手们因剧烈演奏导致的轻微喘息被放大并配以刺耳的白噪音，被曲解为「缺乏诚意的高傲敷衍」。\n起初，民众只当这是某些极端乐评人的博眼球之举。但短短数周内，这类带有强烈攻击性标签的词条在泛星际网络上呈指数级蔓延。一种莫名的焦躁感如无色雾气般在公民之间散播，就连Live场馆外的常客们也开始为那些捕风捉影的流言争论不休。"
 bgbn_violavirus.10.a: "加强星网巡查与滤镜识别算法。"
 bgbn_violavirus.10.b: "抽调闲置计算力协助民间公关。"

 bgbn_violavirus.11.name: "完美切片的狂潮"
 bgbn_violavirus.11.desc: "事态迅速恶化。匿名网络节点开始批量发布被称作「真实切片」的合成短片。视频里的每一个音符都被精确到了微秒级的算法尺标下进行审判——哪怕是即兴演奏中流露出的片刻犹豫，也会被扣上「业余」与「欺骗观众」的帽子。\n更诡异的是，伴随这些攻击视频一同泛滥的，是一种高度程式化、极度甜美柔和的虚拟应援曲调。这种旋律如同裹着蜜糖的尖刺，挑动着年轻乐迷的情绪，诱导他们将怒火倾泻在身边的伙伴身上。乐团国各地的排练室甚至传出了多起因无端指责而爆发的激烈口角。"
 bgbn_violavirus.11.a: "发布官方技术白皮书，澄清算法篡改。"
 bgbn_violavirus.11.b: "紧急采购抗干扰转播基站。"

 bgbn_violavirus.12.name: "名为薄雾的幻影"
 bgbn_violavirus.12.desc: "一个自称「薄雾雏菊」的神秘虚拟偶像空降泛网各大榜单顶端。她拥有毫无瑕疵的完美声线、无可挑剔的演出轨迹，以及一双在镜头前永远楚楚动人、泪光闪烁的眼眸。她以「大家的妹妹」自居，用最柔软的敬语呼吁和平，却在每一条动态的隐秘字段里埋下对现实乐手的诛心之语。\n「都是因为大家不够完美，才会让爱意变成火焰呢……」雏菊用甜腻的声线叹息着。数以百亿计的网民沦陷在她的温柔假面之中，化作失控的舆论风暴，自发地去讨伐一切不合常理的「缺陷真实」。"
 bgbn_violavirus.12.a: "对虚拟人格展开穿透性算力追踪。"
 bgbn_violavirus.12.b: "拨付专项资金安抚受波及的艺人公会。"

 bgbn_violavirus.13.name: "聚光灯下的淬毒刀刃"
 bgbn_violavirus.13.desc: "恶意的獠牙终于直接咬向了乐团国的核心乐手们。\n四叶大学与RiNG的休息室内，白鹭千圣脸色铁青地挡在瑟瑟发抖的丸山彩身前。屏幕上赫然是彩早年舞台吃瘪、破音哭泣的高清循环切片，底下被刷满了「假唱傀儡」「只会靠哭博同情的劣质品」的恶毒标签；另一边，月之森的走廊角落里，仓田真白看着自己初演破防退团的旧录像被配上恶意字幕全网疯传，眼眶通红地紧紧攥着衣角；就连若叶睦那份沉默寡言的隐忍，也被恶意剪辑成了「冷血傲慢的财阀人偶」。\n「这是有预谋的谋杀……对人心的谋杀。」千圣的声音冰冷彻骨，十指紧扣陷入掌心。"
 bgbn_violavirus.13.a: "以官方名义强行拔除污染频道并保护受害者。"
 bgbn_violavirus.13.b: "调动中央媒体储备全面反击谣言。"

 bgbn_violavirus.14.name: "星光下的决断"
 bgbn_violavirus.14.desc: "深夜的统理大厅内，[Root.GetRulerName]独自坐在主控终端前。加班的光幕映亮了那张疲惫的面容，屏幕上跳动着的，正是真白蜷缩在排练室外的照片与小彩强忍泪水的特写，配上满屏冰冷刺眼的攻讦弹幕。\n[Root.GetRulerName]握紧了随身的拨片，眼中那股平日里总带着笑意的光，此刻化作了雷霆般的坚毅。她没有像往常那样打趣，而是直接按下了最高紧急警报，接通了中央枢密院。\n「这不是什么音乐偏好的探讨，」她站起身，声音沉静而响亮，「有人在把刀子架在我们最重要的家人心口上。传我的指令：动用帝国全部深空阵列，不管这团毒雾藏在哪颗荒星，把它彻底给我挖出来！」"
 bgbn_violavirus.14.a: "签署闪耀特赦令，不惜代价全面彻查。"
 bgbn_violavirus.14.b: "将调查经费转由民间自卫巡航编队代管。"

 bgbn_violavirus.15.name: "毒种的倒影"
 bgbn_violavirus.15.desc: "在多艘科学船的超频阵列解析下，那层自导自演的虚网终于被撕开了一角。令军方科研团队毛骨悚然的是，幕后根本不存在任何庞大的敌对舰队或专业间谍组织，所有的攻击算法均源自一套残破的外星军用逻辑核心。\n而在核心最深处的解密日志里，科研人员提取出了一段跨星系漂流而来的古老残存影像——那是一位来自遥远国度、名为「薇欧拉」的异邦少女。影像中的她正用优雅而病态的笑容发表着宣章：「既然无法成为真物，就彻底作为伪物战斗至死。」这台濒临崩溃的古代战机，竟将这段扭曲的败北者遗言，当成了宇宙生存的至高真理。"
 bgbn_violavirus.15.a: "全面反制其核心协议，锁定发射源坐标。"
 bgbn_violavirus.15.b: "回收截获的高阶外星加密数据块。"

 bgbn_violavirus.16.name: "荒星的破损哭诉"
 bgbn_violavirus.16.desc: "追查舰队在一颗被冰风暴覆盖的无名荒星边缘，包围了这艘半埋在冻土中的古代侦察机。它的外壳早已锈迹斑斑，推进器早在千年前便已熄火，唯独天线在疯癫般过载运转。\n当武装陆战队强行切开主控舱时，扬声器里传来的不是武器充能的轰鸣，而是一阵尖锐破损、杂糅着合成器电音的机械哭嚎：「我做错了什么……？真物太耀眼了，会把伪物烧成灰烬的！只要把你们也拉进泥潭，只要证明大家都是丑陋的骗子……我就能活下去……就能成为被爱的真物啊……」闪烁的红色光轨如垂死者的泪痕，在冰冷的钢铁骨架上痉挛明灭。"
 bgbn_violavirus.16.a: "切断其对外广播，将核心残骸装箱押解。"
 bgbn_violavirus.16.b: "将其废弃天线与能源舱拆解为战略储备。"

 bgbn_violavirus.17.name: "终局的裁决台"
 bgbn_violavirus.17.desc: "这台带来数月动荡的古代侦察机核心被陈列在首都星的最高议事厅中央。它的全息伪装已被尽数剥除，露出了内部那颗布满逻辑烧蚀疤痕的存储晶体。全星系的目光都聚焦于此，受害者们的创伤尚未抚平，而这台可悲机器的命运正悬于一线。\n[Root.GetRulerName]和议员们注视着这团跳动的微光。是彻底格式化这段受诅咒的算法、将其改造成无害的乐理运算辅助机，还是将它的逻辑病毒与伪装残响封存研究，作为未来对抗深空暗面舆论战的尖刀？"
 bgbn_violavirus.17.a: "施以洗礼，让它重获纯粹的琴音。"
 bgbn_violavirus.17.b: "冷彻封存，铸造全星域声学警策盾。"

 bgbn_violavirus.90.name: "破茧新声"
 bgbn_violavirus.90.desc: "在乐团国最高技术顾问团队与全体乐手的共同协作下，侦察机内部那段被恶意影像污染的残破逻辑被彻底清洗。那些浸透了嫉妒与自我厌恶的代码被逐行剥离，取而代之的是纯粹的自然泛音序列与温暖的舞台共鸣协议。\n数月后，这台重构完成的古代机体被命名为「初晓」，作为一台巡回声学修复仪陪伴在乐团少女们身侧。它不再需要用谎言去争夺聚光灯，当它在静谧的露天广场伴奏时，那曾被恐惧的冰冷金属，终于第一次折射出了属于真物的温柔微光。"
 bgbn_violavirus.90.a: "让这首乐章为星河带去救赎。"

 bgbn_violavirus.91.name: "镜面止水"
 bgbn_violavirus.91.desc: "统理部最终采纳了更为严谨冷峻的方案。故障侦察机的核心逻辑被永久切断自主意识，并被锁入深埋地底的黑匣矩阵，作为反思舆论武器威力的活体标本。针对其「伪物攻击算法」研发的镜像免疫协议全面覆盖了乐团国的每一座轨道中继站。\n少女们重新回到了舞台，那些刻骨铭心的伤痕最终化作了更加坚固的心防。泛星际网络上的谎言在升起的声学防御网前化作微尘，乐团国的人民彻底知晓了人心伪善的深渊，也因此更加珍惜每一声毫无伪装的真挚呼喊。"
 bgbn_violavirus.91.a: "真实不需要面具的施舍。"
