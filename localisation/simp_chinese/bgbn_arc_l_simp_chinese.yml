 bgbn_ancrel.80.c: "点燃星光"
 bgbn_ancrel.80.c.DESC: "在所有评估结束后，大少女乐团国的科研团队对“远歌”的探索进行了全面的总结。这座非比寻常的巨构，它光洁如新的本体，无止境的迭代，以及那艘沉寂的旗舰，都在述说着“深红”那份纯粹、永恒的梦想：一个指向友善和希望的星际信标。我们决定控制这个遗迹，打断巨构自动程序进行进一步无意义的迭代工作并以“深红”座驾的最高级通讯协议下达指令，点亮这座等待了数十万年的信标。"





