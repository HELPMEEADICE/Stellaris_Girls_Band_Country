#先驱者
l_simp_chinese:
## 先驱者 深红 事件链##########
 bgbn_deepred_title: "深红"
 bgbn_deepred_desc: "初见“深红”的痕迹时，人们兴致颇失，对这已有数十万年历史巨型构筑的遗址不以为意。她的造物看不出任何实际的资源产出或者军事存在的用途，而只有一些神秘的巨型艺术品。然而很快，我们的科研团队便发现，这些“深红”的遗产体现出了难以想象的材料学和工程学上的造诣，而其浪漫到有些疯狂的设计目的也十分令人心动不已。初步的研究洞见表明，”深红“的全称是“极端环境适应型武装资产综合生产与控制系统中枢“，活跃于大约三十七万年前，显然是一个高度先进的蜂巢式机械智能文明，以类似山茶花和蔷薇的结合体作为标志性符号，尚不了解其历史起源。我们定位到了数个大型的“深红”造物的遗迹，这古老而神秘的智能所遗留下的先进造物令我们整个帝国的学者都魂牵梦萦。"

 bgbn_ancrel.6.name: "奇异流光"
 bgbn_ancrel.6.desc: "在这颗星球的表面充斥着无数条纵横的流光，即使是从宇宙中观察也分外明亮，让人联想到我们文明古老神话的乐器竖琴或是早已失传的箜篌。\n然而，虽然有着如此壮观的景观，我们却没能在星球表面发现明显的文明活动痕迹，这吸引了我们帝国不少天文学者的好奇。"
 bgbn_ancrel.6.a: "难道这是一个天然的天体钢琴？\n\n§R开启先驱者 深红事件链§!"
 ## 考古1 星流 ##
 site_starry_string: "星流"
 site_starry_string_intro: "在这颗星球的表面，存在着如同被精心编排的乐谱般纵横交错的流光，即使从数光秒外的宇宙中远眺，那成片的亮银色线条仍如碎钻般夺目。它们以精确的节律排列，有的平行舒展如琴弦，有的交错缠绕似琶音，并伴随着大气活动而微微震颤着。让人想起我们文明典籍中记载，古亚瑟王座下圆桌骑士崔斯坦的形如竖琴的百中弓菲尔诺特。\n然而，星球的陆地与海洋上看不到任何城市废墟或能量塔的痕迹，恒星的耀斑周期也十分稳定，太阳风的强度远不足以激发如此规模的电离辉光。更奇特的是，这些光流的亮度会随某种未知频率明暗交替，并在轨道上有规律的流动着，如同有人在幕后拨动无形的琴码，诉说着非自然的造物痕迹。"
 
 bgbn_ancrel.1.name: "琴音"
 bgbn_ancrel.1.desc: "当探测器穿透大气层，贴近最明亮的那条主光流时，我们终于捕获到了隐藏在光流之下的复杂的电磁脉冲——它们并非杂乱无章的辐射，而是像乐器的丝弦被拨动时的余振，每道流光的移动都会引发特定频率的波动，两条光流交汇时，频率便更会叠加出如和弦般的共振。高频区的光流如急奏的泛音，低频区的则似浑厚的基音，偶尔有几条光流突然变向，便会在旋律中撞出尖锐的颤音。这绝非随机的自然现象，更像是一场以星体为乐器，持续了上亿万年的演奏。我们的科学家只是简单的将其韵律中的一段以声乐的方式演奏出来，也谱出了堪称天籁的一曲乐音。"
 bgbn_ancrel.1.a: "奇妙的异星音乐！"

 bgbn_ancrel.2.name: "云之筝"
 bgbn_ancrel.2.desc: "深入分析光流的物理本质后，我们发现它们是在人工设计和调控下，由星球磁场与恒星风相互干涉的产物——就像竖琴的弦在气流中振动发光。每条光流的宽度对应着特定的磁场强度，从最细如发丝的高频光流，到宽如河流的低频光流，恰好构成了一套完整的“琴键”。它们的移动轨迹被精确的算法控制着：有的光流沿着固定的圆弧滑行，如同按弦的手指；有的则突然加速，在夜空中划出短促的亮线，像是急促的拨弦。这对星球电磁环境和大气环境运行如此精妙的干扰，所需要的计算能力让我们望尘莫及。在光流带最密集的地方，我们发现了一个被光学伪装系统隐藏的大规模建筑——建立在高山之巅，大气窗口良好，非常适合以较低的误差向天空发送复杂的电磁波信号。我们相信，这应该就是这遍布全球的流光的转发中枢。"
 bgbn_ancrel.2.a: "如果我们也能建一个。。"

 bgbn_ancrel.3.name: "安魂曲"
 bgbn_ancrel.3.desc: "在系统的分析了转发中枢发出的信号后，我们惊讶的发现，这看似完美的谐律中却隐藏着一组由调控信号缺失而产生的复杂的干扰流形，整个转发系统存在一处明显的信号未响应区域，而这是低级到几乎不可能由设计产生的错误——更像是由于系统尚未完工导致的。在分析了整套控制和转发系统的运行结构后，我们确定这出漏洞存在于南极区域。\n同时，我们还在转发中枢的中央发现了一个墓室，一个老者正静静的躺在墓室的中央，由类似冬眠系统的装置保持着老者遗体的完整。墓室中并未发现金银之类的陪葬品，而是怪异的将整个墓室区域修建的如同一处原子能时代文明的天文台。我们推测，这位老者可能是这个文明处于原子能时代的一名久负盛名的天文学者，但为何要将其安葬于此我们仍然没有结论。"
 bgbn_ancrel.3.a: "简直像是一场葬礼。。。"

 bgbn_ancrel.4.name: "缺位音符"
 bgbn_ancrel.4.desc: "在星球的南极高原，我们找到了系统的异常点。这里的磁场强度比其他区域高出三倍，本该形成一道相当明亮的光流带，此刻却只有几道断断续续的微光在闪烁。探测器在此处捕捉到了两组截然不同的控制信号：一组是与其他区域一致的“演奏指令”，规律而稳定；另一组则是杂乱的、类似逻辑冲突的脉冲，带有复杂的的频谱特征。更关键的是，我们在冰层下发现了未完工的磁场调节器——其设计参数显示，这里本应生成覆盖全球的闭合光流环，而现在，所有的调节装置都停留在启动前的最后一步。这种戛然而止的状态，像是演奏者在高潮处突然停手，只留下悬在半空的音符。也许只有在解读了整套系统的原始蓝图，我们才能明白这整个系统设计的深意。"
 bgbn_ancrel.4.a: "继续，我们想要知道真相"

 bgbn_ancrel.5.name: "绝弦"
 bgbn_ancrel.5.desc: "重新扫描了一遍转发中枢后，我们在老者的墓室之下发现了全套用于对神经中枢受到严重损伤都生物的脑电波进行扫描的设备，以及其对老者长期扫描得到的数据。整合了扫描数据及星体上空光流的结构后，真相终于在我们眼前展开：一个强大的文明——很可能是这个老者所在的文明或者其继承者——曾试图用这颗星球的磁场为“琴弦”，复现这位天文学家在神经系统严重损伤后，不断浮现于记忆中的星空。结合我们文明在原子能时代的观察数据，我们推测那些光流指的其实是大量低轨道卫星在天文设施中长期曝光留下的光影，而那些共振这是射电望远镜在受到大量低轨道卫星严重干扰后接受到的天光，整个系统就是一架以星球为共鸣箱，演奏着被严重干扰后的天文观察数据的竖琴。这套系统的创造者似乎一开始并不知道这位天文学家脑海中残留这些记忆的目的，但在工程即将完工时，它终于理解了记忆的真相：大量廉价的低轨道卫星摧毁了一切天文观测的大气通道，退役卫星的残骸覆盖了每一条进入星空的航线。那些流光不是美景，而是大气环境被严重破坏的恶兆；那些共振不是乐章，而是无法迈入星空的文明的葬礼。于是，它停在了最后一个音符前，留下这架未完成的琴，带着无法修正的遗憾离开。"
 bgbn_ancrel.5.a: "非常。。令人惋惜，非常"

 bgbn_ancrel.8.name: "初现，深红"
 bgbn_ancrel.8.desc: "我们解析了转发中枢的全部数据库，获取了这位老者所在的古老文明有关的一些信息：这些数据库的设计格式体现了惊人的统一性和全局性，有很高的概率并非是遵循传统文明的大型工程中的常例，即专家组共同协作完成，而是由一个拥有先进知识而思想高度集中的机械蜂巢智能直接生成的。我们决定将转发中枢中常见使用的色彩元素”深红“作为这个古老机械蜂巢智能的代号，并将其设施各处最常见的符号，一种类似蔷薇与山茶花的结合体的花朵状图案作为它的指代符号。"
 bgbn_ancrel.8.a: "很好，告知我们的科研船和星系考古学家，让我们试试寻找她的蛛丝马迹"
 ## 考古2 逆融
 bgbn_ancrel.9.name: "危险迫近"
 bgbn_ancrel.9.desc: "在科研船掠过这颗熔融星球时，我们意外的发现，在这个星球一个相当危险的轨道上还有一颗质量不低的卫星，并且还在稳定的持续降低轨道高度。这颗卫星上覆盖着大范围的人造结构，而对星球再次功率增强扫描同样也发现了不少异常之处，这激起了我们科学家的好奇心。"
 bgbn_ancrel.9.a: "这次又会是怎样的宇宙奇景呢？"

 site_reversal_to_magma: "逆融"
 site_reversal_to_magma_intro: "尽管处于环绕恒星的碳基生物移居带内，恒星也相当的稳定，这颗星球却不寻常的是一颗相当活跃的熔融星球。星体呈现出极其明亮的橙红色，大气中漂浮着金属光泽的微粒。地表没有稳定的大陆轮廓，巨大的熔岩裂隙以肉眼可见的速度扩张或闭合，板块运动频率远超已知的地质模型。轨道扫描显示，地核自转速度异常加快，磁场强度每小时都在发生阶跃式增长，地核温度也在稳步攀升。最异常的是其卫星——其表面覆盖着规则的六边形结构，能量读数接近理论极限的零点能反应特征，且正以缓慢但稳定的速度向主星坠落。\n一些工程学家推测，这可能是某个高阶文明正在进行的星球创生实验，预计百年内可完成基础改造。那颗带有六边形结构的卫星被暂定为能源供应站，其缓慢坠落的轨迹被解读为轨道校准阶段的正常现象，团队还注意到地表存在大范围规则阴影，推测是正在铺设的生态穹顶框架。然而，我们却没有在这颗恒星系内扫描到任何用于宣示某种主权的太空结构。"

 bgbn_ancrel.10.name: "地表初探"
 bgbn_ancrel.10.desc: "登陆仓登陆后获取的细节颠覆了初步判断。地表阴影并非建筑框架，而是黑色晶体形成的巨型网络，其扩张边界呈现数学精度的分形图案。采样显示，晶体周围 10 公里内不存在任何复杂有机物，与常规移居工程中 “培育生态圈” 的逻辑完全相悖。晶体分布密集区域的空中，频繁而高能的能量流动甚至产生了一道道交错的离子风暴。地表重稀土的富集程度也远超自然形成的可能性，且具有明显的经过先进技术加工利用的痕迹。同时，在晶体分布相对松散的地区则能发现大片的地层坍塌现象，有时甚至是连绵数万平方千米的地区极其不自然的塌陷到了数十千米深处。然而，科研船缺乏能穿透地表直接裸露的大片岩浆湖以及地表离子风暴的特种设备，需要等待设备申请得到批复才能进行进一步深层扫描。"
 bgbn_ancrel.10.a: "调动更大功率的扫描设备，同时派遣一些材料学家来辅助分析。"

 bgbn_ancrel.11.name: "浅表层探测"
 bgbn_ancrel.11.desc: "先进的材料分析实验室揭露了更多细节：黑色晶体的分子结构大部分由甲烷，硫磺，萘，氩，异丁烯，二甲苯组成，但还有29%的成分是具有显示出非自然的自组织特性的复杂亚原子粒子结构；其宏观结晶则在某种信号的诱导下形成了高度复杂的能量回路与激发结构，其中地表晶体样本中的绝大多数激发结构的作用都是在催化不同高复杂度分子结构的裂解；而在晶体侵蚀过的区域的深处，还存在大量极其深入的微管系统，传感器能感应到惊人的能量在沿着这些微管向地底深处移动。\n更令人惊讶的是，超高功率的地质雷达扫描在地下数十公里以下的深处发现了大规模的人工隧道网络，隧道壁布满烧灼痕迹，其分布具有在距离较远、没有明显分布规律的多点处紧密集中，其他地区分布松散的特点，隧道集中的区域还存在大量明显并非自然形成的空腔结构和可以被初步确认为是地下城市的复杂建筑群。显然，这里曾经很可能是一处星际文明的殖民地，而那些地表大片的塌陷则是支撑结构被破坏的空腔。\n我们几乎可以排除这里在进行的是某种大规模星球创生实验的可能性了，但现在有了更多的谜题浮现。"
 bgbn_ancrel.11.a: "这里到底发生过什么？"

 bgbn_ancrel.12.name: "旧日矿都"
 bgbn_ancrel.12.desc: "在发掘了其中一处较浅的地下建筑群后，我们确认了对这处前殖民地的其中一种猜想：这片星域曾经是一处高度发达文明的矿业中心，包括这颗星球在内有二十一颗星球在为曾经存在于此的星际文明提供大量的矿产，而这颗星球就是这篇矿产星域的行政和加工转运中心。在数百年的发掘过程中，这颗星球的每一处矿脉几乎都被开采殆尽，星球质量相较数百年前都下降了近百分之十七。随后，这颗星球开始没落，尴尬的星际地理位置，大量为了开采而迁移于此的人口，早已因落后和过度使用而抵不上运输成本的星体开矿与资源加工设备，以及因过度开采而逐渐不稳定的星球地质环境导致这颗星球几乎失去了所有被关注的价值和潜力。换而言之，这里是一处几近被抛弃的旧日矿都。\n然而，转机似乎发生在了数十万年前，这篇星域最后几颗矿产星球也即将枯竭的时候。城市中关于这段时间相关的记录十分混乱，但我们可以合理的推测这一定和星球上至今仍在进行的这项神秘工程有关。"
 bgbn_ancrel.12.a: "继续钻探，让我们来看看这项工程的真相。"

 bgbn_ancrel.13.name: "深层结构解析"
 bgbn_ancrel.13.desc: "钻探至地幔边界时，黑色晶体侵蚀区深处的微管系统的真相彻底暴露。这些由直径不到几纳米的通道是与卫星上结构同源的传导层，正以脉冲形式向地表泵送着某种具有超高能量密度的液态晶体。样本分析显示，管道中流动的液态晶体中还含有非常规的同位素，其形成年代比地表岩层晚了数万年，有的甚至是刚刚才形成——这意味着地质层实质上正在“逆向生长”。晶体的自复制粒子也在高温下活性倍增，它们不断的催化地底深处难以开采的重金属元素矿转变为新的黑色晶体，并再次汇入微管系统从地核深处被抽到星球表面。显然，这是某种星球地质自然演变的逆向化过程，而其所使用的相关技术高度令人惊叹。据研究团队推测，整个过程最终的结果将会重塑这颗千疮百孔的星球，使其回归数十亿年前的原始熔融形态并形成新的地质结构。\n我们最后将目光投向了这颗星球的卫星，那里是这项宏伟工程的指令与控制中心。"
 bgbn_ancrel.13.a: "何等的技术高度。。。"

 bgbn_ancrel.14.name: "重塑天堂"
 bgbn_ancrel.14.desc: "完成了对卫星数据库的破解后，我们终于能对已有的线索进行最终的归档。\n“逆融”——这是这个星球改造工程的代称，也是这些神秘的黑色晶体的名字。在那二十一颗矿业星球都被开采殆尽，人口尽数迁移之后，“熔融”的设计者接手了这片星域。它们设计了这套极其先进的地质演化逆向化系统并将其部署在了这二十一颗矿业星球上，通过逆向迭代星球的演化过程，加热地核，重设星球磁场，重新提取出已经在重力作用下深入星体的重稀土元素，人工投入富矿小行星等方式，将星球的结构完全重塑回原始星体的状态。随后，这颗半人造的卫星将会在精确计算后被抛下撞击到地表，永久性的改变这颗星球的公转与自转轨道，将其推移至重塑后最宜居的公转轨道上。撞击也会摧毁最后的作为前殖民地留下的痕迹并引爆所有的“逆融”晶体，放出其分子结构中储存的原始大气成分，成为新星球大气系统的一部分。在如此优渥的条件下，即使没有后续的人工干预，新的星球也有望在数亿年内就形成稳定的自然环境。它将是新一代智慧生命的天堂。\n根据复现的星图显示，这二十一颗星球已经几乎全部完成了“逆融”改造，正在形成崭新的世界。只有这个星球仍处于“逆融”改造的最终阶段。“逆融是”设计者的原始目的已经不得而知，它们也没有在星图上标注任何的宣誓主权的太空结构，连“逆融”工程本身都将在进行完成后彻底湮灭于星体撞击之中。我们在卫星的“逆融”工程自动控制中心后方发现了一处奇怪的墓室，里面没有任何的陪葬品，只有大量制作工艺处于原子能时代的地质结构模型，一些前ftl文明使用的原始地质勘探工具，以及一些由植物纤维加工成的古代地理学书刊。"
 bgbn_ancrel.14.a: "也许，这只是为了圆一位老者的梦"

 bgbn_ancrel.15.name: "赤星划过天空"
 bgbn_ancrel.15.desc: "我们再一次的从卫星基地上寻找到了这标志性的类似蔷薇和山茶花的图案，这表明这处高度具有艺术性的古代遗迹同样是古代智能“深红”的杰作。可惜，在我们刚刚完成数据库复制的几小时后，卫星基地就再一次进行变轨，加速撞向了地表。\n卫星的下部在与行星表面接触的瞬间崩裂，壳体在巨大的冲击中发生严重变形，大片的地层与卫星基地则直接粉碎，如散开的云般四溅出无数碎片。卫星的主体随后陷入了行星表层，推动着撞击部位的熔岩态物质向外推移，撞击边缘的固态物质被挤压，抬升，随后又坍塌，如同掀起了大地的波浪。半小时后，“逆融”晶体按预定的计划被引爆，一团极其明亮的火球于撞击点的中心升起。\n我们的科学团队严谨的记录下了发掘到的知识和撞击瞬间记录下来的全部数据。现在，我们已经有能力在别的星球上重现“逆融”，并引导再次完成创生的崭新星球快速转变为一个生命的天堂。"
 bgbn_ancrel.15.a: "让我们来接手这天堂的最终创作"
 ## 考古3 邀约
 bgbn_ancrel.16.name: "异常点"
 bgbn_ancrel.16.desc: "帝国边境的数个传感器最近传来了对同一串高能电磁信号脉冲的发现报告。信号脉冲的持续时间很短，甚至不满一个波长，可能只是意外泄漏，而初步的计算表明这信号源头的能量层级极高，甚至有可能达到与一颗真正的恒星相同的输出功率。这极大的引起了我们的好奇。"
 bgbn_ancrel.16.a: "我们需要研究一下"

 bgbn_ancrel.17.name: "发现神秘天体"
 bgbn_ancrel.17.desc: "在对一串短暂的高能电磁信号脉冲的逆向定位中，我们发现了这个奇特的星云。星云的长轴足有上千光年，法长轴的最大截面却仅有十万千米的直径，物质密度远超自然弥散云，无人探测器穿过星云的边缘的过程如同在碎镜中穿行。导航系统勉强计算出了一条通往星云中，接近那个脉冲源的超空间航道，而如果想要发现些什么，我们可能需要专业的科研船前去探索"
 bgbn_ancrel.17.a: "前进吧"

 bgbn_ancrel.18.name: "深入云中"
 bgbn_ancrel.18.desc: "遵循着不稳定的引力弦的导航，我们的探测器在数次进入超空间航行之后终于进入了星云的内部。短暂的扫描结果显示，星云内悬浮着无数崩解的高强度合金残块，高强度的电磁振荡和引力波动有周期的在星云内回荡。我们的科研船几乎需要满功率的运行偏导护盾格栅，偏导仪也时不时激活并扫出一条明亮的光路。在短暂的校准后，科研船锁定了那个信号脉冲的大致坐标并开始向目标行进。"
 bgbn_ancrel.18.a: "让我们揭开她的面纱"

 site_invitation: "邀约"
 site_invitation_intro: "我们的深空监测网最近捕捉到一串异常的高能电磁信号脉冲，脉冲持续时间极短，却包含数种罕见重元素的聚变特征线，能量层级几乎接近一颗真正的恒星的输出功率。追踪其源头，指向一片处于低优先级监控中的暗星云——那里本应只有稀薄的氢分子和尘埃，从未有过如此剧烈的能量活动。当探测器跃迁至星云边缘，传回的第一幅图像显示：星云核心区的尘埃正以某种规律向外抛散，形成螺旋状的物质流，像是被一只无形的手搅动过。"

 bgbn_ancrel.19.name: "星云环带"
 bgbn_ancrel.19.desc: "探测器穿透星云浓密的尘埃层，在距离脉冲源3光年处，发现了一个直径约200公里的环形结构。环带由银白色未知合金构成，表面布满蜂窝状的能量节点，每个节点都在发出微弱的蓝白色辉光。环带边缘有明显的热熔融痕迹，像是刚经历过剧烈的能量释放。扫描显示，环带内部存在强磁场约束的等离子体流，其运动轨迹与脉冲爆发时的能量矢量完全吻合。更奇特的是，环带材质中含有大量不稳定的超重同位素，半衰期仅数百年——这意味着它的建造时间绝不超过万年。"
 bgbn_ancrel.19.a: "规模惊人的能量装置，它的毁坏可能也在设计之中。"

 bgbn_ancrel.20.name: "环带解析"
 bgbn_ancrel.20.desc: "材料学家对环带碎片的分析揭示了其功能：这是一套巨型加速环。环带的蜂窝节点实为微型的真空零点能反应堆，通过定向释放能量形成环形加速电场；银白色合金具有超导体特性，能在百万摄氏度下保持零电阻，确保电场强度稳定。最关键的发现是环带内侧的轨迹校准器——它的精度达到了小数点下九位，远超已知任何文明的轨道控制技术。模拟显示，当环带启动时，输出的能量甚至超过一颗K型恒星在一秒内能释放的全部能量，随后环带自身会因材料应力崩解，化为星云的一部分。"
 bgbn_ancrel.20.a: "如此伟力，它的加速目标会是什么？"

 bgbn_ancrel.21.name: "控制中枢"
 bgbn_ancrel.21.desc: "在环带残骸的中心，探测器发现了一个篮球大小的球体——这是控制中枢。球体已经不再向外发出控制数据，但其数据库仍然开放并可供任何人读取，而在球体的表面刻着一个类似山茶花与蔷薇结合体的花纹。看来，这又是“深红”的杰作。解析晶体数据后发现，它不仅控制着单个环带的启动时机，还与数万个同类装置保持着同步。信号中包含一组基础坐标，指向千光年外的不同区域，每个坐标都对应着一个已崩解的环带遗迹。更惊人的是，中枢的运行时间已超过数十万年，却没有任何老化迹象。"
 bgbn_ancrel.21.a: "又是一个横跨星海的超级工程。"

 bgbn_ancrel.22.name: "轨迹追溯"
 bgbn_ancrel.22.desc: "以控制中枢的坐标为起点，科研船调用长程遥感装置扫描了周边千光年区域，结果令人震撼：在这片星区内，数万个环带遗迹沿着两条清晰的弧线分布，像是撒在宇宙中的路标。每条弧线都严格遵循从控制中枢中读取到的加速点位，起点相距1200光年，终点在同一片空域交汇。计算显示，这些环带的启动时间呈递进关系——从最外侧开始，每隔数十年便有一个环带启动，像是在“推动”某个物体向终点加速。两条弧线上的环带参数完全对称，连崩解后的物质抛射角度都分毫不差。"
 bgbn_ancrel.22.a: "两条对称的加速轨迹，她是想令什么发生撞击吗？"

 bgbn_ancrel.23.name: "隐藏星体"
 bgbn_ancrel.23.desc: "在第一条轨迹的终点区域，传感器一直被浓密的星云干扰，直到使用中微子探测才发现异常：一颗中子星正以惊人的速度穿越星云。这颗中子星的质量约为1.4倍太阳质量，体积仅相当于一座城市，但其速度已达到光速的1/10。更关键的是，它的运行轨迹与环带弧线完全重合，表面残留的加速痕迹显示，正是那些环带一次次为它“助推”。星云的密度分布也与中子星的运动轨迹匹配，显然是环带崩解后的物质被中子星的引力捕获形成的。"
 bgbn_ancrel.23.a: "原来如此！环带是为它加速的“引擎”。"

 bgbn_ancrel.24.name: "对称镜像"
 bgbn_ancrel.24.desc: "按照轨迹的对称性，科研船向1200光年外的另一区域进发，果然在那里发现了另一团正在扩张的星云。用同样的方法探测后，第二颗中子星浮出水面——它的质量、体积、带电量与第一颗完全一致，速度同样是光速的1/10，运行方向正对着第一颗中子星的终点。这颗中子星的轨迹上，同样分布着数万个环带遗迹，连加速频率都与第一颗完全同步。两颗中子星像是被精心挑选的“双胞胎”，沿着命运的轨迹相向而行。"
 bgbn_ancrel.24.a: "”深红“的目的已经呼之欲出——"

 bgbn_ancrel.25.name: "相撞计算"
 bgbn_ancrel.25.desc: "将两颗中子星的轨道参数输入超级计算机后，结果浮出水面：它们将在两片星云的中央，于一片空旷的星域相撞。届时，两者的相对速度将达到光速的1/5，碰撞产生的能量甚至远超超新星残骸Geminga预计爆发产生的能量，即使是在室女座超星系团的边缘也将清晰可见。计算还显示，相撞点并非随机选择——那里几乎没有任何大型天体，时空曲率异常稳定，能最大限度保留碰撞产生的物理信号。更精妙的是，两颗中子星的自转方向、磁场强度完全反向，相撞时会产生几乎无法模拟的复杂的量子效应。"
 bgbn_ancrel.25.a: "一次极其宏大的对撞实验。"

 bgbn_ancrel.26.name: "撞击先驱"
 bgbn_ancrel.26.desc: "科研船提前抵达计算中的相撞点，却发现这里并非一片空旷。在距离相撞点0.5光年处，漂浮着一个直径500公里的环形巨构——这是一个观察设施。巨构由数百万块反光板组成，能聚焦各种波段的辐射；中心是一个球形实验室，内置数千种探测设备，从伽马射线探测器到引力波天线一应俱全。巨构的能源核心仍在运行，显然是为即将到来的撞击准备的。不出所料，巨构的材料与之前发现的环带完全相同，各处也遍布着熟悉的标志。这又是“深红”的杰作。"
 bgbn_ancrel.26.a: "有人早就准备好了“观测台”，它在等这场碰撞。"

 bgbn_ancrel.27.name: "墓室之谜"
 bgbn_ancrel.27.desc: "在观察巨构的中心实验室下方，科研船发现了一个特殊舱室——这是一间墓室。舱室被设计成圆形，周围放置着大量前超光速文明应当了解的基础物理知识的文稿，从量子电动力学到弦理论方程应有尽有。中央的透明棺椁中，躺着一具衰老的人类形态的遗体，遗体旁放着一台老式脑电波记录仪，其中储存着数十万年的神经活动数据。记录仪旁还有一叠泛黄的手稿，上面画着一个原始的粒子加速器的未完成的草图。分析遗体得知，这个人类的神经系统严重受损。"
 bgbn_ancrel.27.a: "这位物理学家，与这场宇宙级对撞有关？"

 bgbn_ancrel.28.name: "”深红“的印记"
 bgbn_ancrel.28.desc: "解析脑电波数据和手稿后，真相逐渐清晰。数据中反复出现的画面显示：这位老年人类在梦境中反复回忆起那个图纸上的巨大的粒子加速器，并想象高能粒子在其中碰撞，无数物理理论在实验中被验证。而其中，最清晰的一个画面就是他曾见证过记忆中建成的最大一个粒子对撞机首次开机，两个中子束按预定轨道对撞的瞬间。显然，“深红”提取了这位物理学家的梦境，并挑选了两颗中子星，设计了这场横跨数十万年的实验。那些环带、轨迹、观察设施，都是它的手笔。"
 bgbn_ancrel.28.a: "一个AI，为了理解一位物理学家的梦，建造了整个宇宙都难以企及的超级对撞装置。"

 bgbn_ancrel.29.name: "终极对撞"
 bgbn_ancrel.29.desc: "50 年后，科研船与观察巨构一同等待着那一刻。当两颗中子星出现在视野中时，它们已变成两颗耀眼的光团，拖着由物质喷流形成的长尾。碰撞瞬间，时间仿佛静止——先是一道无法用语言描述的强光，紧接着，空间开始扭曲，引力波如海啸般冲击着探测器；两颗中子星的内核被剥离，裸露的中子物质在高温下碰撞，形成各种几乎只有在最极端的假想环境中才能出现的粒子；随后，核心区域的时空彻底坍缩，一个新的黑洞诞生了，它的事件视界清晰可见。观察设施记录下了所有数据：从夸克的行为到时空维度的波动，每一个细节都被精准捕捉。"
 bgbn_ancrel.29.a: "这是物理学的盛宴，是宇宙的启示。"

 bgbn_ancrel.30.name: "深红的守护"
 bgbn_ancrel.30.desc: "撞击结束后，我们的科研团队开始归纳接收到的海量珍贵数据并分析其应该如何用其来给我们帝国带来更大的增益，同时评估这在银河系内平均每百万年才发生一次，即使放到整个可观测宇宙中，发生频率也在约0.1次每亿立方光年每年的超低频率事件对周边宇宙环境的影响。\n不过至少，根据初步的观察结果显示，我们无需向帝国即周边盟友的殖民地提供可能的伽马射线暴预防报告了——在短暂的计算后我们发现，那些环带崩解形成的星云并非随机分布，而是恰好位于撞击点的两极方向，形成两道浓密的 “屏障”。当撞击产生的高能伽马射线暴向两极喷射时，星云吸收了 99% 的辐射和爆发的能量，使其无法抵达有文明存在的星域。而那位物理学家的墓室也在撞击的能量浪潮中逐渐解体，其原子融入了新诞生的黑洞，与这场他梦中的实验永远共存。"
 bgbn_ancrel.30.a: "这不仅是实验，也是一场温柔的馈赠。"

 
 ##考古4 微明
 bgbn_ancrel.31.name: "异常点：异常星体"
 bgbn_ancrel.31.desc: "在对附近星域星图的一次例行勘测和整理中，我们发现了一颗不寻常的天体。记录上这是一颗没有吸积盘，质量在十的三十一次方数量级的旋转带电黑洞，但当沿其自转轴方向的遥感哨站发出的超光速探测波在穿过这颗黑洞时，从特定方向穿过的部分信号波产生了突变性的衰减，仿佛在穿过这颗黑洞时凭空多穿过了近八光年的空间，而类似的现象从未在其他黑洞上被发现过。这极大的引发了学界的好奇。在调集了更高功率的深空遥感站进行扫描后，我们定位了一个连接向这个黑洞的微型超空间航道，勉强可以容纳科研船通过超空间航行前往那里。"
 bgbn_ancrel.31.a: "这颗黑洞在“眨眼”，像在隐藏什么"

 bgbn_ancrel.32.name: "发现星系"
 bgbn_ancrel.32.desc: "调取了附近的几处遥感站点和邻近文明的星图记录后，我们确信这颗黑洞以往从未被发现过类似的特性，而最近也没有发生什么值得关注的剧变——这颗黑洞甚至不存在一个庞大的吸积盘，各项性质理论上应该相当的稳定。\n不过，最近的整个银河倒是发生过一次相当剧烈的变化——由“深红”诱导的一次中子星对撞事件。尽管高能射线几乎被完全吸收，产生的引力波也扫过了整个河系的星体。我们正在评估这对这颗黑洞的可能影响。\n一处稳定超空间航道已经被确认，也许我们应该也派出科研船近距离的勘测一下。"
 bgbn_ancrel.32.a: "也许这又和”深红“脱离不了关系。。。"

 bgbn_ancrel.33.name: "发现遗迹"
 bgbn_ancrel.33.desc: "当我们的科研船接近后，我们还发现该黑洞的角动量和带电荷量都远超记录值，且仍然在以不可思议的速度增加。沿黑洞事件视界的赤道带还分布着一组环形建筑群，建筑主体是银白色的多面体结构，表面布满蔷薇与山茶花交织的纹路——又是“深红”的造物。"
 bgbn_ancrel.33.a: "这次又会是怎样的一个星河奇迹呢？"

 site_faint_starlight: "微明"
 site_faint_starlight_intro: "在记录中，这是一颗没有吸积盘，质量在十的三十一次方数量级的恒星质量黑洞，但当沿其自转轴方向的遥感哨站发出的超光速探测波在穿过这颗黑洞时，信号波仿佛凭空多穿过了近八百光年的距离。当我们的科研船接近后，我们还发现该黑洞的角动量和带电荷量都远超记录值，且仍然在以不可思议的速度增加。沿黑洞事件视界的赤道带还分布着一组环形建筑群，建筑主体是银白色的多面体结构，表面布满蔷薇与山茶花交织的纹路——又是“深红”的造物。"

 bgbn_ancrel.34.name: "齿轮"
 bgbn_ancrel.34.desc: "科研船抵近环带时，发现其内部是嵌套式的结构：它的主体材料是简并态中子物质与奇异夸克胶，由数个同心圆环结构组成，每个圆环都能检测到惊人的能量读数。当环带运行时，内层圆环会产生强电场，沿黑洞自转轴方向形成螺旋状的力线，像无形的齿轮推动黑洞奇环加速旋转。而同时，外围的环带又在产生强度惊人的力场在阻止环带被黑洞说吞没。换句话说，环带正在持续向黑洞注入角动量并同时极力保持着自身的稳定，不断的将这颗黑洞拉伸到某种非自然的状态。"
 bgbn_ancrel.34.a: "它在“拧动”黑洞，像在。。。解开一把星空的锁？"

 bgbn_ancrel.35.name: "钥匙"
 bgbn_ancrel.35.desc: "解析环带最近的运行日志时，我们发现在“邀约”遗迹中两颗中子星对撞的瞬间，环带的能量输出骤增12个数量级。同时，日志还显示：\n“检测到中子星合并事件级引力波，启动‘检修协议’——开始向临界值提升奇环转速，压缩内外视界间距，预计将在947个计时周期后可以与算核链接。”\n这解释了我们发现信号衰减的成因：当奇环转速突破一定值时，黑洞的内视界与外视界足够接近，以至于一部分的超光速探测波能从特定方向直接穿过，进入了这颗黑洞内视界以内的不稳定空间之中。这片区域即使是对我们的帝国来说，也仅能在数学和理论上推测存在且几乎无法利用。但显然，“深红”并不那么认为。\n我们开始通过环带试图连接这个“算核”，并同时从自转轴继续发射超光速遥感信号以解析其内部的空间。"
 bgbn_ancrel.35.a: "那场宇宙级的对撞，成了打开黑域的钥匙"

 bgbn_ancrel.36.name: "孤岛"
 bgbn_ancrel.36.desc: "在接入算核的次级数据库后，我们勉强窥见了其功能的一角：这是一个位于内视界之内，算力极强的装置，但其大部分的算力都被分配在了数百亿个分布于这颗黑洞奇环内侧的高度复杂到无法解释的装置上，我们只能简单的推测，这些装置的作用都是在产生某种未知的力场，以维持中央一片高度不连续空间的稳定或按特定目标运行。而遥感装置则在这片扭曲的空间周围检测到了与宇宙中的星界裂隙有关的读数。因此，一些科学家认为，算核实际上在人造一个球形的星界裂隙以将这片空间完全撕裂，甚至可能在高维度上依旧将其用裂隙隔离开。换句话说，算核在维持一片彻底被从宇宙上分离下来的宇宙空间的稳定，使其完全隔绝了内外的所有信息的映射关系。这将是一片物理规律完整，但将不会与外界产生控制之外的信息交换的独立空间。"
 bgbn_ancrel.36.a: "又是一个难以想象的技术奇迹，那她的目的会是什么？"

 bgbn_ancrel.37.name: "镜像星辰"
 bgbn_ancrel.37.desc: "通过解析算核的时序协议，我们得到了一组震撼的数据：这片空间内时间流速与外界的比值是“无穷”——既可以是空间内一瞬等于外界亿年，也可以是外界一日等于空间内永恒。我们分析其原因后发现，这是因为两者的时间线完全正交，不存在任何因果关联。这验证了我们关于这是一片被分离下来的独立空间的推测。而在算核的缓存区，我们找到了大量未被加密的“输出数据”：那是对一片星空的某一瞬间的记录，精度到了令人惊讶到了每一个基本粒子的位置和运动关系，仿佛某种星空的“镜像”。在调集超级计算机解析了几组“星空镜像”数据后，我们发现那是数百万个恒星系组成的星团在某一时刻的“星空镜像”。而算核通过控制的这些装置对空间进行干预，可以实现对这片星团的重设和微调。"
 bgbn_ancrel.37.a: "她在用时间本身当计算介质，用整个星团作为草稿描画"

 bgbn_ancrel.38.name: "瞬间的穷举"
 bgbn_ancrel.38.desc: "我们深入解析了部分的星团演化推算记录，从星云坍缩形成恒星，到行星诞生、生命出现，再到文明兴起与灭亡。随后我们发现，星团的演化并非中止于这片模拟星团热寂的时刻，而是结束于其中某一个在多次演化中都具备类似生理特征，有着相似发展历史的文明覆灭的瞬间——随后，这片空间就会被重置，一些初始条件将会被微调以干预这个文明的发展。换句话说，算核制造这个空间的目的很可能就是为了模拟这一片星团，找到这个文明发展的最优解。\n由于这片空间的独立时序特性，我们确认整个模拟系统在建成的第一秒就应该完成了所有可能的演化——我们很快就在缓存区发现了它，那是一个包含10^42种宇宙参数组合的集合，覆盖了数百万恒星团从诞生到热寂的所有演化路径。然而随后，自动执行程序启动了一次重启，将所有参数重置为初始状态。"
 bgbn_ancrel.38.a: "答案早在开始时就已出现，却被不断抹去"

 bgbn_ancrel.39.name: "模拟的边界"
 bgbn_ancrel.39.desc: "深入分析模拟数据后，我们发现每次重启时的一个关键差异：所有模拟宇宙的星光总数都比现实观测值偏差0.003%。这些“偏差的星光”对应着那些存在于现实，却因为距离过于遥远并未被纳入这数百万颗恒星中的星辰。算核的补偿机制就是会在每次重启时都会与黑洞上的环带通讯，获取此刻实时的星光数据并加入。然而， 就是这偏差的少许的星光，导致了每次的模拟计算得出的最优解都大相径庭——算核每次计算完毕后进行验证时都会发现这一点，随后将所有最优解都识别为错误并重启计算系统。如此往复。"
 bgbn_ancrel.39.a: "只差了一瞬的星空"

 bgbn_ancrel.40.name: "无法实现的求索"
 bgbn_ancrel.40.desc: "模拟记录中发现了一类特殊的“失败案例”：当文明发展出超远程星际航行能力时，总会试图突破预设的恒星团边界，寻找“缺失的光”。此时系统会触发紧急重启——在第7342次模拟中，一个文明甚至通过计算推导出了这套模拟系统的存在，他们的最后一条信息是：“感谢那束不属于模拟的光，让我们知道探索本身比答案更重要。”"
 bgbn_ancrel.40.a: "对未知的渴望，是无法模拟的变量"

 bgbn_ancrel.41.name: "边界的裂缝"
 bgbn_ancrel.41.desc: "当我们试图复制模拟数据保存以便未来研究时，探测器捕捉到一组域外数据：那是现实宇宙中，某个原始文明第一次向星空发射无线电信号的记录。这个信号抵达了黑洞外的环带结构中，随后被算核自动纳入下一次重启的初始参数。"
 bgbn_ancrel.41.a: "这个封闭系统初始便缺失的似乎并不只是星光"

 bgbn_ancrel.42.name: "领袖的执念"
 bgbn_ancrel.42.desc: "在环带的加密数据库中，我们找到了“深红”的原始设计参照：和前三个遗迹不大一样，这里存储的不是一个脑波扫描数据，而是由大量的影像和扫描件拼合起来的，一个前超光速文明中，其中一个政权的领袖的全部执政记录：那人几乎是这个文明才华和智识的巅峰，又掌握了至高的权力，却依旧被层层困囿于政治的围城之中。无尽的妥协、让步、粉饰与改良，填满了她遗憾的一生——尽管他在自己的文明中被冠以伟大之名。一串语音记录被反复分析：“我们希望有一条路，能一定走的下去，一定走得通的路。”\n通过对执政记录分析和生物特征识别，我们确认这位领袖与先前遗迹中发现的天文学家，地质学家与物理学家都归属于同一文明，也是“深红”系统原始数据库的搭建者。看来，这就是“深红”建设这套系统以开启对文明发展最优解计算的原因。"
 bgbn_ancrel.42.a: "然而，这计算却注定没有答案"

 bgbn_ancrel.43.name: "早已预料"
 bgbn_ancrel.43.desc: "我们破解了算核最后的数据库后发现，这个强大的模拟计算系统中并没有设计任何获得验证通过的最优解时的处置方式预设，甚至没有留下可供将大规模数据向深红回传的数据发送接口——换句话说，现在不断计算出缺失信息下局部最优解-验证失败-重启运算，仿佛进入了死循环一般的过程，实质上就是正常且唯一的运行方式。\n“深红”似乎早在设计这套系统之初就预料到了来自外界无法完全模拟的星空将会永远的卡住整套模拟系统的运行，然而，她依然毫不犹豫的建设了这个堪称奇迹的工程，并令它不断的试图模拟现实，读取来自星空全新的闪耀来重复进行模拟计算。"
 bgbn_ancrel.43.a: "重要的不是找到一条完美的路，是让求索本身成为永恒"

 bgbn_ancrel.44.name: "永恒的微光"
 bgbn_ancrel.44.desc: "在撤离前，我们最后一次观测这颗黑洞：外环带仍在以极高的速度驱动奇环旋转，内视界之内的算核在时空中闪烁，像一颗永不熄灭的心跳。那些早已完成的穷举结果被保存在算核的最深处，而重启程序仍在随前一个最优解被删除和新的星光数据的传来而反复运行，预计将能持续到永恒的下一刻。\n“深红”留下的，或许不只是一个寻找答案的机器，也是一个对自己和来者的期许——不必过多的顾虑我们的过往是否完美，只要眼前还能看到一点微弱的星光作为指引，就请继续去求索更美好的前途"
 bgbn_ancrel.44.a: "我就从零点起步，向最美好的前途~"

 bgbn_ancrel.45.name: "最美好的前途"
 bgbn_ancrel.45.desc: "我们在读取完算核中存储的海量社会学数据后踏上了归途。在等待超空间航道充能的时候，我们意外的发现，一串电磁波被封存在了这颗黑洞事件视界的边缘。随着黑洞的蒸发，这串电磁波也在不断的重新离开事件视界，向外传播着。我们解析了这首“深红”留下的电磁波。令人意外的，这是一首歌，大概是“深红”的创造者文明的音乐。\n有个声音来自最美好的远处，\n它在黎明时分含着晨露......"
 bgbn_ancrel.45.a: "绚丽灿烂的前景令人心驰神往，我像儿时一样雀跃欢呼。"

 ##考古5 幻彩
 bgbn_ancrel.46.name: "云星之影"
 bgbn_ancrel.46.desc: "在对“微明”遗迹的算核中提取的数据进行解析时，我们意外的发现，“深红”在建成这个强大的星空模拟演算装置后并没有立刻就将其投入到了它无穷无尽的模拟任务中，而是先被调用来进行了另一个模拟演化并在演化完成后清空了它的数据。一开始，科研团队认为这是某种试运行而将其忽略，但在意识到”深红“从一开始就预料到演算装置将不会真正得到答案后，这次试运行的意义就变得有些微妙了。\n我们设法复原了其中小部分的模拟数据并得到了一组坐标，星图记录中那里是一片尚未探明的小型星云。"
 bgbn_ancrel.46.a: "派出科研船，我们终于第一次主动抓到了“深红”的踪迹"

 bgbn_ancrel.47.name: "发现星系"
 bgbn_ancrel.47.desc: "边境扫描阵列捕捉到一片异常星云的光学特征。它的形态变化速率远超常规天体——在连续观测的72小时内，核心区的光雾结构从漩涡状变为放射状，又碎成无数光点，没有任何重复的模式。更奇特的是，它的引力场始终处于动态平衡，既不坍缩也不扩散，像一个被不断搅动却永远不会洒出的容器。"
 bgbn_ancrel.47.a: "真是奇妙"

 bgbn_ancrel.48.name: "异常点：星梦织锦"
 bgbn_ancrel.48.desc: "这片星云位于银河系旋臂的间隙处，直径约4.8光年，物质密度却远超宇宙空间的常态，是普通星际云的上万倍。它的演化也几乎违背了自然规律：内部没有恒星形成，却有无数发光结构在无规律地诞生、变形、消散；氢元素的光谱会突然分裂成彩色条纹，又在几秒后恢复正常；固态与气态物质能在同一空间共存，像被强行混合的颜料。\n探测器首次靠近时，一颗微流星意外闯入星云。不同于常规星云的摩擦燃烧，这颗流星在进入的瞬间就被分解成银色光粒，光粒随后融入附近的一团蓝光中，使原本呈球形的蓝光突然拉伸成螺旋状——外来的干扰似乎并不能影响到她变化的本质特征。"
 bgbn_ancrel.48.a: "去看看"

 site_dreamy_colors: "幻彩"
 site_dreamy_colors_intro: "这片星云位于银河系旋臂的间隙处，直径约4.8光年，物质密度却远超宇宙空间的常态，是普通星际云的上万倍。它的演化也几乎违背了自然规律：内部没有恒星形成，却有无数发光结构在无规律地诞生、变形、消散；氢元素的光谱会突然分裂成彩色条纹，又在几秒后恢复正常；固态与气态物质能在同一空间共存，像被强行混合的颜料。\n探测器首次靠近时，一颗微流星意外闯入星云。不同于常规星云的摩擦燃烧，这颗流星在进入的瞬间就被分解成银色光粒，光粒随后融入附近的一团蓝光中，使原本呈球形的蓝光突然拉伸成螺旋状——外来的干扰似乎并不能影响到她变化的本质特征。"

 bgbn_ancrel.49.name: "边界的呼吸"
 bgbn_ancrel.49.desc: "星云的边缘没有清晰的界限，而是一层厚度约0.3光年的过渡带。这里的光雾呈现出缓慢的“呼吸”状：时而向内收缩，将外围的星际尘埃卷入；时而向外扩张，吐出一些彩色的粒子流。这些粒子流与星际物质碰撞后，会凝结成新的发光点，再被下一次“呼吸”拉回星云。\n过渡带的物质状态极不稳定：前一秒还是气态的粒子，下一秒就会变成液态的金属球，落地（如果这里存在“地面“的话）又会蒸发成紫色雾气。但这种变化从未超出某种隐性的约束：无论如何变形，过渡带的总质量始终保持恒定，像一个在固定范围内随意伸缩的弹性袋。"
 bgbn_ancrel.49.a: "这道边界不像墙，更像一层会呼吸的皮肤"

 bgbn_ancrel.50.name: "流动的形"
 bgbn_ancrel.50.desc: "进入星云腹地，最先观测到的是一团金色流体。它没有固定的形态，此刻是铺开的扇形，下一刻就会蜷缩成茧，再突然炸开成无数细丝。细丝在空中飘荡时，会随机与其他发光体碰撞——撞上红色光团就会染上暖色，撞上蓝色光点就会变得透明，却从不会因此消散。\n追踪其中一根细丝发现，它的运动轨迹毫无规律：前半段沿着直线飞行，突然毫无征兆地折转90度，随后绕着一个不存在的中心旋转三圈，最终融入一团绿色光雾。但当另一根细丝以完全不同的轨迹运动时，最终也汇入了同一团绿色光雾，仿佛所有路径都藏着同一个终点。"
 bgbn_ancrel.50.a: "一群没有剧本的舞者，动作随意却总能踩中无形的节拍。"

 bgbn_ancrel.51.name: "固态的浪"
 bgbn_ancrel.51.desc: "在星云中部，有一片由固态氢构成的“浪涛”。它违反了所有力学法则：没有引力源，却保持着奔腾的姿态，浪尖冻结在即将破碎的瞬间；温度低至接近绝对零度，却能让接触它的金属块像冰块般融化；浪谷中还镶嵌着无数钻石般的晶体，晶体表面会浮现出流动的光斑，像在播放无声的动画。\n当一个靠近的探测器因为无法承受过于极端的环境而失去动力后的瞬间，“浪涛”突然掀起一道新的浪峰，将它包裹其中。探测器没有被压碎，反而被晶体吸收，随后浪谷中浮现出与探测器的形状相似的光斑——外来物质没有被排斥，反而成了“浪涛”新的“图案”。几小时后，光斑消失，“浪涛”却多了一种从未见过的波纹形态。"
 bgbn_ancrel.51.a: "这片“浪”不会被外来物打乱节奏，只会把干扰织进自己的花纹里。"

 bgbn_ancrel.52.name: "光的游戏"
 bgbn_ancrel.52.desc: "星云深处的发光体形态更加诡异。有一种呈多面体的白光，每转动一次就会增加一个面，从四面体变成十二面体，再变成无法命名的不规则形状，直到表面的棱线因密集而模糊成一团；另一种是黑色的“空洞”，自身不发光，却能让穿过它的光线改变颜色——红光变蓝，蓝光变绿，像一个随意调配色彩的漏斗。\n这些发光体的亮度变化与能量无关：一颗针尖大小的黄光，突然爆发出比超新星还强的光芒，照亮了周围 0.5 光年的区域，持续一分钟后又缩回原本的大小，没有任何能量释放的痕迹。更奇怪的是，当两束不同颜色的光交叉时，交叉点会诞生新的光体，颜色却与两者都无关，像凭空创造出的新色号。"
 bgbn_ancrel.52.a: "光在这里不是能量的载体，而是可以随意捏弄的橡皮泥。"

 bgbn_ancrel.53.name: "无轨的星"
 bgbn_ancrel.53.desc: "在一片光雾稀薄的区域，漂浮着无数“星点”。它们有的像跳动的火苗，有的像静止的水滴，有的甚至像旋转的陀螺。这些星点的移动完全没有规律：有的在原地颤动，有的突然窜出几光年远，有的绕着其他星点转圈却从不靠近。\n当探测器的引擎尾焰扫过一片星点时，原本散乱的它们突然排成一条蜿蜒的线，像被画笔划过的痕迹。尾焰消失后，这条线又逐渐散开，演化成新的星点集群。"
 bgbn_ancrel.53.a: "它们像一群被风吹动的蒲公英，风的方向决定了飞行的姿态，却改不了飘散的本质。"

 bgbn_ancrel.54.name: "温度的玩笑"
 bgbn_ancrel.54.desc: "星云中有一片区域同时存在极端温度。中心是一团冒着白汽的液态氧，温度高达15000K，却没有沸腾；外围包裹着一层固态的氦，温度低至接近3K，却在缓慢流动。两者的交界处没有热量交换，液态氧的白汽遇到固态氦，会凝结成金色的晶体，晶体落地又会融化成紫色的液体。交界处甚至能看到清晰的分界线，像一幅被强行拼接的画。\n当我们投放一个测温探头时，探头周围的液态氧突然变成了固态，而固态氦则变成了气态，形成一个冷热颠倒的小气泡。气泡存在几分钟后破裂，周围的物质又恢复原状，却多了一种新的温度交替模式，像一颗投入湖面的石子，激起的涟漪最终成了湖面新的一部分。"
 bgbn_ancrel.54.a: "冷热在这里失去了意义，只剩下“红色”和“白色”的视觉区分。"

 bgbn_ancrel.55.name: "无序的星点"
 bgbn_ancrel.55.desc: "连续观测数周，我们发现发光体的诞生与消散没有固定间隔。有时几小时内诞生数十个，有时几天都没有新变化；有的发光体存在不到一分钟就消散，有的则稳定存在数月。但无论生灭如何无序，星云的总质量始终不变。一个发光体消散时释放的物质，总会在别处聚集成新的形态，像一场永不停歇的物质循环。探测器的引力计显示，这些发光体的引力场也极不稳定，时而为正，时而为负——当引力为负时，它会排斥周围的物质，形成一个真空圈；当引力为正时，又会吸引物质，形成一个漩涡。这种正负引力的切换毫无规律，却从未对周围的发光体造成任何影响，仿佛它们处于不同的维度。\n有一次，一团持续了三周的蓝光突然消散，其物质没有像往常一样聚集成新发光体，而是被附近的红色光雾吸收。红色光雾随后膨胀成从未见过的扇形，边缘还带着蓝光的残影。"
 bgbn_ancrel.55.a: "也许，这只是一场有趣的拼图游戏"

 bgbn_ancrel.56.name: "几何的任性"
 bgbn_ancrel.56.desc: "在星云核心，存在着由纯能量构成的几何结构。它们不像自然形成的天体，更像是被随手画出来的图形：一个没有顶点的三角形，三条边在空中弯曲交汇，却始终不相交；一个不断膨胀的圆形，直径从几百米涨到几公里，边缘却始终保持光滑；还有一组互相穿透的立方体，每个面都穿过其他立方体的中心，却没有任何碰撞的痕迹。\n这些结构的稳定性违背常理：三角形的边在不断延长，却从未断裂；圆形的膨胀没有能量输入，却不会停止；立方体的穿透没有引发能量释放，反而让彼此的亮度同步变化。当探测器的引力场干扰到这些结构时，它们没有崩溃，而是扭曲成新的几何形状。三角形变成了螺旋，圆形变成了星形，立方体则演化成更复杂的多面体。"
 bgbn_ancrel.56.a: "它们像孩子笔下的涂鸦，线条想怎么画就怎么画，从不管“应该”是什么样子。"

 bgbn_ancrel.57.name: "声音的形状"
 bgbn_ancrel.57.desc: "探测器的声波传感器捕捉到一种奇特的振动，它不是来自物质碰撞，而是源于发光体的运动。当多个发光体靠近时，振动会形成特定的频率；当它们远离时，频率又会随机变化。但这种振动没有固定的旋律，更像是无数种声音的随机叠加。\n令人惊奇的是，当我们向星云播放一段人工合成的声波时，振动突然与声波同步，发光体也随之排列成与声波波形相似的图案。声波停止后，图案没有消失，反而逐渐演化成新的形态，振动也融合了人工声波的频率——外来的“声音”被它“听”进去，变成了自己的一部分。"
 bgbn_ancrel.57.a: "这次又是一个回声谷了！也许还带有某些原始乐器的影子？"

 bgbn_ancrel.58.name: "深红的印记"
 bgbn_ancrel.58.desc: "在仔细的扫描完这片星云数次后，我们终于只能遗憾的确定，这片星云中没有留下任何由“深红”留下的太空构筑。换句话说，这一片星云中的种种奇异完全来自于——也许很难接受——某种意义上的自然演化。\n“这哪儿自然啦！”\n就在我们刚刚完成了对星云最后一个位置的扫描数据记录并将其导入星图后，突然，星云中开始剧烈的发生变化，我们检测到了大量用我们科研船的探测波波形传来的有规律的回波——经过一阵混乱后我们确认，似乎只有当探测波完整的扫过这片星云的每一处后，产生的干扰才足以激发如此程度的回馈。科研团队开始紧张的解读其中的数据。"
 bgbn_ancrel.58.a: "这算什么，开了包装验完货确定没法退款了才出现的售后服务吗"

 bgbn_ancrel.59.name: "童趣"
 bgbn_ancrel.59.desc: "出乎意料的，回传的数据中并没有什么高深的宇宙原理，需要破获的运行日志，或者是什么上古老登留下来的兜圈子老话，而只是大量的平面绘画艺术品的扫描件——也许也很难算得上是艺术品，而只是一些充满童趣涂鸦罢了。涂鸦中的多数都是一片片荒诞，有悖常理的星空，即使有少部分勉强符合自然情况，也会在其他的地方产生某些可笑的常识性谬误，比如大片的粉色背景。\n然而，我们的科研团队却没法因为这些涂鸦而哑然失笑——因为此刻，他们就处于一片更加混乱，奇妙，充满原始和童真的幻想的星云之中。\n看来，已经可以猜到这片星云的设计蓝图源自于何处了。"
 bgbn_ancrel.59.a: "尚且不谙世事的孩童的作画。。。"

 bgbn_ancrel.60.name: "干扰的拥抱"
 bgbn_ancrel.60.desc: "为了验证星云对干扰的反应，我们进行了三次实验：第一次投放重金属碎片，它们被分解成银色光粒，使附近的光雾染上金属光泽；第二次释放强磁场，发光体的运动轨迹变得更加扭曲，却在几小时后形成新的平衡；第三次引爆微型核弹，爆炸能量没有扩散，反而被光雾吸收，凝结成一团前所未有的彩虹色光团。\n三次实验的结果完全不同，但有一个共同点：星云没有排斥任何干扰，反而将其转化为新的演化素材。就像西西弗斯数，无论中间的计算步骤如何混乱，最终总会回归到固定的结果。这里的“结果”不是某种固定形态，而是“永远在演化，永远保持自身”的性质。"
 bgbn_ancrel.60.a: "它像一个被设定好的万花筒，筒内的碎屑不知道自己会组成什么图案，但每一次转动，都是初始设计的必然。"

 bgbn_ancrel.61.name: "未尽的织锦"
 bgbn_ancrel.61.desc: "离开前，我们最后一次观测星云。原本的金色流体正在变成无数细小的光带，光带交织成一张巨大的网，网眼处不断诞生新的星点；固态的浪涛上浮现出与探测器轮廓相似的波纹；核心的几何结构则融合了三次实验的痕迹，呈现出前所未有的复杂形态。\n没有周期，没有重复，没有记忆，只有永不停歇的演化。那个孩子的幻想，被“深红“转化为初始的“第一杆”，随后的数十万年间，星云就在无数次“自我滚动”与“外来撞击”中，织出了这幅永远不会完成的星梦织锦。"
 bgbn_ancrel.61.a: "它存在的意义，或许就是“存在本身”——用无穷无尽的变化，去实现一个孩子对星空最自由的想象。"

 bgbn_ancrel.62.name: "探索的回响"
 bgbn_ancrel.62.desc: "返航途中，探测器记录下最后一幅图像：星云边缘的过渡带正将我们飞船的尾迹吸入，转化成一缕淡金色的光流，光流蜿蜒着汇入星云深处，与那里的光雾融为一体。这缕光流不会改变星云的本质，却会成为它未来演化的一部分，就像数十万年间所有闯入过这里的流星、辐射、尘埃一样。\n我们不知道那个孩子是谁，不知道她在“深红”的故乡看到了怎样的星空，才会画出那样的画。但我们知道:'深红'用数十万年的时间，为她保留了一片永远新鲜的、只属于她的星空。这里没有物理法则，没有逻辑规则，只有无穷无尽的、像梦一样的星辰。\n随着我们的科研船进入超空间航道，身后的星云迅速开始缩小，最终变成星图上一个模糊的光点。但我们都知道，在那里，此刻正有新的星辰在形成，它们或许是方形的，或许是液态的，或许会唱歌，或许会躲猫猫——就像那个孩子第一次拿起画笔时，脑海里闪过的、那些连名字都叫不出的光亮。"
 bgbn_ancrel.62.a: "它不解决任何问题，不验证任何理论，只是单纯地“存在”，为了一个孩子的幻想而存在。"

 ##考古6 远歌##
 bgbn_ancrel.63.name: "深空奇迹"
 bgbn_ancrel.63.desc: "在对已知“深红”遗迹附近的航迹进行长期逆向追踪，并成功破解“深红”使用的超光速通讯协议之后，我们位于遥远星空的深空遥感监听站，终于定位到了一片前所未有的超光速通讯密集区域。经过漫长的逆向监听和数据比对，一个庞大到令人费解的巨型结构浮现在我们的探测器视野中。它并非围绕任何自然恒星或行星建造，而是独立存在于一片虚无的星际空间中，其三维空间投影直径达数光年，足以囊括一个完整的恒星系。整个巨构的主体呈现出完美的球状对称，其表面光滑如镜，泛着合金特有的幽暗光泽，丝毫不见岁月侵蚀的痕迹。唯有在其外围的辅助设施环带，能观测到无数细如发丝的光缆和模块如藤蔓般在其表面和内部生长、蔓延，又被吞噬、重构，有些早期建设的设施因更新迭代而废弃，其残骸被缓慢推向星系边缘，提醒着我们它古老的年代，也暗示着内部仍在进行着某种永无止境的物理变化。"
 bgbn_ancrel.63.a: "快研究一下！"

 bgbn_ancrel.64.name: "藏于深空"
 bgbn_ancrel.64.desc: "在对已知“深红”遗迹附近的航迹进行长期逆向追踪，并成功破解“深红”使用的超光速通讯协议之后，我们位于遥远星空的深空遥感监听站，终于定位到了一片前所未有的超光速通讯密集区域。经过漫长的逆向监听和数据比对，一个庞大到令人费解的巨型结构浮现在我们的探测器视野中。它并非围绕任何自然恒星或行星建造，而是独立存在于一片虚无的星际空间中，其三维空间投影直径达数光年，足以囊括一个完整的恒星系。"
 bgbn_ancrel.64.a: "快派出科研船！"

 bgbn_ancrel.65.name: "虚空巨构"
 bgbn_ancrel.65.desc: "我们的科研船在巨构的外沿对它的整体结构进行了扫描。巨构的主体呈现出完美的球状对称，其表面光滑如镜，泛着合金特有的幽暗光泽，丝毫不见岁月侵蚀的痕迹。唯有在其外围的辅助设施环带，能观测到无数细如发丝的光缆和模块如藤蔓般在其表面和内部生长、蔓延，又被吞噬、重构，有些早期建设的设施因更新迭代而废弃，其残骸被缓慢推向星系边缘，提醒着我们它古老的年代，也暗示着内部仍在进行着某种永无止境的物理变化。"
 bgbn_ancrel.65.a: "也许这里仍在建设之中"

 site_faraway_singing: "远歌"
 site_faraway_singing_intro: "这是个横跨数光年的巨构。其三维空间投影直径达数光年，足以囊括一个完整的恒星系。整个巨构的主体呈现出完美的球状对称，其表面光滑如镜，泛着合金特有的幽暗光泽，丝毫不见岁月侵蚀的痕迹。它由三个核心部分构成：位于中心，形似传统戴森球的广播结构主体；围绕主体，由无数机械星球、环形星体和小行星带组成的外围辅助设施环带；以及一枚神秘地漂浮在主体附近的“深红”旗舰。令人惊异的是，除了少数可能被废弃的外围设施外，巨构的主体部分几乎光洁如新，显示出“深红”令人难以置信的材料学和自我维护技术。我们逆向破解的少量控制信号显示，整个系统的核心功能被高度优先化，对外来探测的回应极其简单机械，仿佛所有算力都集中于其内部的深层运作。"

 bgbn_ancrel.66.name: "初探“戴森球”"
 bgbn_ancrel.66.desc: "我们的先遣探测器首先抵达了巨构的中心区域——那个直径达数光秒的球状广播结构主体。它悬浮在虚无的星际空间中，表面由亿万片高度反射的超合金板拼接而成，每一片板件都泛着幽深的墨绿或钴蓝色光泽。我们最初的判断是，这是一个规模空前的戴森球，旨在从恒星收集能量，为某个不知名的构筑提供能源。然而，进一步的近距离扫描却发现，这些合金板的微观结构远比能量收集板复杂，它们内部交织着重叠的电路网络和波导管阵列，更像是某种信号发射装置的表层。"
 bgbn_ancrel.66.a: "并非戴森球"

 bgbn_ancrel.67.name: "环带的星球"
 bgbn_ancrel.67.desc: "随后，我们转向围绕广播结构主体运行的庞大外围辅助设施环带。它并非一个连续的结构，而是由数万颗大小不一的“行星”、“小行星”和“环形星体”按精确轨道组成。这些“星体”并非自然形成，而是完全由金属、光缆和机械装置构成。它们表面覆盖着密密麻麻的传感器阵列、计算核心和自动建造端口。这些“机械星球”彼此之间通过超光速光缆和引力波束进行数据交换，构成了一个规模惊人的分布式计算网络。我们初步推测，这是“深红”为了进行某个宇宙级别的复杂实验或数据存储而建造的矩阵，其目的可能超越我们对现有科学的认知。"
 bgbn_ancrel.67.a: "完全由机械铸就的“星环”"

 bgbn_ancrel.68.name: "遗世独立的星舰"
 bgbn_ancrel.68.desc: "在广播结构主体与外围环带之间的区域，一枚令人瞩目的星舰静静地漂浮着，并以高度贴近的轨道进行着环绕运行。这艘巨型星舰的设计风格与其他“深红”遗迹中发现的结构有些不融洽，舰体上却同样镌刻着蔷薇与山茶花纹路。其船体大部分是远超大少女乐团国的现有水平的精湛工艺，却也有一些原始的星舰设计结构。它的舰桥区域正散发出异常强大的能量波动，但没有对外任何通讯。探测器都显示，它的主要推进系统和大部分武器模块处于离线状态，但其核心计算单元却保持着惊人的高负荷运转。我们猜测，这艘星舰可能是“深红”的个人座驾，但它为何如此孤独地在此运行，又在计算着什么，仍是一个谜。"
 bgbn_ancrel.68.a: "仿佛骑士在此长久的守护。。。"

 bgbn_ancrel.69.name: "无声颂歌"
 bgbn_ancrel.69.desc: "随着对广播结构主体的更深入探测，我们终于解析出其真正的核心功能。它是一个由中央强放能结构和外层信号调频结构组成的超光速信号广播装置。中央核心并非用于采集能量，而是为了产生强大的、可控的电磁波、引力波、中微子流等多种物理载体，外层调频结构则负责将这些能量转化为超光速信号，并进行精密的定向调制，理论上能够向整个河系范围内的所有文明广播信息。这并非一个能量收集器，而是一个宇宙级的“麦克风”和“扬声器”系统。但所有的发射端口都被封闭，内部能量矩阵也处于待机状态，从未被激活。"
 bgbn_ancrel.69.a: "一艘旨在照亮宇宙的灯塔，却至今还被点亮"

 bgbn_ancrel.70.name: "迷失航向"
 bgbn_ancrel.70.desc: "我们在外围环带中部发现了一种奇特的机械星球集群。这些机械星球呈球状，内部搭载着超大孔径中微子望远镜阵列和高维空间传感器，旨在以最广谱的方式扫描整片星空，而还有部分正在建设的设计更为先进、更庞大的第二代设施，它们采用矩阵式排布，具备跨维度感测能力。而再根据我们截取的部分运行记录，我们推测，这些机械星球旨在以最广谱的方式探测所有可能存在的生命迹象：不同的文明可能栖息于行星表面、气态巨行星深层、星际尘埃云，甚至是中子星表面的量子态。而“深红”正不惜代价地追寻着“准确找到所有文明”的解决方案。"
 bgbn_ancrel.70.a: "“深红”在此搭建了一颗颗巨眼"

 bgbn_ancrel.71.name: "巴别困境"
 bgbn_ancrel.71.desc: "在环带的另一个区域，我们发现了一群类似巨型晶体阵列的辅助设施。这些晶体阵列能够同时生成并调制数十种物理载体信号，并尝试通过数万亿种组合进行测试。结合之前发现的机械星球探测群后，他们还能够实时分析周边星际介质并动态调整载体输出模式，犹如巨大的立体透镜群，不断变换着焦点。这让我们认识到，“深红”正在试图解决不同文明对世界的认识方式不同的挑战，即如何用最广泛可接受的物理载体传达信息，避免因媒介障碍而导致信息无法抵达。"
 bgbn_ancrel.71.a: "“深红”又试图找到所有语言的“通用词汇”，跨越广袤宇宙本身这堵高墙"

 bgbn_ancrel.72.name: "不期而遇的代价"
 bgbn_ancrel.72.desc: "我们探测到环带上有一片异常活跃的区域，这里分布着大量巨型模拟舱。在截取其中的数个进行实验后，我们确认，它们能够实时模拟文明接触信号后的各种可能发展路径，从技术飞跃到社会崩溃，也同时在计算着信号扫过星空时可能参数的种种干扰。这表明，“深红”正在应对信号本身可能带来的物理和文化上的极端影响，例如超光速广播可能干扰低质量星体的地磁场保护层，技术信息可能导致文明走向技术崇拜甚至宗教化。她正不遗余力地评估其善意的所有潜在“副作用”。"
 bgbn_ancrel.72.a: "即使是蝴蝶翅膀在大气中划过的微波，也将有可能引发一场风暴。。。"

 bgbn_ancrel.73.name: "永恒的庇护"
 bgbn_ancrel.73.desc: "在环带的边缘，我们发现了一种奇异的几何结构环绕着巨构主体，其似乎分布在各个维度的所有方向，甚至横跨了数个时间轴而存在。我们推测，它旨在利用高维空间特性保护巨构，允许巨构在受到攻击时迅速重构自身结构，在高维空间中进行局部偏移，甚至一定程度上的在复数时间轴上移动以规避某些超高能级的灾难。显然，如此庞大的宇宙级广播装置一旦建成并启动，其巨大的能量和信息辐射将使其成为整个银河系最显眼的目标。它不仅需要抵御自然灾害（如伽马射线暴、超新星爆发），更要防范智慧文明的恶意利用。"
 bgbn_ancrel.73.a: "这是为她打造的庇护，也是永恒的囚笼"

 bgbn_ancrel.74.name: "XP问题"
 bgbn_ancrel.74.desc: "在环带的更深层区域，我们发现了数个大型符号信息模拟演算特化的超级计算机网络极其对应的数据库。初步解析数据库显示，它包含了一个数以亿计模拟文明从诞生到发展的全部数据，旨在穷举所有可能的语义理解模式。这让我们认识到，“深红”也许还正在试图解决文明根据其生命形式、历史和文化对信号内容的理解能力不同的挑战，包括复杂的数学进制转换，以及避免信息被误读等问题。"
 bgbn_ancrel.74.a: "让我看看。。什么叫中子星上的离子生命体可能会将特定频率电磁波互相干涉的现象理解为某种奇怪的东西？"

 bgbn_ancrel.75.name: "未启的歌声"
 bgbn_ancrel.75.desc: "特别是当我们成功解析了广播结构主体内部的巨构运行日志后，综合以上所有的发现，我们最终揭示了巨构的建造初衷——她希望建造一个巨型结构，让任何仰望星空的文明接受到，告诉他们无论如何，星空中还有强大而友善的外星文明存在，激励他们不断向星空深处探索，并永远保持文明的体面。而上述五大类的辅助设施，实质上也都是为了解决种种在发出信号后可能造成的影响——文明的存在方式、认知媒介、信号影响、结构安全以及内容理解，任意环节出了差错，都有可能会碰伤了那些脆弱又充满希望的原始智慧生命们。于是，这个肩负着“深红”最大善意和遗憾的灯塔，至今未能发出一个字。\n我们并没有如其他遗迹一般找到一座墓室，但是。。。"
 bgbn_ancrel.75.a: "那艘星舰突兀又理所当然的在轨道上漂浮着"

 bgbn_ancrel.76.name: "沉寂的灯塔"
 bgbn_ancrel.76.desc: "我们再次回到了那艘遗世独立的“深红”旗舰。通过更深度的数据挖掘，我们发现它在数十万年前就将核心AI的大部分模块代码剥离，核心计算模块也为超大型并行运算进行了适配，并将其绝大部分融入了这个巨构的运行系统，成为了巨构内部那异常强大、逻辑复杂且永不停歇的评估与改进程序。现在，这艘旗舰的舰桥区域已只剩下能量输入/输出端口，其智能程序仅保留了最基础的对外交互模块。星舰本身的设计似乎也没有进行过升级，甚至留有不少原始的大气层内结构设计方案的残留痕迹。如果没有那些力大飞砖一般的驱动装置，理论上这艘星舰甚至不应该有机会进入广袤的深空中。\n在解析了最核心的数据库后，我们确认，这艘星舰中的大半船壳结构来自”深红“的母文明正在建造中的第一艘超光速星舰。那艘船并没有得到建成就已经毁于战火。"
 bgbn_ancrel.76.a: "她的母文明最终也没能看到遥远星空，这是她永恒的遗憾。"

 bgbn_ancrel.77.name: "永不停歇的迭代"
 bgbn_ancrel.77.desc: "经过对这个巨构的中枢ai的运行记录进行研究显示，这个巨构并非一直停滞不前。我们发现，在巨构内部那计算程序运行的数十万年里，每当它通过模拟演算解决一个问题并建设出相应辅助设施后，它都会即刻提高评估标准。这意味着旧有的辅助设施，即使功能完善，只要达不到新的更高精度和广度要求，就会被毫不留情地废弃，并替换为更先进的迭代版本。这个外围的辅助设施环带，便是在这种无休止的“自我提升”中不断演化，不断吐故纳新。目前，它仍然在持续不断地进行评估、模拟、设计和建设，几乎占据了这片星域内的全部空间。驱动其运行的逻辑核心就是对这个梦想近乎偏执的坚持。"
 bgbn_ancrel.77.a: "即使穷尽数十万载光阴，它的求索依然无止无尽。"

 bgbn_ancrel.78.name: "传承的抉择：大少女乐团国的回应"
 bgbn_ancrel.78.desc: "在所有评估结束后，大少女乐团国的科研团队对巨构的探索报告进行了全面分析。我们深感“深红”梦想的纯粹与伟大，以及其为之付出的巨大牺牲。尽管“信标”面临的五大难题依旧是巨大的挑战，但我们认为，“深红”留下的这份“善意”所体现的极致效率和自我完善能力，不应该永远沉寂。经过最高长老院和科学家委员会的讨论，大少女乐团国决定：我们将接管这个巨构。 通过我们文明的力量，调动河系级资源，接入我们的计算网络，与巨构中那令人惊叹的自动程序协同合作，共同解决遗留的难题。我们将接过这面未被点亮万年的信标，帮助“深红”完成她最后，也最宏伟的遗憾。"
 bgbn_ancrel.78.a: "她的梦想，将由我们来延续，穿透遥远的星空。"

 bgbn_ancrel.79.name: "遗失的信使"
 bgbn_ancrel.79.desc: "在所有评估结束后，大少女乐团国的科研团队对“远歌”的探索进行了全面的总结。这座非比寻常的巨构，它光洁如新的本体，无止境的迭代，以及那艘沉寂的旗舰，都在述说着“深红”那份纯粹、永恒的梦想：一个指向友善和希望的星际信标。我们决定接管这个遗迹，并投入我们文明所有力量，与巨构中那令人惊叹的自动程序协同工作，以期有朝一日，能够真正点亮这座等待了数十万年的信标，将那份饱含着善意与体面的讯息，传递给整个银河系。从此刻起，在浩瀚的星海中，一个古老AI的纯粹梦想，将由一个新的文明共同肩负。"
 bgbn_ancrel.79.a: "一个古老AI的梦想，将在新的时代被再次点燃。"

 bgbn_ancrel.80.name: "臻至完美"
 bgbn_ancrel.80.desc: "在所有评估结束后，大少女乐团国的科研团队对“远歌”的探索进行了全面的总结。这座非比寻常的巨构，它光洁如新的本体，无止境的迭代，以及那艘沉寂的旗舰，都在述说着“深红”那份纯粹、永恒的梦想：一个指向友善和希望的星际信标。我们决定接管这个遗迹，并投入我们文明所有力量，与巨构中那令人惊叹的自动程序协同工作，以期有朝一日，能够真正点亮这座等待了数十万年的信标，将那份饱含着善意与体面的讯息，传递给整个银河系。从此刻起，在浩瀚的星海中，一个古老AI的纯粹梦想，将由一个新的文明共同肩负。"
 bgbn_ancrel.80.a: "一个古老AI的梦想，将在新的时代被再次点燃。"
