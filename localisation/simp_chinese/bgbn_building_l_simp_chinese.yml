l_simp_chinese:
 building_114514: "谐振地质干涉装置"
 building_114514_desc: "通过以较高功率的在地表产生通过将一些少女乐队的歌曲改编而来的振动样式，我们可以引发特殊的地质活动并借此来进行稀有矿物采集，地热能发掘等操作。只是不知道为什么，对于同一个设备操作者的同一个设备，同一首歌只能挖掘一次。"
 building_1919810: "蜃楼转播台"
 building_1919810_desc: "通过使用微型无人飞行器来改变高层大气结构，我们可以将live现场的影像和音乐沿着大气电离层传播，并如海市蜃楼般投影到极远之处，这极大的提高了live时的传播范围和民众的幸福程度。道德伦理委员会利用光学原理对投影进行了处理，使得从特定角度观察投影影像时，将只能观察到一片圣光。"
 building_350234: "live克希尔仪式广场"
 building_350234_desc: "相比起传统的受出场顺序，观众类型等影响较大的演唱会形式对邦，新建的live克希尔仪式广场通过将对邦双方放置于两个可移动的直线型对抗式平台，并将观众的支持化为平台的驱动力的方式，极大的提高了对邦的激烈程度和趣味性，而对邦的失败者也将在歌回结束后以连带着平台被推到水中作为惩罚。请对邦的参与者自行携带泳装。"
 job_1114514: "乐理谐振矿工"