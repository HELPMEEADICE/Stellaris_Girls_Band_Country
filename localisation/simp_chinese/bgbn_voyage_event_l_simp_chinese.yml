l_simp_chinese:

 bgbn_voyage.1.name: "试航行——1"
 bgbn_voyage.1.desc: "“企业”号的舰桥内，原本模拟自然光的照明系统已经切换成了深邃的幽蓝色调。这种灯光能让驾驶员的瞳孔保持微扩状态，以便更敏锐地捕捉全息投影中那些细微的数据变动。朝日六花坐在驾驶位上，她的手指轻轻摩挲着控制台边缘的感应区。窗外，地球与月球已经彻底缩减成了一蓝一灰两颗明亮的星点，星舰正平稳地滑向太阳系的深处。“系统报告，跨越火星公转轨道。”lock的声音在寂静的舰桥内回荡，被记录系统忠实地捕获，“一切正常，我甚至感觉不到自己在移动。这种感觉……真的很不可思议。”由于结构完整性力场的作用，即便外界的引擎正爆发出足以撕裂行星地壳的推力，lock杯子里的温水甚至没有荡起一丝涟漪。这种完全隔绝了加速度差的技术，让宇宙航行变成了一场静谧的独白。舷窗左侧，火星那橘红色的地表正飞速掠过。在联合政府的开发工程下，这颗红色的星球已经隐约可见点点绿意和如蛛网般的人造运河，但在这一万公里的高空看去，她依旧透着一股原始的、铁锈般的肃杀感。lock看着那颗星球，心中升起一种难以言喻的敬畏。人类曾在这些土地上争夺生存空间，而现在，她正代表着这些生命，去窥探更遥远的荒野。六花调整了圆框眼镜，然后闭上了眼睛。深吸了一口气后，她睁开眼，眼神变得锐利起来."
 bgbn_voyage.1.a: "let's rocking out————"
 
 bgbn_voyage.2.name: "试航行——2"
 bgbn_voyage.2.desc: "火星与木星之间，是一片跨度巨大的坟场。数以亿计的小行星和尘埃在这里无序地旋转，它们是太阳系诞生初期遗留下的边角料，每一块碎石都可能携带者毁灭性的动能。lock并没有选择绕路，而是直接下令星舰切入物质最为稠密的区域。“调整能量源输出流向，上调向偏导护盾与极化船壳分配的比例。”随着指令下达，企业号银灰色的外壳表面泛起了一层细密的、如同金属鳞片般的微光。无数微观粒子在电磁场的作用下迅速调整位置，将整艘星舰转化成了一个具备自愈能力的有机整体。“检测到前方大量高能粒子与微陨石。”仪表盘发出了柔和的报警音。lock握紧了操纵杆。在亚光速状态下，撞击是不可避免的。当第一块约莫拳头大小的陨石以极高的相对速度撞向星舰左舷时，预想中的剧烈爆炸并未发生。在撞击发生的微秒瞬间，偏导护盾迅速响应。lock透过侧窗看去，只见飞船周围的空间似乎产生了一道肉眼可见的折射纹路，像是一块被丢入水中的石头搅乱了平静的湖面。那块陨石在触碰到扭曲表层的刹那，由于引力场的剧烈偏转，顺着一道圆滑的弧线被直接拨向了远方，只在太空中留下了一道因为真空零点能释放而产生的淡蓝色辉光。“就像是在水里游泳一样……”lock低声赞叹。星舰像一柄轻盈的柳叶刀，在不断旋转的巨石间穿行。偶尔有避无可避的微小尘埃恰好没能触发偏导护盾，但在撞击到极化船壳的瞬间，那些微观充能粒子便会迅速汇聚，在火花熄灭前就完成了材料的分子级重组。这种穿梭持续了整整两个小时。当企业号终于冲出这片混乱的区域，重新进入空旷的深空时，六花调出了外部监视器。星舰的外壳依旧光滑如新，没有任何划痕。"
 bgbn_voyage.2.a: "塔台，航行数据已上传。正在设定航向至木星轨道。"
 
 bgbn_voyage.3.name: "试航行——3"
 bgbn_voyage.3.desc: "木星。太阳系的重力之王。当这颗巨大的气态巨行星占据了整个观测窗时，lock感受到了一种生理上的压迫感。那绚烂而扭曲的大气条纹，像是一条条盘踞在宇宙中的毒蛇，而那个永恒旋转的大红斑，则如同一只巨大、冷漠的眼睛，俯瞰着所有靠近它的尘埃。“好大……”lock咽了一口唾沫。木星周围那狂暴的电磁辐射和强大的磁场，是任何电子设备的噩梦。“向结构稳定性力场输出微调，正在抵消木星引力。”lock此行的任务之一，就包括测试曲速引擎在强引力场干扰下的稳定性，收集更多的数据。如果要在未来的航行中跨越那些复杂的恒星系，这是必须跨过的门槛。“距离木星高层大气三万公里。坐标校准，矢量方向：木星北极延长线。”lock的手指悬在启动键上。她能感觉到，木星那恐怖的磁力线正在穿透船体，与曲速引擎的内部场域发生着某种危险的博弈。“三、二、一，曲速驱动，启动！”舰桥内的灯光瞬间闪烁了一下。窗外的景色在一瞬间被拉伸成了迷幻的彩色流光，木星那庞大的身影在不到一秒钟的时间内便被拉扯到了极远的地方。“矢量偏差……在接受范围内。”lock迅速记录数据。刚才那一瞬间，曲速引擎轻易的撕开了木星引力的束缚。这种感觉就像是在狂暴的飓风中稳稳地推出了一局棋。她反复进行了数次短距离跃迁。每一次，企业号都像是一道闪电，在木星的卫星群之间穿梭。不过，即使是最为庞大的木卫二，在广袤的太空中也只能匆匆一瞥。"
 bgbn_voyage.3.a: "这里是企业号，木星近场测试完毕。引擎稳定。我正转向黄道面外缘，目标：太阳系边界。"
 
 bgbn_voyage.4.name: "试航行——4"
 bgbn_voyage.4.desc: "随着距离太阳越来越远，阳光变得稀薄且无力。曾经辉煌的太阳，现在看起来只是一颗特别明亮的星点。企业号驶向了冥王星以外的区域——奥尔特云。这里是绝对的宁静。没有磁场的轰鸣，没有陨石的喧嚣。周围是跨度数光年的寂静虚空，只有偶尔漂浮的、如同幽灵般的冰块。这里的温度接近绝对零度，是物质能够想象的最低点。lock静静地坐在座椅上。在这片寂静中，她似乎能听到自己心跳的声音。这是她第一次感受到宇宙的“冷”。这种冷不仅仅是温度，而是一种缺乏生命、缺乏运动、缺乏光明的虚无感。lock操纵着星舰，在这些冰冷的彗星核群中缓缓行驶。企业号的外壳在微弱的星光下反射着冷峻的光芒。通过内层力场的均匀传递，即便外界是足以冻结原子热运动的极寒，星舰内部依然温暖如春。她取出了一张RAS合影的电子照片。照片里，CHU²正一脸不耐烦地抱着猫，LAYER和MASKING在笑，PAREO在对着镜头做鬼脸，而她自己，则是笑得有些局促，眼镜上还带着雾气。“大家……我在这里。”lock轻声说着。这种孤独感是每一位星际探索者必须支付的代价。但只要回头看向导航图上那个闪烁着的、代表地球的蓝色坐标，心中的恐惧便会烟消云散。"
 bgbn_voyage.4.a: "我并不孤单……大家都在等我回去。"
 
 bgbn_voyage.5.name: "试航行——5"
 bgbn_voyage.5.desc: "“数据记录完成。”lock重新戴好眼镜，双手稳稳地放在控制台上。“塔台，我是企业号。太阳系内所有实验项目已完成，申请回航。”“收到，Lock。坐标已确认，欢迎回家。”通讯频道里传来了熟悉的声音，虽然跨越了漫长的距离而显得有些延迟，但那份亲切感却丝毫不减。lock最后看了一眼舷窗外那片无尽的黑暗。在这两天的试航中，她已经和这艘银色的星舰建立了某种奇妙的默契。企业号不再仅仅是一堆精密零件的组合，而成了她在星海中赖以生存的铠甲，是她意志的延伸。“曲速引擎满功率预热。目标：D月拉格朗日L2点。”随着推力杆推到底，企业号在奥尔特云冰冷的背景中瞬间消失。数小时后。月球那熟悉的环形山再次出现在视野中。当企业号轻盈地滑入多维空间研究所的引导激光轨道时，lock感觉到整艘船都在微微地震动，仿佛在长途跋涉后发出的舒坦叹息。舱门缓缓开启。月球泊位那略显干燥、带着机油味的空气涌了进来。lock走下廊桥，看到了一群穿着白大褂、正欢呼雀跃的科研人员。在那群人后方，RAS的四位同伴正站在那里。“我回来了。”lock摘下眼镜，揉了揉有些红肿的眼睛，露出了一个灿烂的笑容。“Excellent work，Lock。”CHU²走上前，虽然语气依旧高傲，但眼神中却藏不住那份赞许，“但这只是开始。“"
 bgbn_voyage.5.a: "真正的星辰大海，我们才刚刚推开大门。"
 
 bgbn_voyage.6.name: "启航"
 bgbn_voyage.6.desc: "月球的重力只有地球的六分之一，这种轻盈感在步入多维空间研究所的发射区时尤为明显。朝日六花停下了脚步，深吸了一口气，冰冷且充满过滤后的循环空气钻入肺部，稍微冷却了她因紧张而加速的心跳。她推了推鼻梁上的圆框眼镜，镜片后那双总是显得有些局促的眼睛，在这一刻倒映着前方那巨大的、银灰色的钢铁巨兽。它静静地悬浮在半敞开式的月球泊位中，在人造日光灯的照射下，流线型的船身泛着一种温润如玉的光泽。那是“企业”号，大少女乐团国第一艘搭载了曲速驱动引擎的实验星舰。它不再拥有旧时代那种臃肿的储液罐或狰狞的助推器，取而代之的是优雅的分形几何线条和向后延伸的、如同羽翼一般的引擎短舱。“lock，你的心率已经超过每分钟一百二十次了。这可不像是一个即将创造历史的研究员该有的状态。”耳机里传来的声音略显张扬，带着一种不容置疑的自信。那是CHU²。此刻，她应该正坐在月球基地顶端的指挥塔台里，翘着腿，面前悬浮着数十个复杂的实时数据窗口。“对……对不起，CHU²大人。我只是……还是觉得像做梦一样。”lock的声音小得像是自言自语。“这不是梦，Lock。”另一个温柔且稳重的声音接了进来，那是LAYER，“为了这一天，你在这个机库里熬了多少个夜晚，我们都看在眼里。你是最了解她的人，所以，你也是最适合带她飞向星空的人。”“加油哦！lock-sama！PAREO会在控制台为你提供最完美的后勤支持的！Kirakira！”“别在那啰啰嗦嗦的了，”最后插入的是MASKING爽朗的笑声，“lock，按照你平时的感觉去开就行了。等回航的时候，我们去基地的下层区吃那家最好吃的拉面，我下厨。”lock不自觉地露出了微笑。她摸了摸挂在胸前的吉他拨片吊坠，内心的局促被一种厚实的依靠感所取代。她迈开脚步，走上了那道跨越真空的透明廊桥。自动舱门在身后无声地滑过。星舰内部的装潢极为简洁，乳白色的内衬材料和内嵌式的幽蓝色冷光灯条勾勒出了走廊的轮廓。这里没有任何多余的噪音，只有船壳内微观粒子流动的低频共振，听起来像是一个沉睡中的巨人正在平稳地呼吸。她步入舰桥。作为一艘高度自动化的实验型星舰，舰桥的设计并不宽敞，中央的驾驶位被弧形的控制面板包裹。lock坐进那张根据她的体型定制的座椅，安全束缚带自动调整到了最舒适的位置。“朝日六花，登舰完毕。系统接管中。”她一边轻声吟唱般地确认着指令，一边在全息屏幕上飞速划动。随着她的指尖跳动，整艘星舰开始苏醒。“结构完整性力场，自检通过。“这种由奇异粒子编织而成的无形网格，此刻正完美地将全舰数千个部件锁死在一个恒定的物理应力点上。这意味着无论待会星舰如何加速，lock在座舱内都不会感受到哪怕一丁点的晃动。“偏导护盾发生器，预热完毕。极化船壳自修复阵列，上线。”透过正前方巨大的观测窗，lock看到了那片纯粹的黑暗。月球的环形山在下方呈现出荒凉的银白色。“企业号，这里是塔台。”CHU²的声音变得严肃起来，“港口锁定已解除。坐标参数已载入。你是这个新时代的先驱，Lock。现在，让世界看看那股从未被人类触碰过的速度吧。”“明白。企业号，启航。”lock按下了主引擎的启动键。没有任何预想中的震动。在结构完整性力场的维持下，星舰在亚光速引擎的推动下平滑地向前滑行。lock感觉到整艘船像是融入了真空。观测窗外的月球背景开始缓慢后退，随后是巨大的电磁加速管道。企业号划出月球阴影的瞬间，太阳的光芒如潮水般涌入舰桥。lock眯起眼睛，看着远方那颗蔚蓝色的行星——地球。在太空中看去，她依旧如此美丽且脆弱，那些纵横交错的云层和深邃的海水，是所有梦想的起点。“已经越过拉格朗日L1点。”lock盯着仪表，指尖微微有些出汗，“CHU²大人，一切正常。我要开始第一次矢量放大了。”“去做吧。星空在等着你。”lock深吸一口气，推动了中央的推进杆。那一瞬间，窗外的星图发生了一种难以言喻的形变。原本静止不动的光点，在真空零点能完成交换的刹那，被某种无形的力量拉扯成了发光的细线。星舰并没有在三维空间内真正加速，而是周围的空间本身被扭曲并向后推去。这种速度超越了任何感官的认知。在lock的眼中，月球与地球几乎是在数秒内便缩成了一个微小的点，随后消失在黑暗中。她独自一人，驾驭着这艘承载着无数人心血的银色孤舟，向着那片更深、更冷、也更广阔的荒野驶去。“这就是……曲速航行。”她喃喃自语，镜片后的眼神变得前所未有的明亮，“好美……”星舰在漆黑的宇宙中留下了一道几乎无法察觉的蓝白色波纹，那是空间恢复平稳时的余韵。启航任务圆满完成，而对于朝日六花来说，真正的旅程，才刚刚在指尖的微颤中拉开帷幕。"
 bgbn_voyage.6.a: "Excellent. 真正的演出现在才开始。"
 
 bgbn_voyage.7.name: "第一次航行——1"
 bgbn_voyage.7.desc: "月球背面的多维空间研究所港口，那巨大的半球形穹顶在朝日六花的视野中逐渐缩小，最终化作荒凉月表上的一粒微尘。“企业”号的舰桥内，循环装置吹出的冷气带着一丝淡淡的臭氧味。lock坐在略显宽大的驾驶椅上，安全带紧贴着她的科研制服。她推了推圆框眼镜，指尖在触控面板上轻点，确认着最后几项处于休眠状态的传感器。“已经越过海王星轨道。背景辐射读数正常。太阳系引力场强度……跌落至万分之一个基准单位。”lock的声音在宽敞的舰桥内显得有些空灵。现在的她，已经离开了人类文明赖以生存了数万年的温床。窗外的太阳不再是一个温暖的金盘，而变成了一颗在繁星中显得格外耀眼的白色恒星，冷漠且遥远。“Lock，准备好了吗？”通讯频道里，CHU²的声音跨越了百亿公里的真空，带着由于光速限制而产生的数小时延迟。这声音实际上是之前发送的自动回复包，但在如此深邃的孤寂中，这依然是lock唯一的精神寄托。“嗯……准备好了。”lock对着空无一人的舰桥点了点头，尽管她知道对方要等很久才能听到。她缓缓推动了主推进杆。这一次，她将要把矢量放大倍率推向一个全新的数量级。窗外的景象变了。这种变化是一种渐进式的、令人眩晕的扭曲。星点开始拉长，原本静止不动的宇宙像是被一双无形的大手抓住并向两侧撕裂。在星舰的前方，光线因为极度的多普勒效应而开始向光谱的蓝色一端剧烈偏移，形成了一个幽蓝色的漩涡；而回首后方，那些熟悉的星座则陷入了暗红色的泥淖，像是在这片黑暗中无声地挣扎。“企业”号像是一柄切开现实的银色柳叶刀，一头扎入了那条名为未来的前路。"
 bgbn_voyage.7.a: "这是人类历史上从未有过的远方。"

 bgbn_voyage.8.name: "第一次航行——2"
 bgbn_voyage.8.desc: "这是人类历史上从未有过的远方。一千四百光年。如果以旧时代的化学火箭计算，那是需要用整个文明的兴衰作为计量单位才能跨越的鸿沟。即便是在拥有超空间航道的今天，这样一段缺乏天然航道维护的原始空域，也是足以让最勇敢的航海家止步的死亡地带。但在曲速驱动的作用下，时空本身变成了可以被缩放的尺码。lock静静地注视着窗外。在那里，星光已经不再是光点，而变成了某种五彩斑斓、不断脉动的流体。她并不觉得自己在飞，反而觉得整座宇宙像是一块巨大的画布，正在她脚下被疯狂地卷起并向后抛去。“这就是……真正的远征啊。”她取出一本随身携带的实体笔记本，用圆珠笔在上面记录着。尽管自动记录仪会捕捉每一毫秒的参数，但她更愿意用这种古老的方式去记录那些属于人的感受。“曲速状态第三十二小时。距离地球已经有几百光年了。在这里，连kirakira的灵能谐振都变得微弱起来。我能听到的，只有引擎室传来的那种极低频率的共振。”lock抬头看了看舷窗。在那些拉伸的光影中，她偶尔能看到一些巨大的暗影掠过，那可能是某处尚未被发现的流浪行星，或者是大面积的冷尘埃云。在如此之高的相对矢量下，这些暗影只是瞬间的惊鸿一瞥，让这片虚空显得更加宏大且不可名状。偏导护盾偶尔会撞击到一些星际介质，产生出微弱的、如同北极光一般的幽蓝色闪光。由于结构完整性力场的存在，六花甚至感受不到撞击的震颤，这种极端的平稳反而让她产生了一种身处虚无的错觉。她有时会感到恐惧，恐惧如果引擎在这一刻停止，她将会被困在这片跨越了千亿公里、没有任何地标的深渊中，直到化为宇宙的尘埃。“但大家都在等着我呢。”"
 bgbn_voyage.8.a: "她扶了下眼镜，将注意力集中在那些不断跳动的数据流上。"

 bgbn_voyage.9.name: "第一次航行——3"
 bgbn_voyage.9.desc: "“抵达预定航行时长，引力环境符合计算预期，确认抵达目标位点。”lock的声音带着一丝掩饰不住的兴奋。在经历了漫长的、几乎剥夺了时间感的航行后，探测器终于感应到了那颗庞大天体的脉动。时空涟漪逐渐平息，企业号缓缓从曲速状态中滑出。那一瞬间，一种前所未有的宏大景象占据了六花的整个视野。前方，一颗巨大的、散发着橙金色光芒的恒星正静静地悬浮在漆黑的帷幕中。它是一颗典型的K型恒星，质量只有太阳的四分之三左右，但它散发出的光芒却比太阳更加柔和、更加深沉。她的橙色矮星的光辉像是一场永不落幕的黄昏。光线打在企业号银灰色的船壳上，折射出一种如同熔融黄金般的质感。“太美了……就像是落日被定格在这一刻。”lock引导着星舰进入了该星系的引力同步轨道。这颗恒星已经平稳地燃烧了数十亿年，它的光谱像是一首节奏缓慢且悠长的古老乐章。由于它的寿命极长，这类恒星系往往是生命演化的天然温床。随着探测器的推进，目标星系内的行星逐一显现。其中一颗行星吸引了六花的注意。那是一颗位于宜居带边缘的岩质行星，它的大气层中富含散射橙色光线的微粒。“企业”号开启了亚光速引擎，平滑地靠近那颗未命名的世界。当星舰切入行星的高层轨道时，lock屏住了呼吸。下方的行星地表呈现出一种深沉的紫褐色，而那层厚厚的大气在橙色恒星的映照下，呈现出一种绚烂的、如同熟透了的柿子般的色泽。“在这种阳光下生活的话……也许万物的边框都会是深蓝色的？”lock喃喃自语。她操纵着飞船进行了一次低轨道飞掠。极化船壳在进入稀薄大气边缘时，与气体分子摩擦产生了轻微的火花，但在结构稳定性力场的加持下，整艘星舰依旧稳如磐石。观测仪传回了地表的数据：由于恒星光谱的偏移，这里的植被如果存在，为了吸收更多的能量，可能会呈现出近乎黑色的深紫色。虽然还没发现文明的痕迹，但这种原始且静谧的美感，让lock受到了宇宙生命的无限可能性。"
 bgbn_voyage.9.a: "记录完毕。"
 
 bgbn_voyage.10.name: "第一次航行——4"
 bgbn_voyage.10.desc: "在采集完最后一组关于恒星风与磁场交互的读数后，六花坐在驾驶位上，最后一次看了一眼那轮橙色的太阳。“该回家了。”她启动了返航程序。跨越一千四百光年的航程，在归途时似乎变得不再那么漫长。并不是因为速度变快了，而是因为心境变了。当企业号重新切入月球同步轨道时，D球那蓝白相间的身影再次填满了六花的眼眶。泊位的引导激光温柔地锁定了星舰。舱门开启，lock拖着略显疲惫但依旧坚定的步伐走下长廊。码头上，熟悉的机油味和嘈杂的人声再次包围了她。“欢迎回来，Lock。”CHU²抱着胳膊站在最高处，嘴角带着一抹不易察觉的微笑。“任务圆满完成。”lock对着同伴们挥了挥手。这一次，她带回来的不仅仅是冷冰冰的数据，还有一份关于橙色黄昏的记忆。那一千四百光年的距离，不再是不可逾越的鸿沟，而是人类文明向着星辰大海迈出的、又一串坚实的足印。"
 bgbn_voyage.10.a: "欢迎回家，Lock。"

 bgbn_voyage.11.name: "第二次航行——1"
 bgbn_voyage.11.desc: "“企业”号的舰桥内，安静得只能听到维生系统循环空气时发出的细微嘶嘶声。朝日六花坐在驾驶席上，指尖在亮蓝色的全息界面上轻盈地跳动。这是比之前几次航行的距离加起来还要遥远的一次跃迁。九千光年，这个尺度已经远远超越了人类对远方的感性认知，在星图上，太阳系早已缩减成了一个无法被肉眼捕捉的坐标点。“曲速矢量功率输出平稳。”lock低声自语。舷窗外，原本漆黑、死寂的星空正在发生异变。随着星舰切入目标区域，那种纯粹的黑暗被某种弥散的色泽所取代。起初只是淡淡的、若有若无的暗红色薄雾，但随着曲速驱动层级的逐渐下降，企业号开始脱离高倍率放大状态，眼前的景象瞬间炸裂开来。那是离太阳系九千光年外的一处横跨数十光年的巨大弥散星云，也是银河系内新生恒星一个集中孕育之处。lock下意识地屏住了呼吸。即使曾在教科书和虚拟影像中见过，她也从未如此切身的感受到这股无比狂暴而美丽的生命力。深红色的氢离子云像是在宇宙中泼洒的岩浆，在原恒星散发的强烈紫外线照射下，翻腾出如同极光般的幽绿与粉紫。它们矗立在发光的星云深处，仿佛是某种远古巨神遗留下的指痕。“这里就是……星星诞生的地方。”lock喃喃道，她的手稳稳地握住主操纵杆。企业号像是一枚银色的飞梭，无声地切入了这片翻涌的彩色深海。"
 bgbn_voyage.11.a: "/// Warning: High-density cosmic environment. ///"

 bgbn_voyage.12.name: "第二次航行——2"
 bgbn_voyage.12.desc: "在之前的航行中，真空是主旋律，宇宙是空旷而寂静的。但在这一刻，宇宙变成了稠密的。星云中充斥着极高密度的气体分子和细小的硅酸盐尘埃，它们在企业号超高速的亚光速航行下，变成了一场永无止境的动能暴雨。“偏导护盾压力上升中。”lock注视着传感器反馈的图表。在星舰前方几公里处，护盾发生器正制造出一层高度聚焦的空间扭曲。从窗外看去，景象惊心动魄。无数肉眼不可见的尘埃颗粒在撞击到这层隐形屏障的瞬间，由于空间的极度弯曲而被强制偏转。在高频的撞击中，偏导护盾的表层因能量激荡而显现出明亮的电光，像是一面巨大的、半透明的蓝白圆盾，在星云那暗红色的背景中强行开辟出一条通路。偶然间，一些动能较小的流星级碎片未能触发偏导场的焦点，直接撞击在船体上。“咚——”一声沉闷的回响通过船体结构传导至舰桥，虽然微弱，却让lock的心脏紧缩了一下。但很快，仪表显示一切正常。极化船壳在撞击发生的毫秒级时间内便做出了反应。那些由微观充能粒子组成的复合材料在撞击点瞬间硬化，随后利用舰船能源核心提供的充能迅速重新排列分子结构，将撞击留下的微小凹痕瞬间抹平。“这就是我们的企业号。”lock轻声鼓励着自己，也像是给这艘星舰打气，“这种程度的洪流，还无法阻止我们。”她调高了偏导护盾频率范围，星舰的外壳在迷幻的彩色星云中泛起了一层冷峻的、紫色的静电辉光。在这片混乱而狂暴的原始星际介质中，银色的企业号优雅地穿梭着，不留一丝伤痕"
 bgbn_voyage.12.a: "让我们再深入一点"

 bgbn_voyage.13.name: "第二次航行——3"
 bgbn_voyage.13.desc: "随着航线深入星云核心，真正的挑战出现了。这里不再只有尘埃和气体，还布满了正处于引力坍缩阶段的恒星胚胎。每一个发光的物质团背后，都可能隐藏着一个质量惊人的引力井。这些引力井相互交织、重叠，在星云内部形成了一个看不见、却足以撕碎任何误入者的引力迷宫。“结构完整性力场功率提升。全舰应力均衡锁定。”lock感觉到操纵杆传来了沉重的阻力。这不是真正的摩擦阻力，而是这片混乱而疯狂的空域给航行者带来的心理压迫感。企业号此刻正驶过两个巨大的原恒星物质盘之间。左侧是一个正在疯狂旋转的暗色尘埃环，右侧则是已经开始发出高热蓝光的初生恒星。两侧不对称的巨大引力拉扯着星舰，试图将它的龙骨折断。但在星舰内部，结构完整性力场发挥了它的奇迹。这种由奇异粒子编织的无形力场，将那些试图撕裂船体的应力几乎瞬间传递到了全舰的每一个原子上。lock坐在驾驶舱里，虽然能看到窗外星空轨迹因为引力透镜效应而变得弯曲、诡异，但她的身体却感受不到任何颠簸。这种感觉极为奇异，仿佛她正坐在一个绝对安全的方舟上，观察着外界那足以毁灭世界的惊涛骇浪。“检测到前方存在的高能喷流。”一道从原恒星极区喷射而出的、横跨数光年的等离子射流横在了航线上。那是一道由纯粹的电离气体构成的明亮长鞭，温度高得足以蒸发岩石行星。lock没有退缩。她操纵着星舰精准地捕捉到了喷流中引力最薄弱的一个极小间隙。企业号的曲速引擎发出一阵低沉的嗡鸣，星舰在曲速矢量的微小脉冲下，以一种近乎瞬移的灵巧姿态，切过了那道致命的光带。在那一瞬间，强烈的辐射让护盾闪烁出近乎致盲的白光，随后，星舰的舷窗迅速变暗，几近将外界完全遮蔽。当光学遮蔽水平重新回归到初始值时，那道暴戾的喷流已被甩在身后，远方是星云更深处那宁静而神圣的蓝绿色氧气云团。lock靠在椅背上，长长地舒了一口气。汗水浸透了她鬓角的发丝，但圆框眼镜后的目光中却依然闪烁着自信。在这场跨越九千光年的探险中，她不仅仅是在测试一艘飞船，更是在重塑自己作为星际航行者的灵魂。“企业号，准备脱离星云区域。”随着星舰调整姿态，亚光速引擎在稀薄的介质中划出两道幽蓝色的轨迹。当企业号最终冲出那层浓重的红色云霭，重新回到清冷、开阔的真空时，lock忍不住转动主观测窗的方向，回望了一眼。在那一刻，九千光年外的弥散星云完整地呈现在她眼前。它在背景星空的映衬下，像是一朵盛开在永恒黑暗中的、由火与光构成的巨大玫瑰。它是如此的壮丽、如此的混乱，却又蕴含着文明诞生前最原始的秩序。“再见了，星星的故乡。”"
 bgbn_voyage.13.a: "lock轻声说道，按下了回航的曲速指令。"

 bgbn_voyage.14.name: "第二次航行——4"
 bgbn_voyage.14.desc: "归航的路途总是显得比出发时快。当企业号再次划过月球那熟悉的、荒凉的环形山时，那里的景象与九千光年外的灿烂星云形成了鲜明的对比。但对于lock来说，这灰色的月球表面才是最让她感到安心的锚点。星舰稳稳地停靠在多维空间研究所的月球泊位。当对接舱口开启的嗡鸣声响起时，lock摘下了伴随她数十天的驾驶头盔，揉了揉略显凌乱的蓝色短发。“Lock！欢迎回来！”舱门刚一开启，MASKING那豪爽的声音便在长廊里回荡。随后是PAREO充满元气的欢呼声。lock走下廊桥，看到CHU²正靠在不远处的栏杆上，虽然一如既往地维持着那副傲气的姿态，但脸上也是掩饰不住的笑容。她回头看向泊位中那艘银色的星舰，它在人造灯光下静静地闪烁。那里记录了九千光年外的火与尘，也将承载着大少女乐团国更远的梦想，向着那片尚未被丈量的银河深处再次出发。"
 bgbn_voyage.14.a: "我们还会走的更远。"

 bgbn_voyage.15.name: "第三次航行——1"
 bgbn_voyage.15.desc: "月球背面的多维空间研究所港口，这一次显得格外肃静。“企业”号静静地泊在磁力锁扣中，工程机器人正忙碌地检查着外层的极化船壳。虽然九千光年的星云之旅并未在船身上留下任何实质性的损伤，但接下来的任务，其规模将让此前所有的航行都显得像是孩童在自家后院的嬉戏。七万六千光年。这个数字意味着朝日六花将要横跨整个银河系的主体，从太阳系所在的偏远旋臂出发，掠过繁华的星系核心边缘，一直抵达银河系物质盘的最外缘。在那里，恒星的密度将跌落至极点，背景将不再是繁星点点，而是无尽的、通往其他星系的深邃虚空。“Lock，补给物资已经确认，主要是供你消耗的标准化营养液和循环系统的滤芯。”CHU²的声音通过舰桥的扬声器传来，这一次少了几分张扬，多了几分作为科研负责人的沉稳。“这不仅是距离的挑战，更是时间的挑战。虽然曲速航行能极大地缩短感知时间，但在跨越数万光年的尺度上，你依然要在那个不到几十平米的密封空间里独自待上很久。如果你感到精神压力过大，随时可以启动自动巡航进入深度睡眠。”lock推了推圆框眼镜，目光坚定地注视着主控屏幕上那条横跨了整个螺旋星云的细长航线。“不……我想全程清醒着。”她轻声回应，手指在控制面板上熟练地跳动，“我想亲眼看着我们是怎么跨越这片星海的。这是‘企业’号的使命，也是我的。”“随便你吧。反正你是驾驶员。”CHU²顿了顿，语气稍微柔和了一些，“祝你好运，别在半路把自己弄丢了。”随着磁力锁扣的无声开启，企业号微微一颤，平滑地滑入了月球那灰色的阴影中。紧接着，矢量放大器启动，月球、地球、乃至整个太阳，在不到几分钟的时间里便彻底消失在背景星图中。企业号，正式开启了她有史以来最遥远的孤征。"
 bgbn_voyage.15.a: "就如乘上带小帆的木舟，却将要横跨大洋"

 bgbn_voyage.16.name: "第三次航行——2"
 bgbn_voyage.16.desc: "航行进入第十天时，时间感开始变得模糊。在曲速状态下，窗外的星光被拉伸成了永恒不变的、带有某种神圣感的线条。由于结构完整性力场的存在，lock感觉不到任何运动的实感。如果不是仪表盘上那不断跳动的坐标读数，她甚至会怀疑自己是不是正坐在一个被世界遗忘的静态标本盒里。星舰内部的奇异粒子流场将一切加速度都均匀地抵消了，连她杯中的咖啡液面都平稳如镜。这种极端的静谧在起初是令人安心的，但随着时间的推移，一种被称为深空幽闭感的心理压力开始悄悄侵蚀她的感官。为了对抗这种寂静，lock开始习惯性地检查飞船的各项热性能。“引擎短舱温度……在基准值浮动。”“结构完整性力场谐振频率……稳定。”在长达数万光年的连续运行中，曲速引擎产生的废热平衡是巨大的技术难点。通过舷窗向后看去，她能隐约看到飞船后部的散热片阵列正散发着亮眼的红光，将难以利用的废热散发到冰冷的真空中。当星舰横跨银河系的两大主旋臂——人马座旋臂和英仙座旋臂时，窗外的景象发生了一次壮丽的更迭。原本稀疏的星光线条变得异常密集且明亮。数以亿计的恒星汇聚成了一股发光的洪流，在“企业”号的两侧呼啸而过。那一刻，六花感觉自己像是驾驭着一艘小船，正航行在一条由光构成的长江上。那是银河系的血脉，是千亿颗星辰呼吸交汇的地方。但在这种繁华的景象背后，是令人绝望的距离感。即便以现在的航速，穿越一处星流也需要数日。lock在笔记中写道：“我们总是说宇宙是广袤的，但只有当你真正坐在这里，看着一个旋臂在你身边整整移动了三天却依然看不到尽头时，你才会明白广阔这个词在造物主面前是多么的苍白无力。”她偶尔会打开通讯器，尝试去捕捉远方大少女乐团国的信号。但在数万光年的尺度下，那些信号即便经过了灵能增幅，也变得如同风中残烛，支离破碎。现在的她，是这片星系里最孤独的灯火。"
 bgbn_voyage.16.a: "可她不会被宇宙的遥远和寒冷而熄灭"

 bgbn_voyage.17.name: "第三次航行——3"
 bgbn_voyage.17.desc: "经过了漫长的航程，原本密集的恒星流开始迅速消散。仪表显示，企业号已经越过了银河系最外缘的分子云带。这里的物质密度跌落到了一个惊人的程度，每一颗恒星之间的平均距离都被拉长到了原来的数倍。“曲速矢量，开始逐步下调。”lock的声音有些嘶哑。随着推力杆缓慢回拨，那种拉伸的星光线条开始缩短、断裂，最终重新凝聚成了点点繁星。当星舰最终完全脱离曲速状态，静止在虚空中时，lock被眼前的景象震撼得久久不能言语。这里是银河系的边缘，是物质圆盘的终点。前方是纯粹的、无边无际的黑暗。在那黑暗的最深处，偶尔能看到几个朦胧的、发光的斑块，那是仙女座星系或麦哲伦云在数百万光年外投下的虚影。在那里，连时间似乎都失去了意义。而当lock操纵飞船进行了一个一百八十度的大转向后，她看到了此生见过的、最足以支撑她灵魂一辈子的奇观。整个银河系。在七万六千光年外的这个观测点上，她第一次以全景视角从侧上方俯瞰了自己的母星系。那是一个巨大得超乎想象的螺旋圆盘。银心的位置散发着炽热而神圣的乳白色光辉，像是上帝在宇宙中心点燃的一盏永恒的明灯。从核心向外，数条巨大的旋臂带着优雅的弧度蜿蜒展开，上面点缀着无数蓝色的新星、红色的巨星以及绚烂的星云，就像是洒在深蓝色天鹅绒上的钻石粉末。那些曾经让lock感到畏惧的旋臂，从这个角度看去，却显得如此精致、如此脆弱。整个千亿恒星的集合体，在深邃的宇宙背景下，像是一朵正静静旋转、缓慢呼吸的银色花朵。“这就是……我们的家啊。”lock摘下了眼镜，用袖口擦了擦眼角溢出的泪水。在跨越了数万光年的孤独与黑暗后，看到这朵盛开在虚无中的花朵，让她感受到了一种前所未有的归属感。在大少女乐团国的历史中，人类从未从这个角度审视过自己。他们曾在那些微小的尘埃点上争吵、战斗、欢笑，却从未意识到，自己其实是这幅宏大画卷中如此美丽、又如此渺小的一部分。"
 bgbn_voyage.17.a: "“大少女乐团国……一定会走向更远的地方。”她轻声说道，对整片星空许愿。"

 bgbn_voyage.18.name: "第三次航行——4"
 bgbn_voyage.18.desc: "回航的过程是一次加速的梦境。这一次，lock不再感到孤独。因为她知道，在那个闪耀的螺旋深处，有她的家，有她的同伴，有一切赋予她生命意义的灯火。当星舰重新切入猎户座旋臂，星光再次变得稠密且温暖时，lock感觉到一种久违的雀跃。她开始在频道里尝试呼叫月球基地的频率。“……这里是星舰‘企业’号……呼叫多维空间研究所……”起初只有嘈杂的背景噪声，但在跨越了数万光年后，一个断断续续、却无比清晰的声音穿透了干扰。“……收到！Lock！是你吗？天呐，你居然真的已经跨过了核心区！”那是PAREO的声音，兴奋得几乎要破音了。“是我，我回来了。所有的系统都运行良好，我……我还带回了银河系的照片。”“快点回来！CHU²已经下令准备最高规格的接风宴了！虽然她嘴上不说，但她这半个月盯着雷达看的次数比喝咖啡的次数还多！”lock忍不住笑了起来，眼眶微微湿润。“怎么样？银河的边缘冷吗？”MASKING在频道里笑着问。lock想了想，轻声回答道：“很冷，也很空。相比起来，当我回头看向我们的家时，我觉得那是整个宇宙最温暖、最闪耀的地方。”当企业号最终减速，那颗蔚蓝色的地球再次出现在视野前方时，lock感觉到整艘船都在欢快地颤动。银灰色的极化船壳在阳光的照耀下，折射出一种历经沧桑后的光泽。"
 bgbn_voyage.18.a: "星舰划过长长的弧线，精准地滑入了月球泊位的轨道。"

 bgbn_voyage.19.name: "第四次航行——1"
 bgbn_voyage.19.desc: "月球泊位的气闸舱门缓缓合拢，将那些喧嚣的欢呼声隔绝在厚重的合金门外。朝日六花坐在“企业”号的驾驶席上，这一次，她没有立刻检查系统，而是静静地看着窗外那片熟悉的荒凉月表。在经历了七万六千光年的壮举后，她的名字已经刻在了大少女乐团国的史册上。但她知道，真正的“试航”远未结束。“Lock，我还是要再次提醒你一遍，你这次的目标在三千七百光年外，但这一次，距离不是重点。”指挥塔台内，CHU²的声音带着一种罕见的凝重。“你的航行目标是一个正在互相吞噬的双星系统。红巨星的大气被中子星强行剥离，形成了一个极其不稳定的吸积盘。即使我们已经在这个系统附近观察了很久，那依旧是一个极度危险且难以预测的地方，我们缺少在这一类极端环境中安全航行的可参考信息。我还是强烈反对你亲自驾驶企业号进行这一次试航。”“但也因此，才需要人亲自去开拓这类航线。”lock推了推圆框眼镜，目光落在仪表盘那不断跳动的引力波曲线上。这一次，企业号的载重略有增加，额外的传感器阵列被安装在星舰两侧的引擎短舱上。lock轻触控制台，星舰缓缓脱离磁力锁扣。“结构完整性力场，全功率待命。偏导护盾，将X射线防护频率纳入增强防御范围。”随着推进杆被推前一个挡位，企业号在黑暗中划出一道银色的弧线，悄无声息地滑向了目标坐标。"
 bgbn_voyage.19.a: "愿恒星风庇佑我翱翔"

 bgbn_voyage.20.name: "第四次航行——2"
 bgbn_voyage.20.desc: "跨越三千七百光年的航程，在曲速驱动的矢量放大下，原本应该是一场静谧的旅行。然而，当星舰即将切入预定坐标时，lock敏锐地察觉到了不对劲。舰桥内的幽蓝色应急灯闪烁起来，那是结构完整性力场检测到外界重力梯度异常剧增的信号。“引力反馈纠偏系统报告异常——”lock瞳孔骤缩。窗外原本拉伸成线的星光突然破碎，呈现出一种恐怖的、扭曲的放射状。曲速引擎发出的不再是平稳的低鸣，而是尖锐的哮喘声。“脱离曲速！立刻！”她果断扳下了紧急制动闸。在这一瞬间，现实世界以一种暴戾的姿态撞向了企业号。当那种扭曲的视觉残留消失时，lock被舷窗外的景象剥夺了呼吸。在星舰的正前方，大约几百万公里的位置——这在天文学尺度上几乎是贴脸的距离——一颗散发着冷冽蓝白色光芒的小点，正静静地悬浮在虚空中心。它太小了，甚至看起来不如月球大，但它周围的空间却像是被揉皱的纸张，呈现出极度夸张的透镜效应。那是中子星。而在中子星的后方，更远的地方，一轮占据了大半个视野的、暗红色的庞然大物正翻涌着炽热的等离子火焰。那是红巨星，它那庞大得无法想象的身躯正被前方那个小小的“蓝白点”疯狂拉扯，一道由恒星物质构成的火桥横跨虚空，壮丽而惨烈。“糟糕……”lock看向雷达。由于中子星那极高的密度导致了周围时空的剧烈扭曲，导航系统在脱离曲速的瞬间计算错误，将企业号直接丢在了双星系统的引力井中。更致命的是，星舰此时的速度矢量完全被中子星捕捉。“速度正在呈指数级攀升，方向指向中子星质心。本舰高度不建议现在启动曲速驱动。”星舰像是一颗被磁铁吸住的铁钉，正以不可思议的速度向那颗致密星坠落。如果此时开启曲速尝试逃逸，放大后的速度矢量将在一微秒内让企业号直接撞碎在中子星那硬度超过钢铁千万倍的表面。"
 bgbn_voyage.20.a: "必须寻找其他逃逸方案！"

 bgbn_voyage.21.name: "第四次航行——3"
 bgbn_voyage.21.desc: "“警告：重力梯度超过结构完整性力场额定阈值。奇异粒子流场正在尝试中和引力。”舰桥的地板开始发出轻微的咯吱声。对于lock来说，这声音比任何爆炸都要恐怖。因为这说明，外界的引力差已经大到了即便在星舰内部，头脚之间的重力都开始出现明显不一致的地步。如果不是结构完整性力场这种超前技术强行将每一处受力均匀分摊给全舰，此刻lock的身体早已变成了一滩支离破碎的肉泥。她深吸一口气，强迫自己进入那种极度冷静的状态。“既然无法直接逃离，那就必须利用它。”lock下令开启了星舰底部和侧面的所有姿态调节喷头，将星舰的船体旋转了180度，随后，全力运转的主引擎喷射出明亮的射流，尽全力的拖延引力将她与星舰拉向这颗炽白深渊的步伐。偏导护盾在高频的电离辐射下变形成了一个极度扭曲的锥形。此时，企业号距离中子星已经非常近了，她甚至能想象到那个致密星球表面那由于极速自转而产生的、如同地狱般的磁场线。那里的磁场与引力场强度足以从原子层面粉碎生命。“展开光帆。最大面积。”随着指令发出，星舰侧舷的舱盖弹开，数面薄如蝉翼、面积却远超星舰表面积数个数量级的超薄反射膜在真空中迅速铺展开来。这种原本用于亚光速远航的实验装置，此刻成了lock唯一的救命稻草。中子星并非只是一个沉静的引力源，它是一个疯狂的喷泉。由于正在大量吸积红巨星的物质，中子星的南北两极正喷射出横跨光年的等离子射流。“抓住那股风……”lock操纵着光帆的倾斜角度。当中子星散发出的高能带电粒子流撞击在帆面上时，一股微弱但持续的推力从侧面传来。企业号在坠落的过程中，被这股“风”稍微推离了垂直下坠的轨道。中子星发出的高能射线正在剥离船壳表层的分子，lock能看到屏幕上显示的船体装甲厚度在不断波动。微观充能粒子在疯狂地奔跑、重组、汽化，再重组。星舰的外壳在暗红色的背景下，散发出一种近乎透明的、带有绝望感的银光。飞船擦着中子星的边缘划过，那是一个极窄的窗口。如果太近，光帆会被引力直接扯碎；如果太远，推力不足以改变轨迹。lock盯着那逐渐逼近的蓝白光点，汗水顺着额角流下，打湿了她眼镜旁的发梢。利用光帆提供的侧向矢量，企业号在中子星周围划出了一个惊心动魄的弧度。"
 bgbn_voyage.21.a: "她利用这股加速度，向着后方那颗庞大如墙的红巨星冲去。"

 bgbn_voyage.22.name: "第四次航行——4"
 bgbn_voyage.22.desc: "环境光线开始从冷冽的蓝白转为狂暴的暗红。红巨星表面那巨大的对流层像是一片无边无际的火海，火舌在太空中舔舐，高度甚至超过了地球的直径。lock能感觉到舱室内的温度正在缓慢爬升。“利用红巨星的质量……我们要在这里完成一次加速。”这是一种赌徒式的行为。她利用两颗恒星之间互相牵引的引力平衡点，在这条死亡走廊中寻找那条唯一的生路。企业号收起受损严重的光帆。现在，她已经获得了足够的初始动能。在红巨星巨大的引力弯曲下，星舰被再次拉偏轨道。两股完全不同量级的引力在中空进行着拉锯战，而企业号就是那根风暴中的稻草。“结构完整性力场负载百分之一百二十。奇异粒子流产生热坍缩倾向。”“挺住啊！”lock忍不住喊出了声。当星舰绕过红巨星的大气边缘，速度已经攀升到了一个令人绝望的程度。那是真正意义上的亚光速巅峰。不需要启动曲速。利用两颗天体接力般的引力加速，原本坠向深渊的动能被完美的转化为了逃逸的势能。企业号像是一颗被宇宙级投石机甩出的弹丸，被这两个天体疯狂的甩了出去。窗外的红巨星火海飞速退去，中子星那个小小的恶魔之眼也逐渐消失在黑暗的背景中。仪表盘上的相对速度读数最终定格在一个惊人的数字上——零点五倍光速。在这种速度下，甚至连三维空间的物体看上去都产生了显著的长度收缩。“……我们出来了。”lock虚脱地瘫坐在椅子上。直到此时，她才感觉到全身的肌肉都在抽搐。她的手指已经因为过度紧张而变得麻木，眼镜掉在了脚边，视野一片模糊。但她不禁笑出了声。"
 bgbn_voyage.22.a: "在那片被死亡阴影笼罩的虚空中，她演奏出了一场从未有过的、关于重力与意志的交响乐。"

 bgbn_voyage.23.name: "第四次航行——5"
 bgbn_voyage.23.desc: "回程的路途异常寂静。由于船体结构在高重力环境下遭受了微米级的应力损伤，lock没有启动高倍率曲速。星舰以一种缓慢且略显蹒跚的姿态，在星海中独自飘荡。极化船壳呈现出一种古怪的暗灰色，那是受损粒子在低能状态下进行深层自愈的特征。“Lock，听到请回答。”CHU²的声音再次传来，这一次，是实时的。通讯信号在星舰脱离引力井后终于恢复了畅通。“我……我还在。”lock捡起眼镜重新戴上，声音有些沙哑。“你的数据包我们已经收到了。那是一场……难以置信的飞行。说实话，远处的恒星研究站人员甚至已经开始发来草拟的事故报告了。”“我还没打算止步在这里。”lock看着远方那颗微小的白点——那是太阳的方向。当企业号再次出现在月球轨道时，她不再是出发时那副光鲜亮丽的模样。船身上布满了细微的、由于高能射线洗礼留下的痕迹，那是星辰在它身上留下的勋章。没有接风洗礼的狂欢。当lock走下星舰时，她看到的是RAS成员们通红的眼眶和焦急的脸庞。“六花！”MASKING第一个冲上来抱住了她，力气大得几乎要再次挑战她的结构完整性。“我没事……真的。”lock轻轻拍着同伴的背。她回头看向静静躺在泊位里的企业号。这艘星舰在经历了死亡的华尔兹后，似乎变得更加深邃了。"
 bgbn_voyage.23.a: "即使是无穷的重力，也要为我们的梦想让路。"

 bgbn_voyage.24.name: "第五次航行——1"
 bgbn_voyage.24.desc: "月球的尘埃在远处的开采车轮下微微扬起。朝日六花站在“企业”号下方的检修平台上。此时的银色星舰已经看不出半点在双星系统中被摧残过的痕迹，极化船壳在冷光灯下折射出一种近乎神圣的辉光。这一趟航程，她不再是那个初出茅庐、会因为发动机轰鸣而心惊胆战的新晋驾驶员。她的眼神中沉淀了一种只有凝望过万千光年虚空后才会拥有的平静。“最后一次检查，Lock。”CHU²的声音通过耳麦传来，带着一种少有的柔和。在塔台的监控幕墙上，那颗位于银河系最深处、统治着千亿星辰的“怪兽”正静静地跳动着引力波的脉搏。“这也是我们目前能想象到的，最危险也最壮丽的舞台了。如果你觉得累了，我们可以……”“不，CHU²大人。”lock打断了她的话，嘴角带着一丝温和的笑意，她推了推眼镜，“我想去。我想亲眼看看，那个把整片银河系聚拢在一起的‘心脏’，到底是什么样子的。”机库大门缓缓开启，外面的星空如潮水般涌入视野。lock登上了舰桥，那种熟悉的、奇异粒子流场带来的稳固感再次包裹了她。“企业号，启航。”"
 bgbn_voyage.24.a: "星舰划出一道利落的蓝白色光带，瞬间消失在月球的地平线上。"

 bgbn_voyage.25.name: "第五次航行——2"
 bgbn_voyage.25.desc: "两万六千光年的距离，在全功率运作的曲速引擎面前，像是一层被迅速揭开的薄纱。随着矢量放大倍率逐渐回落，lock眼前的世界开始变得拥挤且狂暴。这里是银河系的中心，恒星密度比太阳系周边的”偏远郊区“高出了数千倍。成千上万颗古老的红巨星、蓝巨星与致密星骸在这里交织成一片刺眼的光海。“学习……是有意义的呢。”lock喃喃自语。她吸取了上次在双星系统差点被瞬间捕捉的教训，并没有直接冲向引力最剧烈的核心。在距离人马座A*尚有一段物理安全距离的地方，她锁定了“S2”恒星——那是一颗以极高初速绕转黑洞的巨星。企业号在S2星的背面平稳地脱离了曲速。窗外的景象让lock感到了前所未有的震撼。在这里，夜空不再是黑色的，而是被无数恒星的余晖染成了璀璨的暗金色。而在这一切的中心，一个巨大的、扭曲的空洞正横亘在星海之中。那是人马座A*。虽然它本身不可见，但围绕它旋转的吸积盘却散发出横跨整个电磁波谱的狂暴能量。那是一道由数亿度高温的气体与尘埃构成的光环，像是一条被点燃的巨龙，围绕着那个绝对的虚无疯狂盘旋。lock观察到，在黑洞周围，除了S2，还有数十颗像S62、S4714这样的小个子恒星，它们像是不知疲倦的舞者，在时空几近崩溃的边缘进行着每秒数千公里的死亡俯冲。lock坐在驾驶席上，静静地看了一会儿这幅宇宙级的群星之舞。这一刻，收集数据已经成了次要的任务，她更像是一个跋涉万里的旅者，终于来到了传说中的圣地。"
 bgbn_voyage.25.a: "然后毫不犹豫的再迈出了一步。"

 bgbn_voyage.26.name: "第五次航行——3"
 bgbn_voyage.26.desc: "“所有系统进入峰值状态。结构完整性力场，过载阈值上调。”lock调整了坐姿，双手稳稳地搭在了操纵杆上。这是试航任务的最后一项，也是最狂野的一项：利用曲速驱动的超高速，强行掠过黑洞的侧翼。她操纵星舰调整了姿态，使企业号的龙骨与前方那巨大的吸积盘平面保持绝对平行。“CHU²大人，我要开始了。”“放手去做吧，Lock。我们都在看着。”塔台的声音里充满了屏息以待的紧张。lock猛地推动了推进杆。企业号发出一声低沉的、仿佛自灵魂深处的轰鸣。曲速引擎不再是温和的脉冲，而是化作了一股吞噬真空零点能的洪流。星舰瞬间切入了吸积盘的边缘。那是地狱与天堂的交界处。窗外的一侧是足以瞬间蒸发一切的蓝白色等离子火海，另一侧则是由于引力透镜效应而被扭曲得不成样子的诡异星图——星光在这里被拉扯成了闭合的圆环，时间在这里被无限拉长。黑洞那庞大到足以改变星系演化的引力，像是一只无形的巨手，正试图强行掰弯企业号的航向，将其拉向那个万劫不复的奇点。“不……你抓不住我们的。”lock冷静地注视着屏幕上那条几近断裂的预测轨道。在曲速驱动下，星舰与空间本身融为一体。在黑洞的引力场还没来得及对飞船内部产生致命加速度差之前，企业号已经化作了一道超越光速的银色闪电，擦过黑洞的史瓦西半径外缘。在那一瞬间，lock感觉到了一种前所未有的寂静。她看到了黑洞的视界——那是连光都无法逃脱的绝对黑暗。在那个黑暗的边缘，时空本身似乎都在发出哀鸣。"
 bgbn_voyage.26.a: "伸手摸摸人马座A*"

 bgbn_voyage.27.name: "第五次航行——4"
 bgbn_voyage.27.desc: "紧接着，随着曲速矢量的一次脉冲放大，企业号以一个近乎完美的直线航迹，从那个足以吞噬万物的陷阱中脱身而出。当银心的狂暴光海再次变为背景，当那颗黑色的怪兽被远远甩在身后时，lock听到了舰桥内传来的、代表系统恢复正常的平稳鸣叫声。“……掠过完成。所有参数……均在计算范围内。”她长长地出了一口气，发现自己的手心已经全是汗水。这种感觉与在双星系统时的拼死挣扎不同，这是一种有准备的、对真理的礼赞——也许也算得上是一种调戏。她最后一次操纵飞船转过头，看向那片依然璀璨的银河中心。在那里，大少女乐团国的旗帜还从未到达，但这一刻，人类的意志已经在那片物理规律的终点留下了痕迹。“回航吧。大家一定等急了。”随着最后一次曲速指令的下达，企业号在漆黑的真空中留下了一道优雅的波纹。两万六千光年的距离，在归途中仿佛只是眨眼之间。当那颗熟悉的、蔚蓝色的行星再次出现在lock的视野中时，她感觉到了一种前所未有的宁静。月球基地的港口灯火通明。当银灰色的星舰缓缓滑入泊位，磁力锁扣合拢的“咔哒”声，在lock听来比任何乐章都要动听。舱门开启。月球基地那略显干燥、带着循环风扇味道的空气涌入。六花走下廊桥，看到了一脸傲气却眼眶微红的CHU²，看到了张开双臂的PAREO，看到了在那儿憨笑的MASKING，还有温柔注视着她的LAYER。“我回来了。”六花摘下眼镜，揉了揉眼睛，露出了一个如释重负的笑容。“这种胡来的航行……也就只有你能开得出来了。”CHU²走上前，虽然嘴上不饶人，却用力地握住了lock的手，“恭喜你，研究员朝日六花。从今天起，‘企业’号正式列装。”lock转过头，看向泊位里那艘依然闪烁着银光的星舰。试航结束了。但她知道，这并不是终点。在那些遥远的星云深处，在那些尚未被命名的橙色黄昏里，在大少女乐团国的每一个闪耀的梦想中，新的旅程才刚刚开始。她摸了摸口袋里那枚小小的吉他拨片，又抬头看了看头顶那片深邃的星空。"
 bgbn_voyage.27.a: "在那里，群星依然在歌唱。"